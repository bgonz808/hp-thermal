cargo-features = ["panic-immediate-abort"]

[package]
name = "hp-thermal"
version = "0.3.2-rc.3"
edition = "2024"
authors = ["Robert J Gonzales"]
description = "HP laptop thermal mode control - without the bloat"
repository = "https://github.com/bgonz808/hp-thermal"
license = "MIT"

[features]
# Default build is the minimal thermal tool — no microphone, no DSP.
default = []
# Noise Adapt: mic-based fan-noise measurement that auto-selects a thermal
# mode by how audible the fans are in the current environment. Pulls in the
# audio-capture + FFT engine (audio.rs). Enable with `--features noise-adapt`.
noise-adapt = []

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Rpc",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ErrorReporting",
    "Win32_System_EventLog",
    "Win32_System_RestartManager",
    "Win32_System_Kernel",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Power",
]

# Already pulled in transitively by `windows`; declared directly only so the
# `#[implement]` macro's generated `::windows_core::` paths resolve.
[dependencies.windows-core]
version = "0.62"

# No build-dependencies: build.rs uses only std + the pinned System32/SDK tools it invokes
# by absolute path. (Dropped embed-resource — resources are now compiled by the pinned
# rc.exe directly and the manifest is embedded via the linker; see build.rs.)

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
# PDB sidecar (#40): on MSVC debug info always externalizes to a .pdb. Emit line
# tables only — small, enough to symbolicate a crash / analyze the binary — and keep
# the exe's CodeView debug directory so exe<->pdb GUID/age binds (asserted by #41).
# Deliberately DO NOT set `strip` (it suppresses the PDB on MSVC; measured: no size
# cost here) and DO NOT set `split-debuginfo` explicitly: MSVC already packs debug
# info into the .pdb by default, and `split-debuginfo="packed"` + `lto="fat"` is a
# known-broken combo that silently drops the PDB (rust-lang/rust#104042).
debug = "line-tables-only"
