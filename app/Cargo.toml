cargo-features = ["panic-immediate-abort"]

[package]
name = "hp-thermal"
version = "0.0.1"
edition = "2021"
authors = ["Robert J Gonzales"]
description = "HP laptop thermal mode control - without the bloat"
repository = "https://github.com/bgonz808/hp-thermal"
license = "MIT"

[features]
# Default build is the minimal thermal tool — no microphone, no DSP.
default = []
# Noise Adapt: mic-based fan-noise measurement that auto-selects a thermal
# mode by how audible the fans are in the current environment. Pulls in the
# audio-capture + FFT engine (audio.rs). Enable with `--features noise-adapt`.
noise-adapt = []

[dependencies.windows]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_Services",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Rpc",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RestartManager",
    "Win32_System_Kernel",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com_StructuredStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Power",
]

# Already pulled in transitively by `windows`; declared directly only so the
# `#[implement]` macro's generated `::windows_core::` paths resolve.
[dependencies.windows-core]
version = "0.62"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
strip = "symbols"
