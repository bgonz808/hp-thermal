# cargo-vet config — the "vetted" supply-chain gate.
#
# cargo-deny / cargo-audit answer "does this dependency have a KNOWN-bad signal (CVE, bad
# license, unknown source)?". cargo-vet answers a different question: "has a human — us, or a
# trusted party we import — actually looked at this crate version's code?". It catches the
# malicious-but-no-advisory-yet class (maintainer takeover, typosquat, slow poison) BEFORE the
# ecosystem files a CVE, which is the one thing the known-bad-signal tools structurally cannot do.
#
# We import the audit sets published by Mozilla, Google, and the Bytecode Alliance — they audit
# exactly the widely-used crates this project depends on (the windows-* family, proc-macro2 / syn
# / quote), so most of the tree is covered for free and only the deltas need our own review.
#
# BASELINE (run once before making the gate blocking — see app/supply-chain/README.md):
#   cd app && cargo vet                       # fetches imports, reports unvetted crates
#   cd app && cargo vet regenerate exemptions # grandfather the current tree as exemptions
#   cd app && cargo vet suggest               # proposes [[trusted]] publishers (e.g. windows-*)
# then commit the resulting config.toml / audits.toml / imports.lock.

[cargo-vet]
version = "0.10.0"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

# Exemptions (the grandfathered current tree) and [[trusted]] publisher entries are generated by
# the baseline commands above and committed on first run. Deliberately absent here so they are
# never hand-fabricated — they must reflect the real resolved dependency graph.
