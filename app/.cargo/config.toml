[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
# 256KB stack reserve (default is 1MB). Actual physical memory usage is
# unchanged — Windows demand-pages the stack regardless. This just limits
# the virtual address space reserved and catches runaway recursion sooner.
# Our deepest path (COM/WMI) uses ~40KB, so 256KB gives 6x headroom.
#
# NOTE: /OPT:REF, /OPT:ICF=3, -mergefunc-use-aliases tested — zero effect with lto=fat.
# NOTE: -enable-machine-outliner breaks Windows SEH (.seh_startepilogue corruption).
# control-flow-guard: emit CFG (/guard:cf) indirect-call protection. build-std
# rebuilds std with it too, so protection is whole-binary. Verified via the PE
# DllCharacteristics bit 0x4000.
rustflags = [
    # Statically link the CRT: self-contained exe (no vcruntime140.dll / VC++ redist
    # dependency), and one fewer DLL to search/plant. Measured size delta in commit msg.
    "-C",
    "target-feature=+crt-static",
    "-C",
    "control-flow-guard=checks",
    # stack canaries at the unsafe/FFI boundary; build-std applies it to std too.
    "-Z",
    "stack-protector=strong",
    "-C",
    "link-args=/STACK:262144",
    # Resolve statically-imported DLLs from System32 only (0x800 =
    # LOAD_LIBRARY_SEARCH_SYSTEM32), from the very first load — blocks DLL-planting
    # from the app dir when the elevated installer runs from a writable folder.
    # https://learn.microsoft.com/cpp/build/reference/dependentloadflag
    "-C",
    "link-arg=/DEPENDENTLOADFLAG:0x800",
    # NOTE: /PDBALTPATH is set in build.rs (derived from CARGO_PKG_NAME, not hardcoded
    # here) so the embedded pdb name matches the exe basename. See build.rs.
    # Deterministic link: content-hash the PE timestamp AND the PDB signature (GUID)
    # instead of using random/time values. Without this a PDB gives the exe a fresh
    # random debug-directory GUID every link, breaking byte-for-byte reproducibility
    # ("same tag -> same bytes"). https://learn.microsoft.com/cpp/build/reference/brepro
    "-C",
    "link-arg=/Brepro",
    # BACKWARD-EDGE control flow. control-flow-guard above protects indirect CALLS
    # (forward edge); nothing protected RETURNS until this. /CETCOMPAT marks the image
    # compatible with the CPU's hardware shadow stack, which keeps a protected copy of
    # return addresses and faults if the two diverge -- the direct answer to ROP, which
    # CFG does not address.
    #
    # It is a MARK, not a requirement (MSVC docs: "tells the linker to mark the binary as
    # CET Shadow Stack-compatible"). Windows enables shadow stacks only where CPU and OS
    # support them AND the image opts in; on hardware without CET there is simply nothing
    # to enable. So this does not narrow the set of machines that can run the binary --
    # every x86_64 CPU still runs it, the ones with CET just run it with more protection.
    # x64-only per the same docs, which is our only target.
    #
    # Measured cost: 0 bytes.
    "-C",
    "link-arg=/CETCOMPAT",
    # MITIGATION COVERAGE, ENFORCED RATHER THAN ASSUMED (RFC 3855). The comment above
    # claims build-std applies our mitigations to std as well. This turns that claim into
    # a machine-checked invariant: the build FAILS if any crate in the graph -- including
    # std and its dependencies -- is compiled without stack-protector or control-flow-guard.
    #
    # Without build-std it produces hard errors against the prebuilt std, which is the
    # correct outcome: partially-applied mitigations are the dangerous case, because the
    # binary carries the flag and the reassurance while leaving gaps.
    #
    # Upstream intends to make this the default (rust-lang/rust#157941). Adopting it now
    # means we pass by construction rather than by luck.
    "-Z",
    "deny-partial-mitigations=stack-protector,control-flow-guard",
]

[unstable]
# Rebuild std with our profile settings (opt-level=z, lto=fat).
# Requires rust-src component (provided by rust-toolchain.toml).
build-std = ["std", "panic_abort"]
build-std-features = ["optimize_for_size"]
