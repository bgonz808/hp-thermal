# TOOLS.lock — prebuilt build-tool binaries, verified by digest when a consumer job runs them.
#
# These cargo-* utilities run DURING builds/CI but never ship inside hp-thermal.exe.
# They are pinned by immutable git rev (content-addressed) + --locked (their whole dependency
# tree is frozen). CAVEAT (#176): `cargo install` is NOT byte-reproducible — the SAME rev builds
# to DIFFERENT bytes across build-tools.yml runs. So the sha256 (bound to a SPECIFIC producer run),
# not the rev, is the true anchor. And because build-tools.yml rebuilds + --clobber-republishes ALL
# tools each run, bumping ANY rev re-digests EVERY tool — re-bless all six from that same run.
#
# Fields:  name  repo  rev  target  sha256
#   name    — crate AND binary name (`cargo install <name>`).
#   rev     — human-edited. THE pin for which source commit to build.
#   target  — which producer job builds it and which asset name it publishes under (#221):
#               windows-x86_64 -> asset `<name>.exe`
#               linux-x86_64   -> asset `<name>-linux-x86_64`   (cackle/cargo-acl is Linux-only)
#   sha256  — OUTPUT of .github/workflows/build-tools.yml, reviewed when committed. This digest
#             is the execution authorization; an all-zero digest means "not blessed yet" and
#             fails closed in every consumer.
#   # vX.Y.Z — trailing comment, HUMAN-READABILITY ONLY (zero trust weight; the sha256 is the
#             integrity anchor, the rev the source pin). Aids bump review ("0.20.2 -> 0.21.0")
#             and CVE lookups. Parsers strip inline comments. Claimed by the maintainer at bump
#             time; #205 will have the producer verify it against the built exe's --version.
#
# Consumers fetch + verify via .github/actions/fetch-tools (release.yml, supply-chain.yml).
