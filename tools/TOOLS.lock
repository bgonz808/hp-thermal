# TOOLS.lock — prebuilt build-tool binaries, verified by digest when the release job consumes them.
#
# These four cargo-* utilities run DURING the build but never ship inside hp-thermal.exe.
# They are pinned by immutable git rev (content-addressed) + --locked (their whole dependency
# tree is frozen). CAVEAT (#176): `cargo install` is NOT byte-reproducible — the SAME rev builds
# to DIFFERENT bytes across build-tools.yml runs. So the sha256 (bound to a SPECIFIC producer run),
# not the rev, is the true anchor. And because build-tools.yml rebuilds + --clobber-republishes ALL
# tools each run, bumping ANY rev re-digests EVERY tool — re-bless all four from that same run.
#
# Fields:  name  repo  rev  sha256(<name>.exe, windows-x86_64)
#   rev     — human-edited. THE pin for which source commit to build.
#   sha256  — OUTPUT of .github/workflows/build-tools.yml, reviewed when committed. This digest
#             is the immutability ANCHOR: the `tools` GitHub release is just a byte store, and
#             the release job fails closed on any mismatch. An all-zero digest means
#             "not built yet — run build-tools.yml and commit the printed value".
#
# Dependabot does NOT track these (it manages Cargo.lock deps and `uses:` action pins, not
# `cargo install --git --rev`). The scheduled .github/workflows/tool-updates.yml is the
# purpose-built substitute: it opens an issue when an upstream cuts a release newer than `rev`.
#
# name             repo                               rev                                       sha256
