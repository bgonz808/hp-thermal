name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, and this workflow uses NO secrets. A compromised step can't push,
# open PRs, reach other repos, or exfiltrate credentials — the blast radius is bounded.
permissions:
  contents: read

# PR CI is deliberately TOOLCHAIN-ONLY: fmt / clippy / test via rustup, with NO
# third-party tool installs in this frequent path. Dependency vuln scanning runs
# off-workflow (Dependabot, .github/dependabot.yml). Dep-policy + artifact attestation
# live in release.yml, which installs its tools by immutable git-rev on a read-only,
# secret-less runner.
jobs:
  ci:
    runs-on: windows-latest
    steps:
      # SHA-pinned (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
      # Dependabot (github-actions) proposes reviewed bumps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false   # zizmor: artipacked — don't leave the token in .git

      - name: Install pinned toolchain + components
        run: rustup toolchain install nightly-2026-07-23 -c rust-src -c clippy -c rustfmt

      # Toolchain-native only — no cargo-install of third-party tools here.
      - name: Checks (fmt / clippy / test, both feature configs)
        run: cargo run --manifest-path xtask/Cargo.toml -- ci --fast

  # Read-only security scanning (no secrets, no write scope, egress-audited). LAYERED
  # by design — no single scanner or DB is complete:
  #   harden-runner -> network-egress visibility for the third-party tools below
  #   zizmor        -> GitHub Actions SAST
  #   actionlint    -> workflow lint
  #   osv-scanner   -> Rust deps via OSV.dev (RustSec-COMPLETE). trivy's GHSA-derived
  #                    DB MISSES RustSec: it reported zizmor "0 vulns/448 pkgs" while
  #                    OSV found 3 (incl. a HIGH). OSV enumerates the full Cargo.lock.
  #   trivy         -> secrets / misconfig / license / OS + non-Rust deps
  # First-party actions, SHA-pinned AND Dependabot-tracked (github-actions ecosystem)
  # so pins stay fresh. Residual gap: native C libs behind *-sys crates aren't in
  # Cargo.lock/RustSec (only trivy's OS scan can reach them).
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner (egress blocked)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # BLOCK: allowlist reconciled against a real audit run (2026-07-24) — every
          # endpoint the job actually contacts is listed, so nothing else can egress.
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            results.step-security.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: zizmor (GitHub Actions SAST)
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5  # v0.6.1
        with:
          version: "1.28.0"           # pin the TOOL too (vetted), not the action's "latest"
          online-audits: "false"      # offline: no network -> quinn-proto path unreachable
          advanced-security: "false"  # no SARIF upload -> job stays contents:read only

      - name: actionlint (workflow lint)
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

      - name: osv-scanner (RustSec-complete Rust deps)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

      - name: trivy (secrets / misconfig / license / OS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"
