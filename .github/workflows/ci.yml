name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, and this workflow uses NO secrets. A compromised step can't push,
# open PRs, reach other repos, or exfiltrate credentials — the blast radius is bounded.
permissions:
  contents: read

# PR CI is deliberately TOOLCHAIN-ONLY: fmt / clippy / test via rustup, with NO
# third-party tool installs in this frequent path. Dependency vuln scanning runs
# off-workflow (Dependabot, .github/dependabot.yml). Dep-policy + artifact attestation
# live in release.yml, which installs its tools by immutable git-rev on a read-only,
# secret-less runner.
jobs:
  ci:
    runs-on: windows-2025
    steps:
      # SHA-pinned (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
      # Dependabot (github-actions) proposes reviewed bumps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false   # zizmor: artipacked — don't leave the token in .git

      - name: Verify MSVC toolchain authenticity (before anything compiles)
        uses: ./.github/actions/verify-msvc

      - name: Install pinned toolchain + components
        uses: ./.github/actions/install-toolchain

      # The app's dependencies are vetted FAIL-CLOSED here, in the required check, on every PR and
      # push: a crate version that is not audited, covered by an imported audit, or exempted at
      # that exact version fails. Exemptions are recorded debt ("Pending audit"); paying one down
      # is `cargo vet certify`. The binary is the TOOLS.lock-pinned cargo-vet (#221), run by
      # absolute path; nothing is installed.
      - name: Fetch + verify cargo-vet (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-vet
          verify-attestations: "true"

      - name: cargo vet (app tree, fail-closed)
        working-directory: app
        shell: bash
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: |
          set -euo pipefail
          # cargo-vet reads $CARGO, which cargo sets only for `cargo vet`; this runs the pinned exe.
          CARGO="$(rustup which cargo)"
          export CARGO
          [ -x "$CARGO" ] || { echo "::error::cannot resolve cargo for CARGO env"; exit 1; }
          "$TOOLS_DIR/cargo-vet.exe" vet --locked

      # Toolchain-native, or digest-pinned through fetch-tools; nothing is cargo-installed here.
      # Hardening flags live in TWO non-merging sources (app/.cargo/config.toml for the app,
      # RUSTFLAGS in build-tools.yml for the tools). Adding a flag to one leaves the other
      # silently unhardened, and nothing else would notice. This asserts the common set is in
      # both -- it deliberately says nothing about the flags that differ on purpose.
      - name: Hardening flags present in every windows build path
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- verify-hardening-flags

      # #376: every runs-on label in the workflows has a lifecycle record, none is inside its
      # deprecation window, and the records conform to the digest-pinned OpenEoX Core schema.
      # Offline here; the weekly monitor adds the endoflife.date cross-check.
      - name: EoX records + runner-image lifecycle windows
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- eox-check

      # Time bounds the scheduled checks read (tool release lag, toolchain age, sandbox NOT READY)
      # parse as one policy: fail below warn, warn under the soak floor, or drift from the
      # constants compiled into explore fails here, not on the next Monday.
      - name: Cadence policy
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- cadence-check

      - name: Checks (fmt / clippy / test, both feature configs)
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- ci --fast

  # Read-only security scanning (no secrets, no write scope, egress-audited). LAYERED
  # by design — no single scanner or DB is complete:
  #   harden-runner -> network-egress visibility for the third-party tools below
  #   zizmor        -> GitHub Actions SAST
  #   actionlint    -> workflow lint
  #   osv-scanner   -> Rust deps via OSV.dev (RustSec-COMPLETE). trivy's GHSA-derived
  #                    DB MISSES RustSec: it reported zizmor "0 vulns/448 pkgs" while
  #                    OSV found 3 (incl. a HIGH). OSV enumerates the full Cargo.lock.
  #   trivy         -> secrets / misconfig / license / OS + non-Rust deps
  # First-party actions, SHA-pinned AND Dependabot-tracked (github-actions ecosystem)
  # so pins stay fresh. Residual gap: native C libs behind *-sys crates aren't in
  # Cargo.lock/RustSec (only trivy's OS scan can reach them).
  scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Harden runner (egress blocked)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          # BLOCK: allowlist reconciled against a real audit run (2026-07-24) — every
          # endpoint the job actually contacts is listed, so nothing else can egress.
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            api.osv.dev:443
            osv-vulnerabilities.storage.googleapis.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            pypi.org:443
            files.pythonhosted.org:443
            results.step-security.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: zizmor (GitHub Actions SAST)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          version: "1.28.0"           # pin the TOOL too (vetted), not the action's "latest"
          online-audits: "false"      # offline: no network -> quinn-proto path unreachable
          advanced-security: "false"  # no SARIF upload -> job stays contents:read only

      - name: actionlint (workflow lint)
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

      # supply-chain/evidence holds committed CycloneDX VDRs (*.cdx.json), which osv-scanner
      # would otherwise ingest as SBOMs: a VDR is the REPORT of the findings already ruled on in
      # acks.jsonl, not a dependency manifest, so scanning it double-counts the tool fleet's
      # informational advisories against this repository. `--x-exclude` with no g:/r: prefix is an
      # exact match on the directory path RELATIVE TO THE SCAN ROOT (scalibr strips the root from
      # the absolute form of the argument, then compares whole strings), so the value is the
      # repo-relative path, not the bare name. No lockfile lives under that directory.
      - name: osv-scanner (RustSec-complete Rust deps)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932  # v2.7.1
        with:
          scan-args: |-
            --recursive
            --x-exclude
            supply-chain/evidence
            ./

      - name: trivy (secrets / misconfig / license / OS)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"
