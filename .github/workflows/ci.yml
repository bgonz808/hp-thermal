name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, and this workflow uses NO secrets. A compromised step can't push,
# open PRs, reach other repos, or exfiltrate credentials — the blast radius is bounded.
permissions:
  contents: read

# PR CI is deliberately TOOLCHAIN-ONLY: fmt / clippy / test via rustup, with NO
# third-party tool installs in this frequent path. Dependency vuln scanning runs
# off-workflow (Dependabot, .github/dependabot.yml). Dep-policy + artifact attestation
# live in release.yml, which installs its tools by immutable git-rev on a read-only,
# secret-less runner.
jobs:
  ci:
    runs-on: windows-latest
    steps:
      # SHA-pinned (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
      # Dependabot (github-actions) proposes reviewed bumps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1

      - name: Install pinned toolchain + components
        run: rustup toolchain install nightly-2026-02-15 --component rust-src clippy rustfmt

      # Toolchain-native only — no cargo-install of third-party tools here.
      - name: Checks (fmt / clippy / test, both feature configs)
        run: cargo run --manifest-path xtask/Cargo.toml -- ci --fast

  # Read-only security scanning: GitHub Actions SAST (zizmor), workflow lint
  # (actionlint), and whole-repo secrets/misconfig/license/dep-vuln (trivy). Runs on
  # ubuntu; scans source only — no secrets, no write scope. Each tool uses its
  # FIRST-PARTY action, SHA-pinned AND Dependabot-tracked (github-actions ecosystem),
  # so pins stay fresh via reviewed bumps — unlike hand-pinned image digests, which
  # rot: a 2026-07-24 vetting pass found stale-base HIGH/CRIT CVEs in the actionlint
  # and trivy images (Go stdlib + Alpine libcrypto/libcurl), though zizmor's Wolfi
  # base + Rust deps were clean. Those are upstream base-image staleness; the
  # read-only, secret-less runner bounds the residual risk until upstream rebuilds.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: zizmor (GitHub Actions SAST)
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5  # v0.6.1

      - name: actionlint (workflow lint)
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12

      - name: trivy (secrets / misconfig / license / dep-vuln)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: "1"
