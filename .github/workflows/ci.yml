name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token, and this workflow uses NO secrets. A compromised step can't push,
# open PRs, reach other repos, or exfiltrate credentials — the blast radius is bounded.
permissions:
  contents: read

# PR CI is deliberately TOOLCHAIN-ONLY: fmt / clippy / test via rustup, with NO
# third-party tool installs in this frequent path. Dependency vuln scanning runs
# off-workflow (Dependabot, .github/dependabot.yml). Dep-policy + artifact attestation
# live in release.yml, which installs its tools by immutable git-rev on a read-only,
# secret-less runner.
jobs:
  ci:
    runs-on: windows-latest
    steps:
      # SHA-pinned (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
      # Dependabot (github-actions) proposes reviewed bumps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1

      - name: Install pinned toolchain + components
        run: rustup toolchain install nightly-2026-02-15 --component rust-src clippy rustfmt

      # Toolchain-native only — no cargo-install of third-party tools here.
      - name: Checks (fmt / clippy / test, both feature configs)
        run: cargo run --manifest-path xtask/Cargo.toml -- ci --fast

  # Read-only security scanning: workflows/actions (zizmor, actionlint) + whole repo
  # (trivy: secrets, misconfig, license, dep-vuln). Runs on ubuntu for the Linux
  # scanner containers; scans source only — no secrets, no write scope. Each tool is
  # pinned by IMMUTABLE image DIGEST (sha256 = the content hash itself). NOTE:
  # Dependabot's github-actions ecosystem does NOT track image digests inside `run:`
  # steps, so bump these by hand (`docker buildx imagetools inspect <img>:<tag>`).
  # Pinned (resolved 2026-07-24): zizmor 1.28.0, actionlint 1.7.12, trivy 0.72.0.
  # NOTE: pins are the real published releases, but their image contents are NOT yet
  # CVE/provenance-vetted (see modernization/scan-vetting backlog). The read-only,
  # secret-less runner is the primary containment until then.
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: zizmor (GitHub Actions SAST)
        env:
          GH_TOKEN: ${{ github.token }}   # read-only; enables zizmor's online audits
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/w:ro" -w /w \
            ghcr.io/zizmorcore/zizmor@sha256:8e6b3e4fb74d1aa5d23e83ea369f386c66eced0d1fb944d32cd8b2aac100b00d \
            .

      - name: actionlint (workflow lint)
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

      - name: trivy (secrets / misconfig / license / dep-vuln)
        run: |
          docker run --rm -v "$PWD:/w:ro" \
            aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            fs --scanners vuln,secret,misconfig,license --exit-code 1 --no-progress /w
