name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 6 * * 1"   # weekly

# Default read-only, no secrets. Only the analyze job elevates, to the single scope
# CodeQL needs (upload SARIF to the Security tab). Actions pinned to full 40-char SHAs.
# SHA-pinned (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (rust)
    # Rust's CodeQL extractor reads SOURCE (build-mode: none) -- no compile/trace -- so
    # the OS is irrelevant; ubuntu-latest is faster/cheaper than a Windows runner.
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF results
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      # init + analyze are the SAME action (github/codeql-action) -> keep both on the
      # SAME pinned SHA.
      # Rust's extractor ONLY supports build-mode: none (manual/autobuild are rejected:
      # "Rust does not support the manual build mode"). none analyzes source directly, so
      # it sidesteps this crate's exotic build entirely (build-std + custom target +
      # panic=immediate-abort) -- no toolchain install or build step needed.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # github/codeql-action v4.37.3
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # github/codeql-action v4.37.6
