name: Build tools pipeline (reusable)

# SLSA Build L3 shape for the tool fleet (GitHub docs: "Using artifact attestations and
# reusable workflows to achieve SLSA v1 Build Level 3"): the producer jobs below -- build the
# fleet, publish to the `tools` release, mint the provenance attestations -- run in THIS
# workflow, invoked by build-tools.yml through `workflow_call`. The Sigstore certificate names
# this file as the signer workflow; consumers (fetch-tools) pin it with
# `--signer-workflow <repo>/.github/workflows/build-tools-pipeline.yml`.
#
# Everything under `jobs:` is the former build-tools.yml content, moved verbatim. The
# `tools-publish` judgment gate (environment) still pauses the run before the first job.

on:
  workflow_call:
    inputs:
      tools_tag:
        description: "Release tag to publish the tool binaries under."
        type: string
        default: tools

permissions:
  contents: read

jobs:
  build-tools-windows:
    # JUDGMENT GATE (#261). Referencing an environment makes the run PAUSE before this job
    # starts, until a required reviewer approves in the repo's environment settings. The pause is
    # pre-execution: no step runs and no OIDC token is minted until approval, so this is an
    # authorization boundary rather than a prompt. It is also durable provenance -- the approval
    # (who, when) is recorded against the run that produced these digests.
    #
    # The stanza is INERT until protection rules are configured (an unprotected environment
    # simply runs), so adding it cannot break the producer; it only creates the place where the
    # maintainer arms the gate.
    environment: tools-publish
    runs-on: windows-2025   # MUST match the release runner OS family.
    permissions:
      contents: write        # create/update the `tools` release + upload assets
      id-token: write        # OIDC -> Sigstore for the provenance attestations
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      # cyclonedx-rust-cargo's deep test-snapshot paths exceed Windows MAX_PATH during the
      # `cargo install --git` checkout. Ephemeral runner, destroyed after the job.
      - name: Enable long paths (ephemeral runner)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      # Previously-blessed cargo-audit, digest-verified, for the per-tool CVE posture below.
      # Bootstrap note: the PRIOR blessing vouches for the auditor of the NEXT candidates.
      # cargo-auditable: the PRIOR blessing builds the NEXT candidates (#386) so every Windows
      # tool carries its `.dep-v0` dependency section — the binary-vantage vuln axis needs it.
      - name: Fetch prior-blessed cargo-audit + cargo-auditable (posture evidence; auditable producer)
        id: audit-tool
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit cargo-auditable
          verify-attestations: "true"
          lock-ref: main

      # NEGATIVE CONTROL ON THE EVIDENCE-PRODUCING AUDITOR (#223). Every posture line below
      # is generated by this prior-blessed cargo-audit, so if it has gone blind the posture
      # evidence is worthless AND reads as reassuring. Demonstrate detection first.
      - name: Canary - prior-blessed auditor must still detect a known-bad (#223)
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.audit-tool.outputs.tools-dir }}
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- canary --tool cargo-audit

      - name: Build windows tools (content-addressed) + posture for ALL tools
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tool-build
          AUDIT_DIR: ${{ steps.audit-tool.outputs.tools-dir }}
          # HARDENING FOR THE TOOLS THEMSELVES (#300). Until now the producer set no RUSTFLAGS,
          # so tools were built with default rustc settings while hp-thermal.exe got the flags in
          # app/.cargo/config.toml -- measured result: every PE tool lacked Control Flow Guard,
          # including cargo-auditable, which is the byte-producing tool that builds the release.
          #
          # control-flow-guard=checks: indirect-call protection (PE DllCharacteristics 0x4000).
          # /DEPENDENTLOADFLAG:0x800: resolve statically-imported DLLs from System32 ONLY, from
          #   the first load. This matters MORE for tools than for the app: tools execute in CI
          #   from writable working directories, which is precisely the DLL-planting scenario.
          #
          # DELIBERATELY NOT +crt-static, though the app uses it. A statically linked CRT stops
          # inheriting Microsoft's CRT security fixes -- the binary carries the vulnerable code
          # until WE rebuild. The app accepts that trade for self-containment; tools run on
          # ephemeral runners whose CRT is patched by the image, so dynamic linking gets those
          # fixes for free. The DLL-planting concern that would otherwise argue for static is
          # already answered by DEPENDENTLOADFLAG above.
          #
          # /CETCOMPAT: backward-edge CFI. control-flow-guard above constrains indirect CALLS;
        #   nothing constrained RETURNS until this. It is a MARK, not a requirement -- hardware
        #   without CET simply has nothing to enable, so no machine loses the ability to run
        #   these tools. Measured cost on the app: 0 bytes.
        #
        # stack-protector is absent because it only covers the whole binary with -Z build-std,
          # which rebuilds std per tool. Tracked separately rather than bundled: a cheap certain
          # win should not wait on an expensive uncertain one.
          #
          # /Brepro (#401): link.exe otherwise writes wall-clock TimeDateStamps and a fresh PDB GUID,
          # so identical inputs produced different digests on every run (measured: 26 bytes, all
          # timestamps + GUID). With /Brepro both derive from a content hash: a producer run that
          # changes nothing reproduces the blessed digests, and the lane is idempotent.
          # The hash decodes to a random year (measured across the fleet: 1990..2077), which sits in
          # a documented timestamp-anomaly heuristic bin, so after linking the SAME `xtask stamp-time`
          # the release lane uses (#104) reconciles every PE timestamp to the pinned upstream rev's
          # commit epoch — a date relevant to the source (reproducible-builds.org/docs/timestamps),
          # fixed by the sha this repo pins, independent of this repo's HEAD (so still idempotent).
          # `verify-timestamp --expect` then proves the stamp landed. ELF carries no timestamp; the
          # linux lane needs neither step.
          RUSTFLAGS: "-C control-flow-guard=checks -C link-arg=/DEPENDENTLOADFLAG:0x800 -C link-arg=/CETCOMPAT -C link-arg=/Brepro"
        run: |
          set -euo pipefail
          mkdir -p out toolroot
          : > out/DIGEST-BLOCK.txt
          build_failures=""
          while read -r name repo rev target _sha; do
            [ -n "${name:-}" ] || continue
            # CVE posture for EVERY tool (target-independent: it audits the rev's lockfile).
            # Evidence, not a gate: failures print loudly; the blessing human sees the gap.
            if curl -sSfL "https://raw.githubusercontent.com/$repo/$rev/Cargo.lock" -o tool.lock 2>/dev/null; then
              if "$AUDIT_DIR/cargo-audit.exe" audit --file tool.lock > audit.out 2>&1; then
                echo "posture($name): cargo-audit clean"
              else
                echo "::warning::posture($name): cargo-audit reported findings (evidence, not gate):"
                # COMPLETE output, never truncated: the tail -20 this replaces hid the majority
                # of findings on the first run (including vuln-class entries) — truncated
                # evidence corrupts triage decisions (#235).
                cat audit.out
              fi
            else
              echo "::warning::posture($name): no Cargo.lock at repo root of $repo@$rev - posture not evaluated"
            fi
            # Build only this job's target.
            [ "$target" = "windows-x86_64" ] || continue
            echo "::group::building $name @ $rev"
            # BUILD-STD OPT-IN (#316), per tool rather than fleet-wide.
            #
            # Rebuilding std lets two more mitigations actually cover the whole binary:
            #   -Z stack-protector=strong        canaries reach std, not just our crates
            #   -Z deny-partial-mitigations      asserts that coverage instead of assuming it
            # Both are meaningless without build-std: canaries would stop at the std boundary,
            # and the assertion fails against prebuilt std BY DESIGN, which is the check working.
            #
            # Why these tools deserve it: every one is a PARSER fed input we do not control --
            # cargo-audit reads lockfiles and a network-fetched advisory-db, cargo-vet reads
            # audits.toml from four third-party orgs, cyclonedx reads arbitrary crate manifests.
            # A memory-safety bug reachable from attacker-influenceable input is exactly what
            # canaries defend, and per #223 a subverted checker's worst failure is returning
            # "clean" rather than crashing.
            #
            # PER-TOOL, not fleet-wide, deliberately: `cargo install --git` plus -Z build-std is
            # a less-travelled combination, and a failure would be specific to one tool's
            # dependency tree. Flipping all five at once would report only "the run failed" and
            # cost a full cycle to bisect. Add a name here once it has been shown to work.
            BUILD_STD_TOOLS="cargo-auditable"
            built=1
            tool_rustflags="$RUSTFLAGS"

            # UPSTREAM LINT ALLOWANCES, per tool and per lint — never fleet-wide, and never a
            # bare `-A warnings`. Each entry names one lint on one tool and says why.
            #
            # cargo-audit: abscissa_core's status_* macros end their arms with a trailing
            # semicolon, and cargo-audit calls them in expression position (a match arm).
            # SEMICOLON_IN_EXPRESSIONS_FROM_MACROS (rust#79813) is deny-by-default on this
            # nightly, so the build fails on 21 sites in upstream's code, not ours.
            #
            # This is an upstream code-shape lint with no bearing on what cargo-audit DOES, so
            # allowing it does not weaken a security property — unlike capping lints wholesale,
            # which would also silence anything real. The durable fix is 12 deleted semicolons
            # in iqlusioninc/abscissa (6 macros, 2 arms each); removing them makes the macros
            # expand to expressions, which is valid in BOTH positions, so no caller breaks.
            # abscissa_core 0.9.0 is the latest published version, so there is no bump to take,
            # and tools/patches/ cannot reach it — it patches the tool's git checkout, and
            # abscissa_core comes from crates.io. Tracked in #325; drop this line when a fixed
            # abscissa_core is released and picked up in tools/locks/cargo-audit.lock.
            # Per-tool RUSTFLAGS from tools/rustflags/<name>, one argument per line: the single
            # source for lint allowances. verify-allowances cross-checks it against the reviewed
            # emission sources after the loop (#325).
            if [ -f "tools/rustflags/$name" ]; then
              while IFS= read -r fl; do [ -n "$fl" ] && tool_rustflags="$tool_rustflags $fl"; done < <(grep -vE '^[[:space:]]*(#|$)' "tools/rustflags/$name")
              echo "rustflags for $name (tools/rustflags/$name): $(grep -vE '^[[:space:]]*(#|$)' "tools/rustflags/$name" | paste -sd' ' -)"
            fi
            # An ARRAY, not a string. A string would have to be left unquoted at the call
            # site to split into separate arguments, and an unquoted expansion also globs --
            # so a stray matching file in the working directory could rewrite the build
            # command. The array carries the word boundaries itself, so the expansion stays
            # quoted. (Same fix as the toolchain action; shellcheck SC2086 caught it here.)
            std_args=()
            case " $BUILD_STD_TOOLS " in
              *" $name "*)
                # build-std requires an explicit --target; it cannot use the host default.
                # The comma belongs to the cargo flag value, not to the array. Quoting says
                # so explicitly -- unquoted, shellcheck reads it as a mis-typed element
                # separator (SC2054), and so would a human skimming it.
                std_args=(-Z "build-std=std,panic_abort" --target x86_64-pc-windows-msvc)
                tool_rustflags="$tool_rustflags -Z stack-protector=strong -Z deny-partial-mitigations=stack-protector,control-flow-guard"
                echo "build-std ENABLED for $name (whole-binary canaries + coverage assertion)"
                ;;
            esac
            # Per-tool build flavor (tools/build-args/<name>): comment/blank lines ignored. A
            # missing file is the empty list; a malformed argument fails `cargo install` loudly.
            tool_args=()
            if [ -f "tools/build-args/$name" ]; then
              mapfile -t tool_args < <(grep -vE '^[[:space:]]*(#|$)' "tools/build-args/$name")
              echo "build-args: ${tool_args[*]}"
            fi
            if [ -f "tools/locks/$name.lock" ]; then
              # FROZEN-LOCK build (#241): upstream's own Cargo.lock pins versions we have
              # deliberately moved off (e.g. yanked/soundness-fixed deps upstream still
              # ships). `cargo xtask freeze` produced this reviewed resolution and proved
              # its advisory delta; we build --locked against IT. Still fully pinned — the
              # deviation is a committed, diffable artifact, not a floating resolve.
              echo "using frozen lock tools/locks/$name.lock"
              rm -rf "src-$name"
              git init -q "src-$name"
              git -C "src-$name" remote add origin "https://github.com/$repo"
              git -C "src-$name" fetch -q --depth 1 origin "$rev"
              git -C "src-$name" checkout -q FETCH_HEAD
              # Downstream patches (tools/patches/<name>/): applied BEFORE the lock overlay.
              # --check first: if upstream's lines changed, the patch is SUPERSEDED or
              # conflicting and the build fails loudly — never silently overrides a rev
              # that fixed things itself (see tools/patches/README.md).
              if [ -d "tools/patches/$name" ]; then
                for pf in "tools/patches/$name"/*.patch; do
                  git -C "src-$name" apply --check "$PWD/$pf"                     || { echo "::error::$pf no longer applies to $repo@$rev — superseded or conflicting; refresh or drop it"; exit 1; }
                  git -C "src-$name" apply "$PWD/$pf"
                  echo "applied $pf"
                done
              fi
              cp "tools/locks/$name.lock" "src-$name/Cargo.lock"
              # Locate the crate BY NAME inside a possibly-monorepo tree — never a
              # hardcoded per-tool path (rustsec/ and cyclonedx-rust-cargo are monorepos).
              manifest=$(cd "src-$name" && cargo metadata --no-deps --locked --format-version 1 \
                          | jq -r --arg n "$name" '.packages[] | select(.name==$n) | .manifest_path' | head -1)
              [ -n "$manifest" ] || { echo "::error::frozen-lock build: crate '$name' not found in $repo@$rev"; exit 1; }
              # 2>&1 | tee: the diagnostics land in diag-<name>.log for verify-allowances
              # to read AFTER the loop. pipefail is set, so cargo's failure still reaches
              # `|| built=0` through the pipe.
              epoch=$(git -C "src-$name" log -1 --format=%ct HEAD)
              SOURCE_DATE_EPOCH="$epoch" RUSTFLAGS="$tool_rustflags" "$AUDIT_DIR/cargo-auditable.exe" auditable install --path "$(dirname "$manifest")" --locked --root ./toolroot "${std_args[@]}" "${tool_args[@]}" 2>&1 | tee "diag-$name.log" || built=0
            else
              # No checkout on this path: fetch just the pinned commit for its epoch.
              rm -rf "rev-$name"; git init -q "rev-$name"
              git -C "rev-$name" fetch -q --depth 1 "https://github.com/$repo" "$rev"
              epoch=$(git -C "rev-$name" log -1 --format=%ct FETCH_HEAD)
              SOURCE_DATE_EPOCH="$epoch" RUSTFLAGS="$tool_rustflags" "$AUDIT_DIR/cargo-auditable.exe" auditable install "$name" --locked --git "https://github.com/$repo" --rev "$rev" --root ./toolroot "${std_args[@]}" "${tool_args[@]}" 2>&1 | tee "diag-$name.log" || built=0
            fi
            # REPORT EVERY FAILING TOOL, not the first. The loop used to exit here, so a
            # ~10-minute run answered "does cargo-audit build?" when the question was "which
            # tools build?" -- and the answer to the second decides whether the fleet can share
            # the app's toolchain at all. Same correction already made to the caps gate (#305);
            # this is the build loop's version of it.
            #
            # Nothing is published either way: the run still exits non-zero at the end, before
            # the attest and upload steps. Continuing buys information, not leniency.
            if [ "$built" -eq 0 ]; then
              build_failures="$build_failures $name"
              echo "::error::$name failed to build on $(rustc -V). Continuing so this run reports every incompatible tool."
              echo "::endgroup::"
              continue
            fi
            # Post-link stamp (#104 pattern, see the /Brepro note above), then prove it. Both are the
            # release lane's own xtask subcommands; nothing is reimplemented here. `env -u RUSTFLAGS`:
            # xtask is a lane utility, not a produced tool, and the later gate steps run it without
            # the producer flags — same fingerprint, one build. A stamp or verify failure is a build
            # failure for this tool (collected, reported with the rest), never a silently unstamped exe.
            if ! env -u RUSTFLAGS cargo run --locked -q --manifest-path xtask/Cargo.toml -- stamp-time "./toolroot/bin/$name.exe" "$epoch"                || ! env -u RUSTFLAGS cargo run -q --manifest-path xtask/Cargo.toml -- verify-timestamp "./toolroot/bin/$name.exe" --expect "$epoch"; then
              build_failures="$build_failures $name"
              echo "::error::$name: PE timestamp stamp/verify failed (epoch $epoch from $repo@${rev:0:12})"
              echo "::endgroup::"
              continue
            fi
            d=$(sha256sum "./toolroot/bin/$name.exe" | cut -d' ' -f1)
            # #225: digest computed FIRST, the asset name derives from it; consumers re-derive
            # the name and re-hash the bytes — the name itself is never trusted.
            cp "./toolroot/bin/$name.exe" "out/$name-${d:0:12}.exe"
            printf '%-18s %-34s %s  %s  %s\n' "$name" "$repo" "$rev" "$target" "$d" >> out/DIGEST-BLOCK.txt
            echo "::endgroup::"
          done < <(grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | sed 's/[[:space:]]*#.*$//')

          # Fail-closed on the collected set. The loop runs in this shell (process
          # substitution, not a pipe), so the accumulator survives the iterations.
          if [ -n "$build_failures" ]; then
            echo "::error::tools that failed to build:$build_failures"
            exit 1
          fi

      # #245: caps-manifest gate BEFORE attest/upload — a tool binary whose import surface
      # diverges from its committed manifest (supply-chain/policy/caps/<name>.json) never
      # gets blessed. Fail-secure: a tool with NO manifest fails here (absence is not a
      # skip), so a newly-added tool must land its reviewed manifest first. This is the
      # binary vantage of the #241 caps axis, the same engine release-attest runs on the
      # app exe — every binary we produce is caps-gated at birth.
      # A workaround that outlives its reason reads as policy, and nothing in CI disagrees.
      # Ratchets on the DIAGNOSTICS THIS BUILD EMITTED (diag-<tool>.log, teed above), not on
      # upstream's code shape -- the allowance exists because the compiler emits a
      # diagnostic, so the diagnostic is the precondition (maintainer review, #325). Runs
      # AFTER the build and BEFORE attest/upload, so an obsolete allowance cannot ride into
      # a published artifact.
      - name: Allowance expiry - every -W must be re-justified by this build's diagnostics (#325)
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path xtask/Cargo.toml -- verify-allowances --diag-dir .

      - name: Caps-manifest gate (each produced tool binary)
        shell: bash
        run: |
          set -uo pipefail
          # Collect ALL violations before failing. Exiting on the first binary hid the posture of
          # the other four on the CFG rollout: one run reported one tool, when the reviewer needed
          # the whole fleet to decide. Same principle as never truncating scanner output (#235) --
          # partial evidence corrupts the decision it is supposed to inform.
          failed=0
          for exe in out/*.exe; do
            name="$(basename "$exe" .exe)"; name="${name%-*}"   # strip -<sha12>
            m="supply-chain/policy/caps/$name.windows-x86_64.json"; [ -f "$m" ] || m="supply-chain/policy/caps/$name.json"
            if ! cargo run --locked --manifest-path xtask/Cargo.toml -- verify-caps "$exe" --manifest "$m"; then
              failed=1
            fi
            # #386: the binary-vantage vuln axis needs cargo-auditable's `.dep-v0` section, and
            # `cargo audit bin` is fail-open without it (partial list from panic strings, exit 0).
            # Presence is proven in-tree here, BEFORE attest/upload.
            if ! cargo run --locked --manifest-path xtask/Cargo.toml -- verify-auditable "$exe"; then
              failed=1
            fi
          done
          [ "$failed" = 0 ] || { echo "::error::one or more caps manifests need review, or a tool lacks .dep-v0 (all violations listed above)"; exit 1; }

      # #205: SLSA provenance, one attestation per subject file, signed via GitHub OIDC ->
      # Sigstore. Verify later with: gh attestation verify <asset> --repo <this repo>
      #   --signer-workflow <this repo>/.github/workflows/build-tools-pipeline.yml   (fetch-tools pins
      #   the signer to THIS workflow; --repo alone would accept any workflow in the repo)
      - name: Attest build provenance (windows tools)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # actions/attest-build-provenance v4.2.2
        with:
          subject-path: out/*.exe

      - name: Emit TOOLS.lock lines to bless
        shell: bash
        run: |
          set -euo pipefail
          echo "=================== copy into tools/TOOLS.lock (re-append version comments) ==================="
          cat out/DIGEST-BLOCK.txt
          echo "==============================================================================================="

      # Content-addressed names never collide, so nothing is overwritten — the store accumulates
      # full history (#225). --clobber retained only for idempotent same-run retries (same name
      # => same bytes by construction).
      - name: Publish windows tool binaries to the tools release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tools_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Prebuilt build tools" \
              --notes "Prebuilt cargo-* build tools consumed by the release + supply-chain workflows. Integrity is anchored by tools/TOOLS.lock digests, NOT by this release. Assets are content-addressed (#225) with per-asset provenance attestations (#205). Rebuilt by .github/workflows/build-tools.yml." \
              --latest=false
          fi
          gh release upload "$TAG" out/*.exe --clobber

  build-tools-linux:
    # JUDGMENT GATE (#261). Referencing an environment makes the run PAUSE before this job
    # starts, until a required reviewer approves in the repo's environment settings. The pause is
    # pre-execution: no step runs and no OIDC token is minted until approval, so this is an
    # authorization boundary rather than a prompt. It is also durable provenance -- the approval
    # (who, when) is recorded against the run that produced these digests.
    #
    # The stanza is INERT until protection rules are configured (an unprotected environment
    # simply runs), so adding it cannot break the producer; it only creates the place where the
    # maintainer arms the gate.
    environment: tools-publish
    needs: build-tools-windows   # serialize: never race the windows job on release creation
    # ubuntu-26.04: cargo-acl's only consumer is caps-measure.yml, which runs cackle's Bubblewrap
    # sandbox. bwrap is broken on 24.04 (upstream cackle CI) and 22.04's runner image is already in
    # deprecation (actions/runner-images#14254: brownouts Mar-Apr 2027, removed 2027-04-17). On
    # 26.04 bwrap 0.11.1 works and cackle's full suite passes (candidate-build run 42657820932).
    # Build and measure on the same image so the glibc floor always matches the lane.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      # #386 step 3: build through the PRIOR-blessed linux cargo-auditable when one exists. The
      # first build of that member is the bootstrap: no blessed linux cargo-auditable yet, so the
      # lane builds plain and SAYS so per binary; the next producer run is auditable end to end.
      - name: Is a linux cargo-auditable blessed yet?
        id: lx-aud
        shell: bash
        run: |
          set -euo pipefail
          zero=$(printf '0%.0s' $(seq 64))
          # The PRIOR-blessed lock (main), same source fetch-tools uses below: a candidate branch
          # that re-pins cargo-auditable itself must still build through the blessed one.
          git fetch -q --depth=1 origin main
          sha=$(git show FETCH_HEAD:tools/TOOLS.lock | grep -vE '^\s*#|^\s*$' | sed 's/[[:space:]]*#.*$//' \
                | awk '$1=="cargo-auditable" && $4=="linux-x86_64" {print $5}')
          if [ -n "$sha" ] && [ "$sha" != "$zero" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "blessed linux cargo-auditable ${sha:0:12}: this run builds through it"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no blessed cargo-auditable linux-x86_64 in TOOLS.lock — BOOTSTRAP run: linux tools build non-auditable (#386 step 3)"
          fi

      - name: Fetch prior-blessed cargo-auditable (linux producer)
        if: steps.lx-aud.outputs.have == 'true'
        id: lx-aud-tool
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: linux-x86_64
          only: cargo-auditable
          verify-attestations: "true"
          lock-ref: main

      - name: Build linux tools (content-addressed)
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tool-build
          LX_AUDITABLE: ${{ steps.lx-aud-tool.outputs.tools-dir }}   # empty on the bootstrap run
        run: |
          set -euo pipefail
          mkdir -p out toolroot
          : > out/DIGEST-BLOCK.txt
          if [ -n "${LX_AUDITABLE:-}" ]; then
            INSTALL=("$LX_AUDITABLE/cargo-auditable" auditable install)
          else
            INSTALL=(cargo install)
          fi
          while read -r name repo rev target _sha; do
            [ "$target" = "linux-x86_64" ] || continue
            echo "::group::building $name @ $rev"
            # Per-tool build flavor (tools/build-args/<name>): comment/blank lines ignored. A
            # missing file is the empty list; a malformed argument fails `cargo install` loudly.
            tool_args=()
            if [ -f "tools/build-args/$name" ]; then
              mapfile -t tool_args < <(grep -vE '^[[:space:]]*(#|$)' "tools/build-args/$name")
              echo "build-args: ${tool_args[*]}"
            fi
            if [ -f "tools/locks/$name.lock" ]; then
              # FROZEN-LOCK build (#241) — see the windows job for the full rationale.
              echo "using frozen lock tools/locks/$name.lock"
              rm -rf "src-$name"
              git init -q "src-$name"
              git -C "src-$name" remote add origin "https://github.com/$repo"
              git -C "src-$name" fetch -q --depth 1 origin "$rev"
              git -C "src-$name" checkout -q FETCH_HEAD
              # Downstream patches (tools/patches/<name>/): applied BEFORE the lock overlay.
              # --check first: if upstream's lines changed, the patch is SUPERSEDED or
              # conflicting and the build fails loudly — never silently overrides a rev
              # that fixed things itself (see tools/patches/README.md).
              if [ -d "tools/patches/$name" ]; then
                for pf in "tools/patches/$name"/*.patch; do
                  git -C "src-$name" apply --check "$PWD/$pf"                     || { echo "::error::$pf no longer applies to $repo@$rev — superseded or conflicting; refresh or drop it"; exit 1; }
                  git -C "src-$name" apply "$PWD/$pf"
                  echo "applied $pf"
                done
              fi
              cp "tools/locks/$name.lock" "src-$name/Cargo.lock"
              manifest=$(cd "src-$name" && cargo metadata --no-deps --locked --format-version 1                           | jq -r --arg n "$name" '.packages[] | select(.name==$n) | .manifest_path' | head -1)
              [ -n "$manifest" ] || { echo "::error::frozen-lock build: crate '$name' not found in $repo@$rev"; exit 1; }
              "${INSTALL[@]}" --path "$(dirname "$manifest")" --locked --root ./toolroot "${tool_args[@]}"
            else
              "${INSTALL[@]}" "$name" --locked --git "https://github.com/$repo" --rev "$rev" --root ./toolroot "${tool_args[@]}"
            fi
            d=$(sha256sum "./toolroot/bin/$name" | cut -d' ' -f1)
            cp "./toolroot/bin/$name" "out/$name-${d:0:12}-linux-x86_64"
            printf '%-18s %-34s %s  %s  %s\n' "$name" "$repo" "$rev" "$target" "$d" >> out/DIGEST-BLOCK.txt
            echo "::endgroup::"
          done < <(grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | sed 's/[[:space:]]*#.*$//')

      # Same engine, ELF vantage (#245). Until the ELF walker existed this job produced the
      # one binary in the fleet with NO capability manifest and NO hardening record, while the
      # windows job's per-binary output made the gate look fleet-wide. Absence of a manifest is
      # a FAILURE here exactly as it is for PE: a newly-added linux tool must land its reviewed
      # manifest before it can be produced.
      - name: Caps-manifest gate (each produced linux tool binary)
        shell: bash
        env:
          LX_AUDITABLE: ${{ steps.lx-aud-tool.outputs.tools-dir }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for exe in out/*-linux-x86_64; do
            found=1
            base="$(basename "$exe")"
            # names carry a -<sha12>-linux-x86_64 suffix; recover the tool name
            name="$(echo "$base" | sed -E "s/-[0-9a-f]{12}-linux-x86_64$//")"
            # A per-target manifest (<name>.<target>.json) takes precedence: the same tool has a
            # PE surface on the windows lane and an ELF surface here.
            m="supply-chain/policy/caps/$name.linux-x86_64.json"; [ -f "$m" ] || m="supply-chain/policy/caps/$name.json"
            cargo run --locked --manifest-path xtask/Cargo.toml -- verify-caps "$exe" --manifest "$m"
            # #386: binary-vantage precondition. GATES once the lane builds through a blessed
            # cargo-auditable; on the bootstrap run (none blessed yet) it warns, once.
            if [ -n "${LX_AUDITABLE:-}" ]; then
              cargo run --locked --manifest-path xtask/Cargo.toml -- verify-auditable "$exe"
            else
              cargo run --locked --manifest-path xtask/Cargo.toml -- verify-auditable "$exe" \
                || echo "::warning::$base has no .dep-v0 — bootstrap build (#386 step 3); the next producer run gates this"
            fi
          done
          # A gate that silently matched nothing would be indistinguishable from a passing one.
          [ "$found" = 1 ] || { echo "::error::no linux tool binaries matched - refusing to report a pass"; exit 1; }

      - name: Attest build provenance (linux tools)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # actions/attest-build-provenance v4.2.2
        with:
          subject-path: out/*-linux-x86_64

      - name: Emit TOOLS.lock lines to bless
        shell: bash
        run: |
          set -euo pipefail
          echo "=================== copy into tools/TOOLS.lock (re-append version comments) ==================="
          cat out/DIGEST-BLOCK.txt
          echo "==============================================================================================="

      - name: Publish linux tool binaries to the tools release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tools_tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" out/*-linux-x86_64 --clobber
