name: supply-chain (cargo-vet)

# The "vetted" gate (proactive axis): every new/changed dependency version must be audited by us,
# covered by an imported trusted-party audit, or exempted with a recorded reason. Complements the
# reactive known-bad-signal gates already in CI (cargo-deny, cargo-audit, osv-scanner), which run
# in the `ci` / release path. Operates on the full Cargo.lock graph (transitive).
#
# STAGED: the gate is REPORT-ONLY (continue-on-error) until the baseline is committed and reviewed
# — see app/supply-chain/README.md. To make it blocking, delete the `continue-on-error: true`
# line on the vet step in a reviewed PR.

on:
  pull_request:
    paths:
      - app/Cargo.toml
      - app/Cargo.lock
      - app/supply-chain/**
      - .github/workflows/supply-chain.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vet:
    # windows-latest (#221): cargo-vet is consumed as a digest-pinned prebuilt exe from
    # TOOLS.lock, and the producer builds Windows binaries for every tool that supports it —
    # one producer target, one blessed artifact, shared with the release path's standard.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install nightly-2026-07-23

      # #221 (maintainer-declared standard): NOTHING runs in CI unless digest-pinned via
      # TOOLS.lock. A crates.io version pin is a NAME the registry resolves (bytes + checksum
      # from one trust domain, plus a full dependency-tree compile executing build scripts every
      # run); the committed digest is a CONTENT COMMITMENT reviewed into this repo. The previous
      # `cargo install cargo-vet --locked --version 0.10.0` here violated that standard.
      - name: Fetch + verify cargo-vet (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-vet

      # --locked: vet the graph exactly as committed, no re-resolution. Report-only until baseline.
      # NO PATH exposure (#221): the verified binary is invoked by absolute path, env-bound —
      # nothing shadowable, no ambient authority for later steps.
      - name: cargo vet
        working-directory: app
        continue-on-error: true   # REMOVE (in a reviewed PR) once the baseline is committed, to enforce
        shell: bash
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: |
          "$TOOLS_DIR/cargo-vet.exe" vet --locked || {
            echo "::warning::cargo vet reported unvetted dependencies. This gate is REPORT-ONLY"
            echo "::warning::until the baseline is committed (app/supply-chain/README.md). It does"
            echo "::warning::NOT block yet. Run 'cargo vet' locally to review."
            exit 1
          }
