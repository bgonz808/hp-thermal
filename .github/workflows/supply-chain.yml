name: supply-chain (cargo-vet)

# The "vetted" gate (proactive axis): every new/changed dependency version must be audited by us,
# covered by an imported trusted-party audit, or exempted with a recorded reason. Complements the
# reactive known-bad-signal gates already in CI (cargo-deny, cargo-audit, osv-scanner), which run
# in the `ci` / release path. Operates on the full Cargo.lock graph (transitive).
#
# STAGED: the gate is REPORT-ONLY (continue-on-error) until the baseline is committed and reviewed
# — see app/supply-chain/README.md. To make it blocking, delete the `continue-on-error: true`
# line on the vet step in a reviewed PR.

on:
  pull_request:
    paths:
      - app/Cargo.toml
      - app/Cargo.lock
      - app/supply-chain/**
      - .github/workflows/supply-chain.yml
      # The vet job EXECUTES the digest-pinned cargo-vet via these — a change to either alters
      # what this workflow runs, so it must re-run to prove itself (#221 follow-up).
      - tools/TOOLS.lock
      - .github/actions/fetch-tools/**
      # The VDR check regenerates every committed report from the evidence beside it, the frozen
      # lock it names and the emitter in xtask: a change to any of them must re-prove the reports.
      - tools/locks/**
      - supply-chain/evidence/**
      - xtask/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # STANDING INSTRUMENT CHECK (#223). The two verdict paths (candidate-eval, build-tools)
  # canary their auditor before trusting it, but both are conditional -- candidate-eval is
  # path-filtered, build-tools is dispatch-only -- so neither gives CONTINUOUS assurance
  # that the blessed auditor still detects. A checker goes blind quietly; the whole point is
  # not to find out only at the moment a verdict matters.
  #
  # Cheap by construction: one tool invocation against one committed fixture, no network
  # beyond fetching the pinned binary, contents:read, no secrets.
  canary:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      - name: Fetch + verify cargo-audit (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit
          verify-attestations: "true"

      - name: Negative control - the auditor must still detect a known-bad
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- canary --tool cargo-audit

  vet:
    # windows-latest (#221): cargo-vet is consumed as a digest-pinned prebuilt exe from
    # TOOLS.lock, and the producer builds Windows binaries for every tool that supports it —
    # one producer target, one blessed artifact, shared with the release path's standard.
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      # #221 (maintainer-declared standard): NOTHING runs in CI unless digest-pinned via
      # TOOLS.lock. A crates.io version pin is a NAME the registry resolves (bytes + checksum
      # from one trust domain, plus a full dependency-tree compile executing build scripts every
      # run); the committed digest is a CONTENT COMMITMENT reviewed into this repo. The previous
      # `cargo install cargo-vet --locked --version 0.10.0` here violated that standard.
      - name: Fetch + verify cargo-vet (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-vet
          verify-attestations: "true"

      # --locked: vet the graph exactly as committed, no re-resolution. Report-only until baseline.
      # NO PATH exposure (#221): the verified binary is invoked by absolute path, env-bound —
      # nothing shadowable, no ambient authority for later steps.
      - name: cargo vet
        working-directory: app
        continue-on-error: true   # REMOVE (in a reviewed PR) once the baseline is committed, to enforce
        shell: bash
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: |
          set -uo pipefail
          # cargo-vet expects $CARGO to be set. Cargo sets it automatically when a subcommand is
          # invoked as `cargo vet`; we invoke the DIGEST-PINNED exe directly (#221, no PATH
          # exposure), so nothing sets it and vet panics with "Cargo failed to set $CARGO" BEFORE
          # evaluating a single crate. Symptom of that gap: this step reported "unvetted
          # dependencies" on every run since adoption while never actually vetting anything.
          CARGO="$(rustup which cargo)"
          export CARGO
          [ -x "$CARGO" ] || { echo "::error::cannot resolve cargo for CARGO env"; exit 1; }
          "$TOOLS_DIR/cargo-vet.exe" vet --locked
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Distinguish the two failure modes. Conflating them is what hid a non-functional
            # gate behind a policy-debt message for its entire life.
            echo "::warning::cargo vet exited $rc. If the output above lists unvetted crates,"
            echo "::warning::is expected policy debt (REPORT-ONLY until the baseline lands, #199)."
            echo "::warning::If it shows a PANIC or usage error, the gate did not run at all -"
            echo "::warning::treat that as a broken control, not as findings."
            exit "$rc"
          fi

      # xtask is the toolchain that evaluates evidence and, via candidate-advance, runs with the
      # maintainer's credentials. Its own tree is vetted FAIL-CLOSED (no report-only phase): the
      # store under xtask/supply-chain/ holds the maintainer's audits, the imported audit sets
      # pinned in imports.lock, and version-pinned exemptions whose claims the guard re-proves.
      - name: cargo vet (xtask tree, fail-closed)
        working-directory: xtask
        shell: bash
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: |
          set -euo pipefail
          CARGO="$(rustup which cargo)"
          export CARGO
          "$TOOLS_DIR/cargo-vet.exe" vet --locked

      - name: vet guard (exempted xtask crates are never compiled, or carry live debt)
        shell: bash
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- vet-guard

      # Committed VDRs (#396) are derived documents: each one must regenerate byte for byte from
      # the evidence it sits beside, the custody-verified raw payload and the acks. The app's VDR
      # takes its component list from the release SBOM, which is fetched and admitted only after
      # its provenance attestation verifies against this repository.
      - name: VDR check (committed reports regenerate from the evidence)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo build --release --locked --quiet --manifest-path xtask/Cargo.toml
          X=xtask/target/release/xtask.exe
          n=0; fail=0; kept=0
          # Tool reports are regenerated only for digests TOOLS.lock pins now. A digest a bless
          # superseded keeps its last report as history (evidence rule 2: blessed evidence is
          # immutable); its binary is no longer pinned, so it is not regenerated. App reports are
          # all checked: each belongs to a published release.
          pinned=$(grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | sed 's/[[:space:]]*#.*$//' | awk '{print $1"/"$5}')
          for f in supply-chain/evidence/*/*/vdr.cdx.json; do
            [ -f "$f" ] || continue
            dir=${f%/vdr.cdx.json}; digest=${dir##*/}; product=${dir%/*}; product=${product##*/}
            if [ "$product" != "hp-thermal" ] && ! grep -qx "$product/$digest" <<<"$pinned"; then
              echo "kept as history (superseded, not pinned): $f"; kept=$((kept+1)); continue
            fi
            n=$((n+1))
            args=(vdr check --product "$product" --digest "$digest")
            if [ "$product" = "hp-thermal" ]; then
              # Find the release whose exe is this digest, then the SBOM shipped beside it.
              tag=""
              for t in $(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName'); do
                if gh release download "$t" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS -O "sums-$t.txt" --clobber 2>/dev/null \
                   && grep -q "^$digest  hp-thermal.exe$" "sums-$t.txt"; then tag=$t; break; fi
              done
              [ -n "$tag" ] || { echo "::error::$f: no release carries exe digest $digest"; fail=1; continue; }
              mkdir -p "rel-$tag"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern hp-thermal.cdx.json --dir "rel-$tag" --clobber
              gh attestation verify "rel-$tag/hp-thermal.cdx.json" --repo "$GITHUB_REPOSITORY" > /dev/null \
                || { echo "::error::$f: release $tag SBOM provenance did not verify; not admitted"; fail=1; continue; }
              args+=(--sbom "rel-$tag/hp-thermal.cdx.json")
            fi
            if ! "$X" "${args[@]}"; then echo "::error::$f: differs from what the evidence regenerates"; fail=1; fi
          done
          echo "VDR check: $n report(s) regenerated, $kept kept as history"
          [ "$n" -gt 0 ] || { echo "::error::no committed VDRs found (fail-closed)"; exit 1; }
          exit "$fail"
