name: supply-chain (cargo-vet)

# The "vetted" gate (proactive axis): every new/changed dependency version must be audited by us,
# covered by an imported trusted-party audit, or exempted with a recorded reason. Complements the
# reactive known-bad-signal gates already in CI (cargo-deny, cargo-audit, osv-scanner), which run
# in the `ci` / release path. Operates on the full Cargo.lock graph (transitive).
#
# STAGED: the gate is REPORT-ONLY (continue-on-error) until the baseline is committed and reviewed
# — see app/supply-chain/README.md. To make it blocking, delete the `continue-on-error: true`
# line on the vet step in a reviewed PR.

on:
  pull_request:
    paths:
      - app/Cargo.toml
      - app/Cargo.lock
      - app/supply-chain/**
      - .github/workflows/supply-chain.yml
      # The vet job EXECUTES the digest-pinned cargo-vet via these — a change to either alters
      # what this workflow runs, so it must re-run to prove itself (#221 follow-up).
      - tools/TOOLS.lock
      - .github/actions/fetch-tools/**
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # STANDING INSTRUMENT CHECK (#223). The two verdict paths (candidate-eval, build-tools)
  # canary their auditor before trusting it, but both are conditional -- candidate-eval is
  # path-filtered, build-tools is dispatch-only -- so neither gives CONTINUOUS assurance
  # that the blessed auditor still detects. A checker goes blind quietly; the whole point is
  # not to find out only at the moment a verdict matters.
  #
  # Cheap by construction: one tool invocation against one committed fixture, no network
  # beyond fetching the pinned binary, contents:read, no secrets.
  canary:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      - name: Fetch + verify cargo-audit (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit
          verify-attestations: "true"

      - name: Negative control - the auditor must still detect a known-bad
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: cargo run --quiet --manifest-path xtask/Cargo.toml -- canary --tool cargo-audit

  vet:
    # windows-latest (#221): cargo-vet is consumed as a digest-pinned prebuilt exe from
    # TOOLS.lock, and the producer builds Windows binaries for every tool that supports it —
    # one producer target, one blessed artifact, shared with the release path's standard.
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      # #221 (maintainer-declared standard): NOTHING runs in CI unless digest-pinned via
      # TOOLS.lock. A crates.io version pin is a NAME the registry resolves (bytes + checksum
      # from one trust domain, plus a full dependency-tree compile executing build scripts every
      # run); the committed digest is a CONTENT COMMITMENT reviewed into this repo. The previous
      # `cargo install cargo-vet --locked --version 0.10.0` here violated that standard.
      - name: Fetch + verify cargo-vet (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-vet
          verify-attestations: "true"

      # --locked: vet the graph exactly as committed, no re-resolution. Report-only until baseline.
      # NO PATH exposure (#221): the verified binary is invoked by absolute path, env-bound —
      # nothing shadowable, no ambient authority for later steps.
      - name: cargo vet
        working-directory: app
        continue-on-error: true   # REMOVE (in a reviewed PR) once the baseline is committed, to enforce
        shell: bash
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: |
          set -uo pipefail
          # cargo-vet expects $CARGO to be set. Cargo sets it automatically when a subcommand is
          # invoked as `cargo vet`; we invoke the DIGEST-PINNED exe directly (#221, no PATH
          # exposure), so nothing sets it and vet panics with "Cargo failed to set $CARGO" BEFORE
          # evaluating a single crate. Symptom of that gap: this step reported "unvetted
          # dependencies" on every run since adoption while never actually vetting anything.
          CARGO="$(rustup which cargo)"
          export CARGO
          [ -x "$CARGO" ] || { echo "::error::cannot resolve cargo for CARGO env"; exit 1; }
          "$TOOLS_DIR/cargo-vet.exe" vet --locked
          rc=$?
          if [ "$rc" -ne 0 ]; then
            # Distinguish the two failure modes. Conflating them is what hid a non-functional
            # gate behind a policy-debt message for its entire life.
            echo "::warning::cargo vet exited $rc. If the output above lists unvetted crates,"
            echo "::warning::is expected policy debt (REPORT-ONLY until the baseline lands, #199)."
            echo "::warning::If it shows a PANIC or usage error, the gate did not run at all -"
            echo "::warning::treat that as a broken control, not as findings."
            exit "$rc"
          fi
