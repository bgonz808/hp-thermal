name: Freeze proposals (strictly-better lock fixes)

# #405 — the automated half of "fix rather than ack". For every tool in tools/TOOLS.lock, find
# advisory instances whose RustSec entry names a patched version, and if a soaked, non-yanked
# version reaches it, run the existing `xtask freeze --require-improvement` (atop the frozen lock
# and the tool's patches, exactly as the producer builds) and soak/yank-check every transitive
# move the resolver made. What passes becomes ONE pull request. What does not is reported.
#
# Three tiers, each with only the authority it needs:
#   compute  — contents: read, no secrets. xtask freeze-propose on windows-2025 (the blessed
#              cargo-audit is a Windows PE; canary first, #223). Output is DATA: locks + report,
#              uploaded as the `freeze-proposal` artifact whose digest GitHub records.
#   notify   — issues: write ONLY. No contents or pull-requests permission: nothing here can push,
#              edit or delete a release, or open a PR. Opens or updates ONE issue with the report,
#              this run's id, the artifact digest, and the command to apply it; it notifies only
#              when the proposal changes.
#   apply    — the maintainer: `cargo xtask freeze-apply --run <id>` checks this run (this workflow,
#              on main, schedule or dispatch, successful) and the artifact's SHA-256 against
#              GitHub's record, writes the locks, and commits them with the maintainer's signing
#              key. The PR runs every required check normally. Nothing merges or is blessed here.
#
# Fail-secure: a freeze refusal (soak, yank, added advisory, zero fixed, unreachable range, a
# transitive move not past soak) produces NO PR and is reported in the run; an instrument or
# network failure fails the compute job (red run), never an empty "nothing to fix".

on:
  schedule:
    - cron: "17 11 * * *"  # nightly, 11:17 UTC; off the hour, where GitHub delays or drops runs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compute:
    runs-on: windows-2025   # the blessed cargo-audit is a Windows PE
    permissions:
      contents: read
    outputs:
      count: ${{ steps.summarize.outputs.count }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Verify MSVC toolchain authenticity (before anything compiles)
        uses: ./.github/actions/verify-msvc

      - name: Fetch prior-blessed auditor (digest + attestation verified)
        id: auditor
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit
          verify-attestations: "true"
          lock-ref: main

      - name: Canary - the auditor must still detect a known-bad (#223)
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
        run: cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- canary --tool cargo-audit

      - name: Compute strictly-better proposals
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path xtask/Cargo.toml -- freeze-propose --out proposal | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summarize
        id: summarize
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          count=0
          [ -f proposal/proposals.json ] && count=$(jq '.proposals | length' proposal/proposals.json)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "proposals: $count"

      - name: Upload the proposal (report, machine-readable list, locks)
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: freeze-proposal
          path: proposal/
          if-no-files-found: warn
          retention-days: 30

  notify:
    needs: compute
    if: needs.compute.outputs.count != '0' && needs.compute.outputs.count != ''
    runs-on: ubuntu-24.04
    permissions:
      issues: write          # the one proposal issue; nothing else
    steps:
      - name: Download the proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # actions/download-artifact v8.0.2
        with:
          name: freeze-proposal
          path: proposal

      - name: Open or update the one proposal issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          DIGEST: ${{ needs.compute.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          key=$(sha256sum proposal/proposals.json | cut -d' ' -f1)
          tools=$(jq -r '[.proposals[].tool] | join(", ")' proposal/proposals.json)
          title="freeze-propose: strictly-better lock fixes available"
          {
            echo "<!-- proposals-sha256: $key -->"
            cat proposal/report.md
            echo
            echo "---"
            echo "From run [$RUN](https://github.com/$R/actions/runs/$RUN), artifact \`freeze-proposal\` ($DIGEST). To apply it, on a new branch:"
            echo
            echo '```sh'
            echo "cargo xtask freeze-apply --run $RUN"
            echo '```'
            echo
            echo "It checks this run and the artifact's digest, writes the locks, and commits them with your signing key; push and open the PR as usual. Nothing is blessed until the producer build, the gate, and your merge."
          } > body.md
          # The bot's own issue only: a look-alike issue opened by anyone else is never edited.
          n=$(gh issue list --repo "$R" --state open --limit 100 --json number,title,author \
                | jq -r --arg t "$title" '[.[] | select(.title == $t and .author.is_bot and (.author.login == "app/github-actions" or .author.login == "github-actions"))][0].number // empty')
          if [ -z "$n" ]; then
            gh issue create --repo "$R" --title "$title" --body-file body.md
          elif gh issue view "$n" --repo "$R" --json body --jq .body | grep -qF "proposals-sha256: $key"; then
            echo "issue #$n already describes this proposal; nothing to notify"
          else
            gh issue edit "$n" --repo "$R" --body-file body.md
            gh issue comment "$n" --repo "$R" --body "Updated by run $RUN: $tools."
          fi
