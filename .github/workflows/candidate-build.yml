name: Candidate build (compile + test evidence)

# The missing sibling of candidate-freeze (#241): resolution proves SATISFIABILITY,
# this proves the candidate COMPILES and its tests pass — on an ephemeral runner,
# because building executes dependency build scripts and proc-macros, which is
# exactly the code we do not run uncaged on a workstation.
#
# Same containment as freeze: NO secrets, contents:read only — this job cannot
# bless, publish, or mutate anything. It reproduces the producer's build recipe
# (pinned rev + tools/patches + tools/locks overlay + --locked) WITHOUT the
# producer's privileges, and uploads a report. Evidence, never artifact.
#
# repo + rev come from the COMMITTED pin — never from dispatch input.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool name as pinned in tools/TOOLS.lock."
        type: string
        default: cargo-vet
      run_tests:
        description: "Also run the tool's test suite."
        type: boolean
        default: true
      cargo_args:
        description: "Extra cargo arguments for build/test. Empty = the tool's tools/build-args file (producer parity)."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # The runner family follows the tool's `target` in TOOLS.lock (cackle is Linux-only).
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Pick the runner from the pinned target
        id: pick
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
        run: |
          set -euo pipefail
          target=$(grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | sed 's/[[:space:]]*#.*$//'                     | awk -v t="$TOOL" '$1==t {print $4; exit}')
          case "$target" in
            windows-x86_64) runner=windows-2025 ;;
            # ubuntu-22.04, not 24.04: cackle's own CI pins 22.04 with the comment "bubblewrap is
            # broken on Ubuntu 24.04" (cackle-rs/cackle .github/workflows/ci.yml @ the pinned rev),
            # and our 24.04 run measured exactly that: `bwrap: loopback: Failed RTM_NEWADDR:
            # Operation not permitted` (run 42550668921). Testing on the image upstream tests on
            # beats relaxing the runner's namespace restrictions. The producer still builds the
            # shipped artifact on 24.04; this lane produces evidence, not artifacts.
            linux-x86_64)   runner=ubuntu-22.04 ;;
            *) echo "::error::'$TOOL': unknown or missing target '$target' in tools/TOOLS.lock"; exit 1 ;;
          esac
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ needs.resolve.outputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (producer parity)
        id: toolchain
        uses: ./.github/actions/install-toolchain
        with:
          components: "rust-src"

      # #368: cackle's fixtures sandbox with Bubblewrap and strip the cargo env, so the test
      # suite needs `bwrap` on the runner and the pinned channel as rustup's DEFAULT (the
      # exported RUSTUP_TOOLCHAIN does not survive the harness's env scrub). bubblewrap comes
      # from the runner image's apt mirror: a TEST-step input only, never part of the built
      # artifact — the one non-digest-pinned input of this step, named here on purpose.
      - name: Test prerequisites (Linux lane)
        if: runner.os == 'Linux' && inputs.run_tests
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          bwrap --version
          rustup default "$CHANNEL"
          rustc --version

      - name: Build the candidate exactly as the producer would
        shell: bash
        env:
          TOOL: ${{ inputs.tool }}
          RUN_TESTS: ${{ inputs.run_tests }}
          CARGO_ARGS: ${{ inputs.cargo_args }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/cand-build
        run: |
          set -euo pipefail
          line=$(grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | sed 's/[[:space:]]*#.*$//' \
                  | awk -v t="$TOOL" '$1==t {print; exit}')
          [ -n "$line" ] || { echo "::error::'$TOOL' is not pinned in tools/TOOLS.lock"; exit 1; }
          repo=$(echo "$line" | awk '{print $2}'); rev=$(echo "$line" | awk '{print $3}')
          echo "building $TOOL from $repo@$rev (producer recipe)" | tee report.txt
          rm -rf src && git init -q src
          git -C src remote add origin "https://github.com/$repo"
          git -C src fetch -q --depth 1 origin "$rev"
          git -C src checkout -q FETCH_HEAD
          if [ -d "tools/patches/$TOOL" ]; then
            for pf in "tools/patches/$TOOL"/*.patch; do
              git -C src apply --check "$PWD/$pf" \
                || { echo "::error::$pf does not apply — superseded or conflicting"; exit 1; }
              git -C src apply "$PWD/$pf"
              echo "applied $pf" | tee -a report.txt
            done
          fi
          [ -f "tools/locks/$TOOL.lock" ] && cp "tools/locks/$TOOL.lock" src/Cargo.lock \
            && echo "overlaid tools/locks/$TOOL.lock" | tee -a report.txt
          manifest=$(cd src && cargo metadata --no-deps --locked --format-version 1 \
                      | jq -r --arg n "$TOOL" '.packages[] | select(.name==$n) | .manifest_path' | head -1)
          [ -n "$manifest" ] || { echo "::error::crate '$TOOL' not found"; exit 1; }
          # Build flavor: explicit input, else the tool's tools/build-args file (what the producer uses).
          extra=()
          if [ -n "$CARGO_ARGS" ]; then
            # shellcheck disable=SC2206
            extra=($CARGO_ARGS)
          elif [ -f "tools/build-args/$TOOL" ]; then
            mapfile -t extra < <(grep -vE '^[[:space:]]*(#|$)' "tools/build-args/$TOOL")
          fi
          echo "== dependency footprint (cargo tree, normal+build edges) ==" | tee -a report.txt
          ( cd "$(dirname "$manifest")" && cargo tree --locked -e normal,build --prefix none 2>/dev/null | awk '{print $1}' | sort -u > "$RUNNER_TEMP/full.txt" && echo "  default features: $(wc -l < "$RUNNER_TEMP/full.txt") packages" ) | tee -a report.txt
          if [ "${#extra[@]}" -gt 0 ]; then
            ( cd "$(dirname "$manifest")" && cargo tree --locked -e normal,build --prefix none "${extra[@]}" 2>/dev/null | awk '{print $1}' | sort -u > "$RUNNER_TEMP/min.txt" && echo "  with [${extra[*]}]: $(wc -l < "$RUNNER_TEMP/min.txt") packages" && echo "  dropped: $(comm -23 "$RUNNER_TEMP/full.txt" "$RUNNER_TEMP/min.txt" | paste -sd' ' -)" ) | tee -a report.txt
          fi
          echo "== cargo build --locked ${extra[*]} ==" | tee -a report.txt
          ( cd "$(dirname "$manifest")" && cargo build --locked "${extra[@]}" 2>&1 ) | tail -30 | tee -a report.txt
          if [ "$RUN_TESTS" = "true" ]; then
            echo "== cargo test --locked ${extra[*]} ==" | tee -a report.txt
            ( cd "$(dirname "$manifest")" && cargo test --locked "${extra[@]}" 2>&1 ) | tail -40 | tee -a report.txt
          fi
          echo "BUILD EVIDENCE: OK" | tee -a report.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # actions/upload-artifact v7.0.2
        with:
          name: candidate-build-${{ inputs.tool }}
          path: report.txt
          if-no-files-found: warn
          retention-days: 30
