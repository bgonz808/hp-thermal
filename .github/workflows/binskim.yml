name: Release artifact checks

# PR-time, path-filtered checks on the RELEASE binary (runs only when build-config / xtask change):
#   - #170 verify-artifact: the IN-HOUSE PE checks (pdb-link GUID bind, exploit-mitigation flags,
#     import ratchet, comctl32 manifest) that FULL `xtask ci` runs at release time but PR CI's
#     `--fast` tier skips — so a build.rs/xtask/linker regression is caught here, not at release.
#   - #160 BinSkim: PE-hardening SAST early-warning (report-only; the release gate is authoritative).
#
# This flags a BinSkim-verdict regression when a hardening-relevant INPUT changes. It is
# explicitly NOT a soundness boundary: exotic source-level changes (#[link_section], inline asm,
# #[no_stack_protector], banned APIs) can move a verdict WITHOUT touching these paths. The
# AUTHORITATIVE, content-complete gate is the release verify-chain scan (Option A, added
# separately), which reads the actual shipped bytes. This filter is the cheap shift-left; Option A
# is what we rely on.
#
# BinSkim is a heavy .NET tool, so it is boxed: read-only job, NO security-events:write (the SARIF
# is an inert artifact; the separate sarif-collect job uploads it to the Security tab), and the
# analysis runs OFFLINE — no --sympath / remote symbol server — against our own local PDB. Only the
# remote symbol server is disabled; the local hp-thermal.pdb still drives the symbol-dependent
# rules (BA2006/2011/2014/2007), so we lose no coverage vs. an online run of our own binary.

on:
  workflow_dispatch:
  pull_request:
    # Best-effort: run only when an input that can change BinSkim's verdict changes. Kept in sync
    # with the audited surface — build config, the toolchain pin (drives BA2006 + gates the
    # unstable mitigation flags), the lockfile (BA2002), and this workflow itself.
    paths:
      - "app/.cargo/**"
      - "app/build.rs"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "app/rust-toolchain.toml"
      - ".github/workflows/binskim.yml"
      - ".github/actions/binskim-scan/**"
      - "xtask/**" # #170: an xtask change (e.g. RELEASE_PDB) can break verify-artifact — see below

permissions:
  contents: read

jobs:
  binskim:
    runs-on: windows-2025
    permissions:
      contents: read # NO security-events:write here — SARIF is an inert artifact (sarif-collect uploads it)
    steps:
      - name: Harden runner (egress audited)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          # AUDIT for the first cut: log egress so a BLOCK allowlist (rustup + static.rust-lang.org
          # + crates.io for build-std, NuGet + dotnet feeds for BinSkim) can be reconciled against a
          # real run — the same methodology the scan job's block allowlist was built with. Tighten
          # to egress-policy: block once the audit is reconciled.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain + rust-src
        run: rustup toolchain install nightly-2026-07-23 -c rust-src

      # Build the SAME hardened binary users get: app/.cargo/config.toml applies the mitigation
      # rustflags (CFG, stack-protector, crt-static, DEPENDENTLOADFLAG) + build-std, and the
      # release profile emits the line-tables-only .pdb next to the .exe.
      - name: Build the hardened release binary
        working-directory: app
        run: cargo build --release

      # #170: run the IN-HOUSE PE checks (pdb-link GUID bind, exploit-mitigation flags, import
      # ratchet, comctl32 manifest) that the FULL `xtask ci` runs at RELEASE time but PR CI
      # (`--fast`) skips — so a build.rs / xtask / linker-arg regression is caught HERE, not at a
      # release attempt. (This is exactly the class that slipped through in #168: xtask's RELEASE_PDB
      # pointed at the old pdb name; only the release build caught it.) No args -> uses the
      # RELEASE_EXE/RELEASE_PDB consts, so it also validates those point at the real build outputs.
      - name: Verify release artifact (in-house PE checks)
        run: cargo run --manifest-path xtask/Cargo.toml -- verify-artifact

      # Shared scan core (.github/actions/binskim-scan): fetch+digest-verify BinSkim, analyze offline
      # against the native hp-thermal.pdb, fail-closed on couldn't-scan. gate-on-findings=false here
      # (PR early-warning is report-only); the release verify-chain calls the SAME action with
      # gate-on-findings=true (authoritative).
      - name: BinSkim scan (PR early-warning; report-only)
        uses: ./.github/actions/binskim-scan
        with:
          exe: app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe
          symbol-dir: app/target/x86_64-pc-windows-msvc/release
          sarif-out: ${{ runner.temp }}/binskim.sarif
          gate-on-findings: "false"

      - name: Upload SARIF (inert artifact; consumed by sarif-collect)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: binskim-sarif
          path: ${{ runner.temp }}/binskim.sarif
          if-no-files-found: warn
