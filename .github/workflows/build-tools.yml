name: Build release tools

# PRODUCER (#138). Compiles the four pinned cargo-* build tools ONCE, off the release
# critical path, and publishes them as assets on the `tools` release. The release job then
# downloads + digest-verifies them instead of recompiling 1192 packages every release.
#
# Trigger is manual: you run this only when a `rev` in tools/TOOLS.lock changes (a deliberate,
# reviewed pin bump — see tools/README.md). Their dependencies are frozen by rev + --locked, so
# nothing else warrants a rebuild.
#
# This workflow SIGNS nothing and holds no signing credential. It builds public pinned source
# and uploads binaries; contents:write is only for the `tools` release. The immutability anchor
# is the digest committed to tools/TOOLS.lock, reviewed by a human — not this workflow's output.

on:
  workflow_dispatch:
    inputs:
      tools_tag:
        description: "Release tag to publish the tool binaries under."
        type: string
        default: tools

permissions:
  contents: read

jobs:
  build-tools:
    runs-on: windows-latest   # MUST match the release runner OS: these are Windows x86_64 exes.
    permissions:
      contents: write         # create/update the `tools` release + upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install nightly-2026-07-23 -c rust-src

      # cyclonedx-rust-cargo's deep test-snapshot paths exceed Windows MAX_PATH during the
      # `cargo install --git` checkout. Ephemeral runner, destroyed after the job (same
      # rationale as release.yml).
      - name: Enable long paths (ephemeral runner)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      # Build every tool from its pinned rev in tools/TOOLS.lock into a staging root. One shared
      # CARGO_TARGET_DIR (the #139 dedup, relocated here off the release path) lets the four
      # tools reuse each other's compiled dependencies. `--root` keeps the exes out of ~/.cargo.
      - name: Build tools from TOOLS.lock pins
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/tool-build
        run: |
          set -euo pipefail
          mkdir -p out toolroot
          # Parse non-comment, non-blank lines: name repo rev sha256. Repo-relative --root and
          # out/ avoid Windows/MSYS path-separator issues on the bash shell.
          grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | while read -r name repo rev _sha; do
            echo "::group::building $name @ $rev"
            cargo install "$name" --locked --git "https://github.com/$repo" --rev "$rev" --root ./toolroot
            cp "./toolroot/bin/$name.exe" "out/$name.exe"
            echo "::endgroup::"
          done

      # Compute digests and emit a ready-to-commit TOOLS.lock. The maintainer copies these
      # digests into tools/TOOLS.lock in a reviewed PR — that commit is what "blesses" the build.
      - name: Compute digests + emit TOOLS.lock block
        shell: bash
        run: |
          set -euo pipefail
          : > out/SHA256SUMS
          echo "=================== copy these digests into tools/TOOLS.lock ==================="
          grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | while read -r name repo rev _sha; do
            d=$(sha256sum "out/$name.exe" | cut -d' ' -f1)
            printf '%s  %s.exe\n' "$d" "$name" >> out/SHA256SUMS
            printf '%-18s %-34s %s  %s\n' "$name" "$repo" "$rev" "$d"
          done
          echo "==============================================================================="

      # Publish the binaries to the `tools` release. This is a byte store only; integrity comes
      # from the committed TOOLS.lock digest, so even a tampered release asset fails the release
      # job's verify. Idempotent: (re)create the tag's release and overwrite assets.
      - name: Publish tool binaries to the tools release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tools_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Prebuilt build tools" \
              --notes "Prebuilt cargo-* build tools consumed by the release workflow. Integrity is anchored by tools/TOOLS.lock digests, NOT by this release. Rebuilt by .github/workflows/build-tools.yml." \
              --latest=false
          fi
          gh release upload "$TAG" out/*.exe out/SHA256SUMS --clobber
