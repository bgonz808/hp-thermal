name: Build release tools

# PRODUCER (#138/#221/#205/#225). Compiles the pinned cargo-* tools ONCE, off every consumer's
# critical path, and publishes them as assets on the `tools` release. Consumers (release.yml,
# supply-chain.yml) download + digest-verify them instead of recompiling dependency trees.
#
# #225 — CONTENT-ADDRESSED assets: each binary publishes as `<name>-<sha256:0:12>[.exe|-linux-x86_64]`.
# Nothing is ever overwritten: full forensic history of every produced binary, old blessed
# digests stay valid during a re-bless (no release-freeze window), rollback = revert the
# TOOLS.lock line. The name is a LOCATOR only — consumers re-hash against the committed digest.
#
# #205 — EVIDENCE per tool, so the human blesses proof, not a bare hash:
#   - SLSA provenance attestation (GitHub-infrastructure-signed; binds digest -> this workflow +
#     run; an attacker with repo write access cannot mint one without executing this workflow,
#     which builds from the PINNED rev, not their bytes)
#   - CVE posture: each tool's Cargo.lock at its pinned rev, audited by the PREVIOUSLY-BLESSED
#     cargo-audit (the digest chain eating its own dogfood). Posture is target-independent
#     (lockfiles are just text), so the windows job evaluates it for ALL tools — the blessed
#     audit binary is a Windows PE and only runs there.
#
# Trigger is manual: you run this only when a `rev` in tools/TOOLS.lock changes (a deliberate,
# reviewed pin bump — see tools/README.md). Two jobs, one per TOOLS.lock `target` (cackle is
# Linux-only), serialized so they never race on release creation.
#
# This workflow SIGNS nothing and holds no signing credential (tool Authenticode, if adopted,
# is a separately-credentialed design — see #205). contents:write is only for the `tools`
# release; id-token/attestations:write exist only to mint the provenance attestations.

on:
  workflow_dispatch:
    inputs:
      tools_tag:
        description: "Release tag to publish the tool binaries under."
        type: string
        default: tools

permissions:
  contents: read

jobs:
  # SLSA Build L3 shape: the producer jobs run in the reusable workflow below; this job only
  # invokes it, so the provenance's signer identity is build-tools-pipeline.yml.
  pipeline:
    uses: ./.github/workflows/build-tools-pipeline.yml
    with:
      tools_tag: ${{ inputs.tools_tag }}
    permissions:
      contents: write        # the called jobs create/update the `tools` release
      id-token: write        # OIDC -> Sigstore for the provenance attestations
      attestations: write
