name: Candidate evaluation

# 3-AXIS GATE (#241) — THIN INVOKER ONLY. The verdict algebra (policy) lives in
# xtask/src/gate.rs: reviewed, unit-tested Rust — never workflow bash (bash+jq stays
# display glue at most). Runs on every PR to main, evaluates each candidate (base vs head) per
# #241, and posts the evidence table as a PR comment. The verdict FAILS while any RAISE item
# lacks a committed ack in supply-chain/evidence/<product>/acks.jsonl — the maintainer signs
# residual risk by committing the exact ack line the report prints (attributed, in-history),
# after which the re-run goes green; merging then completes the record. HARD-STOP and
# UNEVALUATED cannot be acked (fail-secure, #241 §3-4).
#
# JUDGED FROM THE BASE. Everything that runs is main's: this workflow (`pull_request_target`
# takes it from the base branch, and only pull requests to main run it, so no other branch's
# copy of it judges anything), the gate's code (xtask, built here with main's cargo
# configuration), the composite actions and the floors. The change is GitHub's test merge of the
# pull request into main's current tip, checked out into its own directory as data, with no
# hooks and no filter drivers; nothing in it is built or run, and the gate reads it there with
# workflow commands stopped (`::stop-commands::`), so nothing it prints is a command.
#
# The verdict is the commit status `candidate-eval/gate` on the pull request's head, taken from
# the event, never from anything the change can print: `pending` first, then `success` only on
# exit 0 with the report's last line the PASS line, `failure` on anything else, including a run
# that could not resolve the change. It is posted with a token of a GitHub App that only this
# workflow uses and that may only write commit statuses (repository variable GATE_APP_CLIENT_ID,
# secret GATE_APP_PRIVATE_KEY): the required check names that App as its source, so neither a
# fork's own workflow (whose jobs post as GitHub Actions) nor any other job can satisfy it. Its
# key is in no step that reads the change. Without the App, no status is posted, and the
# required check blocks.
#
# A maintainer dispatch evaluates a pull request with the gate at the dispatched ref (testing a
# gate change before it merges) and posts `candidate-eval/gate-dispatch`, never the required
# context. Without a pull request it evaluates the ref against itself (plumbing only).
#
# VT is NEVER called here (VT_API_KEY is schedule/dispatch-only): the mal axis reads the
# persisted per-digest evidence. The vuln axis re-scans BOTH revs in this run against one
# advisory-DB state (#241 §5) using the PRIOR-blessed cargo-audit, digest- and
# attestation-verified before execution (#221) — which is why this runs on windows-2025: the
# blessed auditor is a Windows PE.

on:
  # The change is read, never run: see the header.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request to evaluate with the gate at this ref (empty: the ref against itself)"
        required: false
        default: ""

permissions: {}

jobs:
  # Every event makes sure the head carries the status, at once, in a job outside the evaluation's
  # concurrency group (an evaluation that a later event cancels while queued runs no step). The
  # verdict is a commit status and only that: a CHECK RUN named `candidate-eval/gate` is someone
  # else's (a fork's own workflow can name a job so), and where one exists the head gets `failure`,
  # which a required name with both a status and a check run cannot pass. Otherwise `pending` is
  # posted unless the head already has the status: an existing verdict is never reset by another
  # pull request's event, and no event leaves a head without one.
  pending:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      statuses: read
      checks: read
    steps:
      - name: Status token (the gate's App; commit statuses only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Verdict pending
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERDICT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          post() {
            GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$VERDICT_SHA" \
              -f state="$1" -f context=candidate-eval/gate -f description="$2" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          }
          # Any check run whose name is the context, in any case or spacing; a lookup that fails
          # reads as "there is one", so the spoof check fails closed.
          spoofs=1
          if names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$VERDICT_SHA/check-runs?per_page=100" \
                       --jq '.check_runs[].name'); then
            spoofs=$(printf '%s\n' "$names" | tr '[:upper:]' '[:lower:]' | tr -d ' \t\r' \
                       | grep -cxF 'candidate-eval/gate' || true)
          fi
          if [ "$spoofs" != 0 ]; then
            post failure "a check run named candidate-eval/gate is on this head; the verdict is a status only"
            echo "::error::a check run named candidate-eval/gate is on $VERDICT_SHA"
            exit 1
          fi
          # The App's own status only (another source's does not count); a lookup that fails reads
          # as "there is none": pending is posted.
          have=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERDICT_SHA/statuses?per_page=100" \
                   --jq "[.[] | select(.context == \"candidate-eval/gate\" and .creator.login == \"${APP_SLUG}[bot]\")] | length" \
                 || echo 0)
          if [ "$have" != 0 ]; then
            echo "$VERDICT_SHA already has the status; this event's evaluation updates it"
            exit 0
          fi
          post pending "evaluating"

  evaluate:
    runs-on: windows-2025
    concurrency:
      group: candidate-eval-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pr || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # the evidence comment
      checks: read # a check run posing as the verdict
    env:
      # Where the verdict goes: from the event for a pull request (never from a step's output).
      VERDICT_SHA: ${{ github.event.pull_request.head.sha }}
      VERDICT_PR: ${{ github.event.pull_request.number }}
      VERDICT_CONTEXT: ${{ github.event_name == 'pull_request_target' && 'candidate-eval/gate' || 'candidate-eval/gate-dispatch' }}
    steps:
      - name: Checkout the gate's code (main; the change is fetched as data below)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the change, its base and the gate's code
        id: change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          # Nothing git prints about the change (its paths, its refs) is a workflow command.
          tok=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$tok"
          fail() { echo "::$tok::"; echo "::error::$1"; exit 1; }
          pr="${PR_EVENT:-${PR_INPUT:-}}"
          if [ -n "$pr" ]; then
            [[ $pr =~ ^[1-9][0-9]*$ ]] || fail "pull request number '$pr'"
            # The test merge of the pull request's head into main's current tip, as GitHub states
            # it: mergeable, its merge commit the one fetched. GitHub computes it lazily; asking for
            # the pull request starts it, so this retries.
            merge="" head=""
            for _ in 1 2 3 4 5 6; do
              # One field per line (none can hold a newline): an empty one keeps its place.
              mapfile -t f < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
                       --jq '.base.ref, (.mergeable | tostring), (.merge_commit_sha // ""), (.head.repo.full_name // ""), (.user.login // "")')
              [ "${#f[@]}" -eq 5 ] || fail "#$pr: the pull request could not be read"
              base_ref=${f[0]} mergeable=${f[1]} merge_sha=${f[2]} change_repo=${f[3]} opener=${f[4]}
              [ "$base_ref" = main ] || fail "#$pr is not a pull request to main"
              if [ "$mergeable" = true ] && git fetch -q --no-tags origin \
                   "+refs/heads/main:refs/change/main" "+refs/pull/$pr/merge:refs/change/merge" \
                   "+refs/pull/$pr/head:refs/change/head"; then
                merge=$(git rev-parse refs/change/merge) head=$(git rev-parse refs/change/head)
                if [ "$merge" = "$merge_sha" ] \
                   && [ "$(git rev-parse "$merge^2")" = "$head" ] \
                   && [ "$(git rev-parse "$merge^1")" = "$(git rev-parse refs/change/main)" ] \
                   && { [ -z "$VERDICT_SHA" ] || [ "$head" = "$VERDICT_SHA" ]; }; then
                  break
                fi
              fi
              merge="" head=""
              sleep 10
            done
            [ -n "$merge" ] || fail "no test merge of #$pr's head into main's tip (conflicted, or the change or main moved on)"
            base=$(git rev-parse "$merge^1")
          else
            merge=$GITHUB_SHA head=$GITHUB_SHA base=$GITHUB_SHA change_repo=$GITHUB_REPOSITORY opener=""
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then code=$base; else code=$GITHUB_SHA; fi
          git checkout -q --detach "$code"
          # Data trees: no hooks, no filter drivers (LFS included), no runner line-ending defaults,
          # so checking out the change runs nothing; the gate then holds each tree to its index
          # (gate::checkout_problems).
          nohooks="$RUNNER_TEMP/no-hooks"; mkdir -p "$nohooks"
          for t in change:"$merge" base:"$base"; do
            GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath="$nohooks" -c core.fsmonitor=false \
              -c core.autocrlf=false -c core.eol=lf \
              -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false \
              worktree add -q --detach "$RUNNER_TEMP/${t%%:*}" "${t#*:}"
          done
          echo "::$tok::"
          {
            echo "pr=$pr"; echo "head=$head"; echo "base=$base"; echo "change_repo=$change_repo"
            echo "opener=$opener"
          } >> "$GITHUB_OUTPUT"
          echo "change ${merge:0:12} (head ${head:0:12}) on base ${base:0:12}; gate code ${code:0:12}"

      - name: Verify MSVC toolchain authenticity (before anything compiles)
        uses: ./.github/actions/verify-msvc

      - name: Fetch prior-blessed auditor (digest + attestation verified)
        id: auditor
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit
          verify-attestations: "true"
          lock-ref: ${{ steps.change.outputs.base }}

      - name: Build the gate (the code checked out above)
        shell: bash
        run: cargo build --locked --quiet --manifest-path xtask/Cargo.toml

      # NEGATIVE CONTROL BEFORE THE VERDICT (#223). The gate's vuln axis is only as good as
      # the auditor it calls, and a sabotaged or simply broken auditor fails by reporting
      # CLEAN -- indistinguishable from a genuinely clean tree, and invisible to digest
      # verification (the bytes are exactly the ones we blessed). So before any verdict is
      # trusted, require the SAME binary to still detect a known-bad fixture. Fail-closed:
      # if the instrument cannot demonstrate detection, no verdict from it is admissible.
      - name: Canary - the auditor must still detect a known-bad (#223)
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
        run: xtask/target/debug/xtask.exe canary --tool cargo-audit

      - name: Run the gate (base code, the change as data)
        id: gate
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
          # Build record custody: the raw record from the tools store, its producer statement.
          GH_TOKEN: ${{ github.token }}
          # Where the change's branch is: the event's for a pull request.
          CHANGE_REPO: ${{ github.event.pull_request.head.repo.full_name || steps.change.outputs.change_repo }}
          CHANGE_OPENER: ${{ github.event.pull_request.user.login || steps.change.outputs.opener }}
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/xtask/target/debug/xtask.exe"
          base="$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/change"
          # The report quotes the change; nothing it prints is a workflow command.
          tok=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          [ ${#tok} -eq 32 ] || { echo "::error::no stop-commands token"; exit 1; }
          echo "::stop-commands::$tok"
          # The gate's exit code is captured, not fatal (the runner's bash runs with -e).
          set +e
          "$gate" gate --base "$base/tools/TOOLS.lock" --base-locks-dir "$base/tools/locks" \
            --base-evidence "$base/supply-chain/evidence" --base-tools-dir "$base/tools" \
            --base-root "$base" --floors "$base/supply-chain/policy/floors.json" \
            --change-repo "$CHANGE_REPO" --change-opener "$CHANGE_OPENER" \
            --report "$RUNNER_TEMP/gate-report.md"
          code=$?
          echo "::$tok::"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Post / update the evidence comment
        if: always() && github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ steps.change.outputs.base }}
        run: |
          set -euo pipefail
          marker='<!-- candidate-eval -->'
          report="$RUNNER_TEMP/gate-report.md" body="$RUNNER_TEMP/comment.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          judged="_Judged: head \`$VERDICT_SHA\` against main \`${BASE:-unresolved}\`._"
          # A run that wrote no report, or one too long for a comment, must not leave an earlier
          # verdict standing: the comment then says so.
          fallback() {
            printf '%s\n## Candidate evaluation\n\n%s\n\nThe gate wrote no report for this head that fits a comment; see %s.\n' \
              "$marker" "$judged" "$run_url" > "$body"
          }
          if [ -f "$report" ] && [ "$(wc -c < "$report")" -le 60000 ]; then
            { echo "$marker"; echo; echo "$judged"; tail -n +2 "$report"; } > "$body"
          else
            fallback
          fi
          # Only this workflow's own comment carries the report: the first is updated, any other
          # (an older format, a race) is removed so no stale verdict stands lower in the thread.
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          cid=$(sed -n 1p <<< "$ids")
          sed -n '2,$p' <<< "$ids" | while read -r extra; do
            [ -n "$extra" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$extra" > /dev/null || true
          done
          post() {
            if [ -n "${cid:-}" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@"$body" > /dev/null
            else
              gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
            fi
          }
          post || { fallback; post; }

      - name: Status token (the gate's App; commit statuses only)
        id: app
        if: always()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Enforce the verdict
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.gate.outputs.code }}
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.app.outputs.token }}
          DISPATCH_PR: ${{ steps.change.outputs.pr }}
          DISPATCH_HEAD: ${{ steps.change.outputs.head }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gate-report.md"
          [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "gate exit: ${CODE:-missing}"
          # A run cancelled by a newer event for the same pull request has no verdict: the newer
          # run posts one, and the SHA keeps its `pending` meanwhile.
          if [ "$JOB_STATUS" = cancelled ]; then
            echo "::warning::cancelled; the newer run posts the verdict"
            exit 1
          fi
          # A pass is a written verdict, not only an exit status, and the report's last line: the
          # change is quoted above it, never after it.
          pass='**Gate: PASS** — all axes ALLOW or signed; merging records the sign-off'
          state=failure desc="blocked or not evaluated: see the run"
          if [ "${CODE:-1}" = "0" ] && [ -f "$report" ] && [ "$(tail -n 1 "$report")" = "$pass" ]; then
            state=success desc="all axes ALLOW or signed"
          fi
          # The verdict is a status only: a check run of the same name on the head is someone
          # else's, and the head fails whatever the gate found (a failed lookup counts as one).
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then
            spoofs=1
            if names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$VERDICT_SHA/check-runs?per_page=100" \
                         --jq '.check_runs[].name'); then
              spoofs=$(printf '%s\n' "$names" | tr '[:upper:]' '[:lower:]' | tr -d ' \t\r' \
                         | grep -cxF 'candidate-eval/gate' || true)
            fi
            if [ "$spoofs" != 0 ]; then
              state=failure desc="a check run named candidate-eval/gate is on this head; the verdict is a status only"
            fi
          fi
          sha="$VERDICT_SHA"
          if [ "$GITHUB_EVENT_NAME" != pull_request_target ]; then
            sha=""; [ -n "${DISPATCH_PR:-}" ] && sha="${DISPATCH_HEAD:-}"
          else
            # A status belongs to the SHA, shared by every pull request with that head: post only
            # while this pull request is open and still that head on main; otherwise the run for
            # its current state posts. A pull request from a fork posts nothing on a head that a
            # pull request from this repository to main also has: that one's runs post, and a
            # fork's (judged as a fork, so stricter) does not overwrite them.
            mapfile -t now < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$VERDICT_PR" \
                     --jq '.state, .head.sha, .base.ref, (.head.repo.full_name // "")' || true)
            if [ "${#now[@]}" -ne 4 ] || [ "${now[0]}" != open ] || [ "${now[1]}" != "$VERDICT_SHA" ] \
               || [ "${now[2]}" != main ]; then
              echo "::warning::#$VERDICT_PR is not open with head $VERDICT_SHA on main; no verdict posted from this run"
              sha=""
            elif [ "${now[3]}" != "$GITHUB_REPOSITORY" ]; then
              # Any lookup failure reads as "there is one": the fork posts nothing.
              others=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERDICT_SHA/pulls" \
                         --jq "[.[] | select(.state == \"open\" and .base.ref == \"main\" and .head.sha == \"$VERDICT_SHA\" and .number != $VERDICT_PR)] | length" \
                       || echo 1)
              if [ "$others" != 0 ]; then
                echo "::warning::another pull request to main has head $VERDICT_SHA; its runs post the verdict"
                sha=""
              fi
            fi
          fi
          if [ -n "$sha" ]; then
            GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state="$state" \
              -f context="$VERDICT_CONTEXT" -f description="$desc" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null \
              || { echo "::error::could not post the verdict status"; exit 1; }
          fi
          [ "$state" = success ] || { echo "::error::$desc"; exit 1; }
