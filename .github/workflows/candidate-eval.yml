name: Candidate evaluation

# 3-AXIS GATE (#241) — THIN INVOKER ONLY. The verdict algebra (policy) lives in
# xtask/src/gate.rs: reviewed, unit-tested Rust — never workflow bash (bash+jq stays
# display glue at most). Runs on every PR to main, evaluates each candidate (base vs head) per
# #241, and posts the evidence table as a PR comment. The verdict FAILS while any RAISE item
# lacks a committed ack in supply-chain/evidence/<product>/acks.jsonl — the maintainer signs
# residual risk by committing the exact ack line the report prints (attributed, in-history),
# after which the re-run goes green; merging then completes the record. HARD-STOP and
# UNEVALUATED cannot be acked (fail-secure, #241 §3-4).
#
# JUDGED FROM THE BASE. Everything that runs is main's: this workflow (`pull_request_target`
# takes it from the base branch, and only pull requests to main run it, so no other branch's
# copy of it judges anything), the gate's code (xtask, built here with main's cargo
# configuration), the composite actions and the floors. The change is GitHub's test merge of the
# pull request into main's current tip, checked out into its own directory as data, with no
# hooks and no filter drivers; nothing in it is built or run, and the gate reads it there with
# workflow commands stopped (`::stop-commands::`), so nothing it prints is a command.
#
# The verdict is the commit status `candidate-eval/gate` on the pull request's head, taken from
# the event, never from anything the change can print: `pending` first, then `success` only on
# exit 0 with the report's last line the PASS line, `failure` on anything else, including a run
# that could not resolve the change. A head's status is shared by every pull request with that
# head, so each one names the pull request it judged and the run that posted it, and stands only
# while that pull request is open to main on that head: see `claim`. It is posted with a token of a GitHub App that only
# this workflow uses and that may only write commit statuses (repository variable
# GATE_APP_CLIENT_ID). The App's key, GATE_APP_PRIVATE_KEY, is a secret of the environment `gate`,
# which only `main` may use, so no workflow on another branch can read it. The required check
# names the App as its source, so neither a fork's own workflow (whose jobs post as GitHub Actions)
# nor any other job can satisfy it. Least privilege by job: `evaluate` reads the change, holds no
# key and writes nothing (contents and pull requests read-only), and hands on only its verdict
# and report; `comment` writes the report as a comment, without the key; `claim` and `verdict`
# hold the key, take nothing from the change but the verdict, and start on fresh runners.
# Without the App no status is posted; once the check is required, that blocks. GitHub blocks
# `pull_request_target` in public repositories unless an Actions policy allows it (from
# 2026-12-02): this repository's must allow it for this workflow, for every actor. The settings
# this relies on are listed in supply-chain/evidence/README.md (rule 3).
#
# A maintainer dispatch evaluates a pull request with the gate at the dispatched ref (testing a
# gate change before it merges): the run's result and summary only, no key, nothing posted.
# Without a pull request it evaluates the ref against itself (plumbing only).
#
# VT is NEVER called here (VT_API_KEY is schedule/dispatch-only): the mal axis reads the
# persisted per-digest evidence. The vuln axis re-scans BOTH revs in this run against one
# advisory-DB state (#241 §5) using the PRIOR-blessed cargo-audit, digest- and
# attestation-verified before execution (#221) — which is why this runs on windows-2025: the
# blessed auditor is a Windows PE.

on:
  # The change is read, never run: see the header. Every base, so that a pull request leaving
  # main (retargeted, then closed) still withdraws its verdict; only pull requests to main are
  # evaluated (the jobs' conditions).
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, edited, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request to evaluate with the gate at this ref (empty: the ref against itself)"
        required: false
        default: ""

permissions: {}

jobs:
  # Every event of every pull request, at once, outside the evaluation's concurrency group (an
  # evaluation that a later event cancels while queued runs no step). A head's status is shared by
  # every pull request with that head, so each status names its pull request and its run, and a
  # verdict stands only while its pull request is open to main on that head: what a pull request
  # leaves is withdrawn first (`failure`): the head it left on a push, and its head when it closes
  # unmerged or is not (any longer) to main. A merged one's head cannot merge again (main moved
  # past it, and branches must be up to date). Then a pull request to main claims its head
  # (`pending`) unless a newer run is already there; its own verdict follows. No pull request
  # defers to another: the latest evaluation of a head stands, whoever's. The verdict is a commit
  # status and only that: where a CHECK RUN named `candidate-eval/gate` is on the head (someone
  # else's: a fork's own workflow can name a job so), the head gets `failure`. A title or body
  # edit changes nothing judged and runs nothing.
  claim:
    if: >-
      github.event_name == 'pull_request_target'
      && (github.event.action != 'edited' || github.event.changes.base)
    runs-on: ubuntu-24.04
    environment:
      name: gate # the App's key: main only
      deployment: false
    permissions:
      statuses: read
      checks: read
      pull-requests: read
    steps:
      - name: Status token (the gate's App; commit statuses only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Claim the head (after withdrawing what the pull request left)
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERDICT_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT_PR: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          set -uo pipefail
          # --- gate status helpers: identical in claim and verdict (a test holds them equal) ---
          # Every status the App posts names its pull request and its run: the description
          # "#<pr>: <text>", the target ".../actions/runs/<id>/attempts/<n>".
          # post <sha> <state> <text>, retried: a lost withdrawal would leave a pass standing.
          post() {
            local i
            for i in 1 2 3; do
              GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$1" \
                -f state="$2" -f context=candidate-eval/gate -f description="#$VERDICT_PR: $3" \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
                > /dev/null && return 0
              sleep "$i"
            done
            return 1
          }
          # app_status <sha>: the App's latest status on that head, as "state owner run attempt" (0
          # for a field that does not parse; "none 0 0 0" when there is none). A failed lookup
          # returns 1.
          app_status() {
            local rows state desc url owner=0 run=0 attempt=0
            local own='^#([0-9]+): ' at='/actions/runs/([0-9]+)/attempts/([0-9]+)$'
            rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$1/statuses?per_page=100" \
                     --jq ".[] | select(.context == \"candidate-eval/gate\" and .creator.login == \"${APP_SLUG}[bot]\") | [.state, .description, .target_url] | @tsv") \
              || return 1
            [ -n "$rows" ] || { echo "none 0 0 0"; return 0; }
            IFS=$'\t' read -r state desc url <<< "$(head -n 1 <<< "$rows")"
            [[ $desc =~ $own ]] && owner=${BASH_REMATCH[1]}
            [[ $url =~ $at ]] && run=${BASH_REMATCH[1]} attempt=${BASH_REMATCH[2]}
            echo "$state $owner $run $attempt"
          }
          # on_head <pr>: whether that pull request is open, to main, with head $VERDICT_SHA. A
          # failed lookup is a no. (verdict's; claim reads the event instead)
          # shellcheck disable=SC2329
          on_head() {
            local f
            mapfile -t f < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$1" \
                     --jq '.state, .base.ref, .head.sha' 2> /dev/null)
            [ "${#f[@]}" -eq 3 ] && [ "${f[0]}" = open ] && [ "${f[1]}" = main ] \
              && [ "${f[2]}" = "$VERDICT_SHA" ]
          }
          # newer <run> <attempt>: whether that run is newer than this one.
          newer() {
            [ "$1" -gt "$GITHUB_RUN_ID" ] || { [ "$1" -eq "$GITHUB_RUN_ID" ] && [ "$2" -gt "$GITHUB_RUN_ATTEMPT" ]; }
          }
          # spoofed: whether a check run named like the context (ASCII case and spacing aside) is on
          # $VERDICT_SHA; a failed lookup counts as one.
          spoofed() {
            local names
            names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$VERDICT_SHA/check-runs?per_page=100" \
                      --jq '.check_runs[].name') || return 0
            [ "$(printf '%s\n' "$names" | tr '[:upper:]' '[:lower:]' | tr -d ' \t\r' \
                   | grep -cxF 'candidate-eval/gate')" != 0 ]
          }
          # withdraw <sha> <why>: this pull request's verdict no longer stands on that head. If the
          # App's latest status there names this pull request, and no newer run posted it (or the
          # status cannot be read), it becomes failure.
          withdraw() {
            local s owner=unknown run=0 attempt=0
            if s=$(app_status "$1"); then read -r _ owner run attempt <<< "$s"; fi
            if [ "$owner" = unknown ] || { [ "$owner" = "$VERDICT_PR" ] && ! newer "$run" "$attempt"; }; then
              post "$1" failure "$2; its verdict no longer stands" \
                || { echo "::error::could not withdraw #$VERDICT_PR's verdict from $1"; return 1; }
            fi
          }
          # --- end of gate status helpers ---
          rc=0
          if [ "$ACTION" = synchronize ] && [ -n "${BEFORE_SHA:-}" ]; then
            withdraw "$BEFORE_SHA" "moved to a new head" || rc=1
          fi
          if [ "$ACTION" = closed ]; then
            [ "$MERGED" = true ] || withdraw "$VERDICT_SHA" "closed" || rc=1
            exit "$rc"
          fi
          if [ "$BASE_REF" != main ]; then
            withdraw "$VERDICT_SHA" "not a pull request to main" || rc=1
            exit "$rc"
          fi
          if spoofed; then
            post "$VERDICT_SHA" failure "a check run named candidate-eval/gate is on this head; the verdict is a status only"
            echo "::error::a check run named candidate-eval/gate is on $VERDICT_SHA"
            exit 1
          fi
          # A failed lookup claims the head: this run's evaluation then posts.
          if s=$(app_status "$VERDICT_SHA"); then
            read -r _ _ run attempt <<< "$s"
            if newer "$run" "$attempt" \
               || { [ "$run" = "$GITHUB_RUN_ID" ] && [ "$attempt" = "$GITHUB_RUN_ATTEMPT" ]; }; then
              echo "a newer run, or this run's verdict, holds this head's status"
              exit "$rc"
            fi
          fi
          post "$VERDICT_SHA" pending "evaluating" || { echo "::error::could not post pending"; exit 1; }
          exit "$rc"

  # Reads the change; holds no key and writes nothing. Hands on the verdict and the report only.
  evaluate:
    if: >-
      github.event_name != 'pull_request_target'
      || (github.event.pull_request.base.ref == 'main' && github.event.action != 'closed'
          && (github.event.action != 'edited' || github.event.changes.base))
    runs-on: windows-2025
    concurrency:
      group: candidate-eval-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pr || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
      report: ${{ steps.verdict.outputs.report }}
      base: ${{ steps.change.outputs.base }}
    env:
      # The head judged: from the event for a pull request (never from a step's output).
      VERDICT_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the gate's code (main; the change is fetched as data below)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the change, its base and the gate's code
        id: change
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          # Nothing git prints about the change (its paths, its refs) is a workflow command.
          tok=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$tok"
          fail() { echo "::$tok::"; echo "::error::$1"; exit 1; }
          pr="${PR_EVENT:-${PR_INPUT:-}}"
          if [ -n "$pr" ]; then
            [[ $pr =~ ^[1-9][0-9]*$ ]] || fail "pull request number '$pr'"
            # The test merge of the pull request's head into main's current tip, as GitHub states
            # it: mergeable, its merge commit the one fetched. GitHub computes it lazily; asking for
            # the pull request starts it, so this retries.
            merge="" head=""
            for _ in 1 2 3 4 5 6; do
              # One field per line (none can hold a newline): an empty one keeps its place.
              mapfile -t f < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" \
                       --jq '.base.ref, (.mergeable | tostring), (.merge_commit_sha // ""), (.head.repo.full_name // ""), (.user.login // "")')
              [ "${#f[@]}" -eq 5 ] || fail "#$pr: the pull request could not be read"
              base_ref=${f[0]} mergeable=${f[1]} merge_sha=${f[2]} change_repo=${f[3]} opener=${f[4]}
              [ "$base_ref" = main ] || fail "#$pr is not a pull request to main"
              if [ "$mergeable" = true ] && git fetch -q --no-tags origin \
                   "+refs/heads/main:refs/change/main" "+refs/pull/$pr/merge:refs/change/merge" \
                   "+refs/pull/$pr/head:refs/change/head"; then
                merge=$(git rev-parse refs/change/merge) head=$(git rev-parse refs/change/head)
                if [ "$merge" = "$merge_sha" ] \
                   && [ "$(git rev-parse "$merge^2")" = "$head" ] \
                   && [ "$(git rev-parse "$merge^1")" = "$(git rev-parse refs/change/main)" ] \
                   && { [ -z "$VERDICT_SHA" ] || [ "$head" = "$VERDICT_SHA" ]; }; then
                  break
                fi
              fi
              merge="" head=""
              sleep 10
            done
            [ -n "$merge" ] || fail "no test merge of #$pr's head into main's tip (conflicted, or the change or main moved on)"
            base=$(git rev-parse "$merge^1")
          else
            merge=$GITHUB_SHA head=$GITHUB_SHA base=$GITHUB_SHA change_repo=$GITHUB_REPOSITORY opener=""
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request_target ]; then code=$base; else code=$GITHUB_SHA; fi
          git checkout -q --detach "$code"
          # Data trees: no hooks, no filter drivers (LFS included), no runner line-ending defaults,
          # so checking out the change runs nothing; the gate then holds each tree to its index
          # (gate::checkout_problems).
          nohooks="$RUNNER_TEMP/no-hooks"; mkdir -p "$nohooks"
          for t in change:"$merge" base:"$base"; do
            GIT_LFS_SKIP_SMUDGE=1 git -c core.hooksPath="$nohooks" -c core.fsmonitor=false \
              -c core.autocrlf=false -c core.eol=lf \
              -c filter.lfs.smudge= -c filter.lfs.process= -c filter.lfs.required=false \
              worktree add -q --detach "$RUNNER_TEMP/${t%%:*}" "${t#*:}"
          done
          echo "::$tok::"
          {
            echo "pr=$pr"; echo "head=$head"; echo "base=$base"; echo "change_repo=$change_repo"
            echo "opener=$opener"
          } >> "$GITHUB_OUTPUT"
          echo "change ${merge:0:12} (head ${head:0:12}) on base ${base:0:12}; gate code ${code:0:12}"

      - name: Verify MSVC toolchain authenticity (before anything compiles)
        uses: ./.github/actions/verify-msvc

      - name: Fetch prior-blessed auditor (digest + attestation verified)
        id: auditor
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit
          verify-attestations: "true"
          lock-ref: ${{ steps.change.outputs.base }}

      - name: Build the gate (the code checked out above)
        shell: bash
        run: cargo build --locked --quiet --manifest-path xtask/Cargo.toml

      # NEGATIVE CONTROL BEFORE THE VERDICT (#223). The gate's vuln axis is only as good as
      # the auditor it calls, and a sabotaged or simply broken auditor fails by reporting
      # CLEAN -- indistinguishable from a genuinely clean tree, and invisible to digest
      # verification (the bytes are exactly the ones we blessed). So before any verdict is
      # trusted, require the SAME binary to still detect a known-bad fixture. Fail-closed:
      # if the instrument cannot demonstrate detection, no verdict from it is admissible.
      - name: Canary - the auditor must still detect a known-bad (#223)
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
        run: xtask/target/debug/xtask.exe canary --tool cargo-audit

      - name: Run the gate (base code, the change as data)
        id: gate
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
          # Build record custody: the raw record from the tools store, its producer statement.
          GH_TOKEN: ${{ github.token }}
          # Where the change's branch is: the event's for a pull request.
          CHANGE_REPO: ${{ github.event.pull_request.head.repo.full_name || steps.change.outputs.change_repo }}
          CHANGE_OPENER: ${{ github.event.pull_request.user.login || steps.change.outputs.opener }}
        run: |
          set -euo pipefail
          gate="$GITHUB_WORKSPACE/xtask/target/debug/xtask.exe"
          base="$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/change"
          # The report quotes the change; nothing it prints is a workflow command.
          tok=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          [ ${#tok} -eq 32 ] || { echo "::error::no stop-commands token"; exit 1; }
          echo "::stop-commands::$tok"
          # The gate's exit code is captured, not fatal (the runner's bash runs with -e).
          set +e
          "$gate" gate --base "$base/tools/TOOLS.lock" --base-locks-dir "$base/tools/locks" \
            --base-evidence "$base/supply-chain/evidence" --base-tools-dir "$base/tools" \
            --base-root "$base" --floors "$base/supply-chain/policy/floors.json" \
            --change-repo "$CHANGE_REPO" --change-opener "$CHANGE_OPENER" \
            --report "$RUNNER_TEMP/gate-report.md"
          code=$?
          echo "::$tok::"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Verdict (handed to the verdict job)
        id: verdict
        if: always()
        shell: bash
        env:
          CODE: ${{ steps.gate.outputs.code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/gate-report.md"
          [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "gate exit: ${CODE:-missing}"
          # A run cancelled by a newer event for the same pull request has no verdict: the newer
          # run posts one, and the SHA keeps its `pending` meanwhile.
          if [ "$JOB_STATUS" = cancelled ]; then
            echo "::warning::cancelled; the newer run posts the verdict"
            exit 1
          fi
          # A pass is a written verdict, not only an exit status, and the report's last line: the
          # change is quoted above it, never after it.
          pass='**Gate: PASS** — all axes ALLOW or signed; merging records the sign-off'
          verdict=failure
          if [ "${CODE:-1}" = "0" ] && [ -f "$report" ] && [ "$(tail -n 1 "$report")" = "$pass" ]; then
            verdict=success
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          # The report, when it fits a comment, as one base64 line: no line of it can end or
          # extend the value.
          if [ -f "$report" ] && [ "$(wc -c < "$report")" -le 60000 ]; then
            echo "report=$(base64 -w0 < "$report")" >> "$GITHUB_OUTPUT"
          fi
          [ "$verdict" = success ] || { echo "::error::blocked or not evaluated: see the report"; exit 1; }

  # The evidence comment, from the evaluation's report, on its own runner and without the key; one
  # at a time per pull request.
  comment:
    needs: evaluate
    if: >-
      always() && github.event_name == 'pull_request_target'
      && needs.evaluate.result != 'cancelled' && needs.evaluate.result != 'skipped'
    runs-on: ubuntu-24.04
    concurrency:
      group: candidate-eval-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      pull-requests: write # the evidence comment
    env:
      VERDICT_SHA: ${{ github.event.pull_request.head.sha }}
      VERDICT_PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Post / update the evidence comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_B64: ${{ needs.evaluate.outputs.report }}
          BASE: ${{ needs.evaluate.outputs.base }}
        run: |
          set -euo pipefail
          marker='<!-- candidate-eval -->'
          report="$RUNNER_TEMP/gate-report.md" body="$RUNNER_TEMP/comment.md"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          [[ ${BASE:-} =~ ^[0-9a-f]{40}$ ]] || BASE=unresolved
          judged="_Judged: head \`$VERDICT_SHA\` against main \`$BASE\`._"
          # A run that handed on no report (none written, or one too long for a comment) must not
          # leave an earlier verdict standing: the comment then says so.
          fallback() {
            printf '%s\n## Candidate evaluation\n\n%s\n\nThe gate wrote no report for this head that fits a comment; see %s.\n' \
              "$marker" "$judged" "$run_url" > "$body"
          }
          if [ -n "${REPORT_B64:-}" ] && base64 -d <<< "$REPORT_B64" > "$report" 2> /dev/null; then
            { echo "$marker"; echo; echo "$judged"; tail -n +2 "$report"; } > "$body"
          else
            fallback
          fi
          # Only this workflow's own comment carries the report: the first is updated, any other
          # (an older format, a race) is removed so no stale verdict stands lower in the thread.
          ids=$(gh api "repos/$GITHUB_REPOSITORY/issues/$VERDICT_PR/comments" --paginate \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
          cid=$(sed -n 1p <<< "$ids")
          sed -n '2,$p' <<< "$ids" | while read -r extra; do
            [ -n "$extra" ] || continue
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$extra" > /dev/null || true
          done
          post() {
            if [ -n "${cid:-}" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$cid" -F body=@"$body" > /dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$VERDICT_PR/comments" -F body=@"$body" > /dev/null
            fi
          }
          post || { fallback; post; }

  # Posts the verdict, on a fresh runner that takes nothing from the evaluation but its verdict:
  # the key never shares a machine with the change or its report. One at a time per pull request,
  # after this run's claim; never over a newer run's status.
  verdict:
    needs: [claim, evaluate]
    if: >-
      always() && github.event_name == 'pull_request_target'
      && needs.evaluate.result != 'cancelled' && needs.evaluate.result != 'skipped'
    runs-on: ubuntu-24.04
    environment:
      name: gate # the App's key: main only
      deployment: false
    concurrency:
      group: candidate-eval-verdict-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      statuses: read
      checks: read
      pull-requests: read
    steps:
      - name: Status token (the gate's App; commit statuses only)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GATE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          VERDICT_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT_PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ needs.evaluate.outputs.verdict }}
          EVALUATED: ${{ needs.evaluate.result }}
        run: |
          set -uo pipefail
          # --- gate status helpers: identical in claim and verdict (a test holds them equal) ---
          # Every status the App posts names its pull request and its run: the description
          # "#<pr>: <text>", the target ".../actions/runs/<id>/attempts/<n>".
          # post <sha> <state> <text>, retried: a lost withdrawal would leave a pass standing.
          post() {
            local i
            for i in 1 2 3; do
              GH_TOKEN="$STATUS_TOKEN" gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$1" \
                -f state="$2" -f context=candidate-eval/gate -f description="#$VERDICT_PR: $3" \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
                > /dev/null && return 0
              sleep "$i"
            done
            return 1
          }
          # app_status <sha>: the App's latest status on that head, as "state owner run attempt" (0
          # for a field that does not parse; "none 0 0 0" when there is none). A failed lookup
          # returns 1.
          app_status() {
            local rows state desc url owner=0 run=0 attempt=0
            local own='^#([0-9]+): ' at='/actions/runs/([0-9]+)/attempts/([0-9]+)$'
            rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$1/statuses?per_page=100" \
                     --jq ".[] | select(.context == \"candidate-eval/gate\" and .creator.login == \"${APP_SLUG}[bot]\") | [.state, .description, .target_url] | @tsv") \
              || return 1
            [ -n "$rows" ] || { echo "none 0 0 0"; return 0; }
            IFS=$'\t' read -r state desc url <<< "$(head -n 1 <<< "$rows")"
            [[ $desc =~ $own ]] && owner=${BASH_REMATCH[1]}
            [[ $url =~ $at ]] && run=${BASH_REMATCH[1]} attempt=${BASH_REMATCH[2]}
            echo "$state $owner $run $attempt"
          }
          # on_head <pr>: whether that pull request is open, to main, with head $VERDICT_SHA. A
          # failed lookup is a no. (verdict's; claim reads the event instead)
          # shellcheck disable=SC2329
          on_head() {
            local f
            mapfile -t f < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$1" \
                     --jq '.state, .base.ref, .head.sha' 2> /dev/null)
            [ "${#f[@]}" -eq 3 ] && [ "${f[0]}" = open ] && [ "${f[1]}" = main ] \
              && [ "${f[2]}" = "$VERDICT_SHA" ]
          }
          # newer <run> <attempt>: whether that run is newer than this one.
          newer() {
            [ "$1" -gt "$GITHUB_RUN_ID" ] || { [ "$1" -eq "$GITHUB_RUN_ID" ] && [ "$2" -gt "$GITHUB_RUN_ATTEMPT" ]; }
          }
          # spoofed: whether a check run named like the context (ASCII case and spacing aside) is on
          # $VERDICT_SHA; a failed lookup counts as one.
          spoofed() {
            local names
            names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$VERDICT_SHA/check-runs?per_page=100" \
                      --jq '.check_runs[].name') || return 0
            [ "$(printf '%s\n' "$names" | tr '[:upper:]' '[:lower:]' | tr -d ' \t\r' \
                   | grep -cxF 'candidate-eval/gate')" != 0 ]
          }
          # withdraw <sha> <why>: this pull request's verdict no longer stands on that head. If the
          # App's latest status there names this pull request, and no newer run posted it (or the
          # status cannot be read), it becomes failure.
          withdraw() {
            local s owner=unknown run=0 attempt=0
            if s=$(app_status "$1"); then read -r _ owner run attempt <<< "$s"; fi
            if [ "$owner" = unknown ] || { [ "$owner" = "$VERDICT_PR" ] && ! newer "$run" "$attempt"; }; then
              post "$1" failure "$2; its verdict no longer stands" \
                || { echo "::error::could not withdraw #$VERDICT_PR's verdict from $1"; return 1; }
            fi
          }
          # --- end of gate status helpers ---
          # Only the exact word from an evaluation that succeeded passes; anything else fails.
          state=failure desc="blocked or not evaluated: see the run"
          if [ "${VERDICT:-}" = success ] && [ "$EVALUATED" = success ]; then
            state=success desc="all axes ALLOW or signed"
          fi
          if spoofed; then
            state=failure desc="a check run named candidate-eval/gate is on this head; the verdict is a status only"
          fi
          # Post only while this pull request is open and still that head on main (otherwise the
          # run for its current state posts), and never over a newer run's status. A status that
          # cannot be read is answered with failure.
          if ! on_head "$VERDICT_PR"; then
            echo "::warning::#$VERDICT_PR is not open with head $VERDICT_SHA on main; no verdict posted from this run"
            exit 0
          fi
          if s=$(app_status "$VERDICT_SHA"); then
            read -r _ _ run attempt <<< "$s"
            if newer "$run" "$attempt"; then
              echo "a newer run holds this head's status; this run posts nothing"
              exit 0
            fi
          else
            state=failure desc="this head's status could not be read; re-run to judge"
          fi
          post "$VERDICT_SHA" "$state" "$desc" || { echo "::error::could not post the verdict status"; exit 1; }
          # Closed, pushed or retargeted while judged: the pass is withdrawn here (that event's
          # own withdrawal may have read the head before this post).
          if [ "$state" = success ] && ! on_head "$VERDICT_PR"; then
            withdraw "$VERDICT_SHA" "closed or moved while judged" || true
            state=failure desc="closed or moved while judged"
          fi
          [ "$state" = success ] || { echo "::error::$desc"; exit 1; }
