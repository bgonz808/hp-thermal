name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build + attest, but publish NOTHING. Default true — must be
          explicitly unset to publish via dispatch. A tag push ignores this and publishes."
        type: boolean
        default: true

# Default to read-only, no secrets. Only the publish job opts into the minimum extra
# scopes it needs, and only on a real tag. All actions are pinned to a full 40-char
# commit SHA (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
# Dependabot proposes reviewed action bumps; git-rev tool pins are bumped by hand.
permissions:
  contents: read

jobs:
  # --- S2 source-integrity gate: a release may fire ONLY from a commit whose required
  #     checks (ci, scan, CodeQL) concluded success. Closes the seam where a tag push
  #     triggered a release regardless of whether the commit ever passed CI/scan. On a
  #     real tag it is enforced fail-closed; on workflow_dispatch (dry-run) it is skipped
  #     so dry-runs still exercise the pipeline. This complements branch protection +
  #     tag rulesets: even if a tag is somehow placed on a non-green commit, no build runs.
  source-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require the tagged commit to be CI-green
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" > checks.json
          fail=0
          for name in "ci" "scan" "Analyze (rust)"; do
            concl=$(jq -r --arg n "$name" \
              '[.check_runs[] | select(.name==$n)] | (sort_by(.started_at) | last | .conclusion) // "missing"' \
              checks.json)
            echo "required check '$name' => $concl"
            [ "$concl" = "success" ] || { echo "::error::required check '$name' is '$concl' (need success)"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "Source-integrity gate FAILED: tag is not on a CI-green commit."; exit 1; }
          echo "Source-integrity gate PASSED."

  # --- Build on a READ-ONLY, secret-less runner. Tool installs execute code, so this
  #     job is bounded to reading public source: it cannot push, publish, or exfiltrate.
  build:
    needs: source-gate
    runs-on: windows-latest
    permissions:
      contents: read
    # Digest chain: publish the shipped bytes' SHA-256 as job outputs — an OUT-OF-BAND
    # channel (GitHub job metadata), separate from SHA256SUMS which travels inside the
    # artifact. The verify job re-derives and asserts both, so a swap/corruption on the
    # build->publish hop is caught (closes the transport-trusted custody seam). See #42.
    outputs:
      exe_sha256: ${{ steps.stage.outputs.exe_sha256 }}
      pdb_sha256: ${{ steps.stage.outputs.pdb_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history so build.rs `git rev-list --count HEAD` is accurate

      - name: Install pinned toolchain + components
        run: rustup toolchain install nightly-2026-07-23 -c rust-src -c clippy -c rustfmt

      # Enforce dependency locking: fails if Cargo.lock is stale / would change. Nothing
      # gets built or published against an unpinned dependency graph.
      - name: Verify dependency lock (no drift)
        working-directory: app
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Windows MAX_PATH (260) blocks the deep test-snapshot paths inside some tool repos
      # (cyclonedx-rust-cargo) during `cargo install --git`'s checkout. Enable long paths.
      # SAFE here: the runner is EPHEMERAL (fresh VM, destroyed after the job), so this
      # has no lasting/persistent attack surface -- long-path evasion needs a durable
      # attacker-influenced system, which a throwaway build VM building our pinned source
      # is not. (Would NOT do this on a workstation/server.)
      - name: Enable long paths (ephemeral runner)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      # Immutable git-rev pins: a maintainer-account compromise can publish a new
      # crates.io version but cannot rewrite a pinned commit. These BUILD code, which is
      # why they stay on the read-only, secret-less runner.
      - name: Install release tools (git-rev pinned)
        shell: bash
        run: |
          cargo install cargo-deny      --locked --git https://github.com/EmbarkStudios/cargo-deny          --rev 09faadcea2d0d1742492e6872b743d1e4d151a27
          cargo install cargo-auditable --locked --git https://github.com/rust-secure-code/cargo-auditable  --rev 9dc5ff28ff204b73eae91bd96cde4413fdcb70e0
          cargo install cargo-audit     --locked --git https://github.com/rustsec/rustsec                   --rev efcde93a237dc51f8c32d84d880bf97b442835c8
          cargo install cargo-cyclonedx --locked --git https://github.com/CycloneDX/cyclonedx-rust-cargo    --rev e58bd5590212f82c5b7e16dd3e2e819b0dbea5b1  # cargo-cyclonedx-0.5.9

      # Full tier: fmt/clippy/test + cargo-deny policy + cargo-auditable release build
      # (embeds the dep tree in the binary) + `cargo audit bin` on the artifact + PE
      # exploit-mitigation verification.
      - name: Attest build (deny / auditable / audit-bin / verify-hardening)
        run: cargo run --manifest-path xtask/Cargo.toml -- ci

      - name: Generate SBOM (CycloneDX)
        working-directory: app
        run: cargo cyclonedx --format json

      # #104: MUTATION before any seal. Patch the /Brepro hash timestamp (which decodes to an
      # implausible year and can trip timestomp heuristics) to the reproducible commit epoch —
      # plausible AND deterministic. link.exe has no /TIMESTAMP, so it's a post-link patch, and
      # it MUST run before the SHA-256 / attestation below so those cover the stamped bytes.
      # (Same source as build.rs's BUILD_DATE: SOURCE_DATE_EPOCH, else the HEAD commit time.)
      - name: Stamp PE TimeDateStamp to the commit date
        shell: bash
        run: |
          EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
          cargo run --manifest-path xtask/Cargo.toml -- stamp-time \
            app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe "$EPOCH"

      # --- Authenticode signing (#21) — STAGED, inert until a cert is configured ---
      # Position is load-bearing: sign AFTER stamp-time (Authenticode's digest covers the COFF
      # TimeDateStamp) and BEFORE the SHA-256 / SLSA attestation below, so the published checksums
      # and the provenance subject cover the SIGNED bytes. Order: build -> stamp -> SIGN -> hash ->
      # attest. Sign the target/ exe here; Stage then copies the signed bytes into dist/.
      #
      # Path: SignPath Foundation (free OSS) was declined (usage-gated: too new / too few downloads).
      # Primary route is AZURE TRUSTED SIGNING (identity-gated, so a fresh project qualifies; ~$10/mo,
      # individual identity validation). Fallback: an OV cert from a CA (needs a registered org + HSM).
      # To activate:
      #   1. Stand up an Azure Trusted Signing account + cert profile; validate identity.
      #   2. Configure OIDC federation (no long-lived secret) and set repo variable SIGNING_ENABLED=true.
      #   3. Replace the tripwire below with the pinned `azure/trusted-signing-action` (endpoint,
      #      account, cert-profile, files: the target/ exe) — or signtool against the cloud cert.
      # Until then the step SKIPS (SIGNING_ENABLED unset). Fail-closed: if the flag is set before the
      # action is wired, it errors rather than silently shipping unsigned-but-believed-signed.
      - name: Sign (Authenticode)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        shell: bash
        run: |
          echo "::error::SIGNING_ENABLED=true but the Authenticode signing action is not wired yet."
          echo "::error::Wire azure/trusted-signing-action here (see the comment above) — #21."
          exit 1

      - name: Stage artifacts + SHA-256 checksums
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe dist/hp-thermal.exe
          # Debug-symbol sidecar: the linker writes hp_thermal.pdb (Rust underscores the
          # crate name); rename to the exe basename, which is also the name embedded in the
          # exe's debug directory (build.rs sets /PDBALTPATH from CARGO_PKG_NAME).
          Copy-Item app/target/x86_64-pc-windows-msvc/release/hp_thermal.pdb dist/hp-thermal.pdb
          Copy-Item app/*.cdx.json dist/hp-thermal.cdx.json
          $exe = (Get-FileHash dist/hp-thermal.exe      -Algorithm SHA256).Hash.ToLower()
          $pdb = (Get-FileHash dist/hp-thermal.pdb      -Algorithm SHA256).Hash.ToLower()
          $cdx = (Get-FileHash dist/hp-thermal.cdx.json -Algorithm SHA256).Hash.ToLower()
          @("$exe  hp-thermal.exe", "$pdb  hp-thermal.pdb", "$cdx  hp-thermal.cdx.json") |
            Out-File dist/SHA256SUMS -Encoding ascii
          # Out-of-band digests for the verify job (job metadata, not inside the artifact).
          "exe_sha256=$exe" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          "pdb_sha256=$pdb" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii

      # Validate the EXACT staged bytes that will ship (post-copy, pre-upload): import
      # allowlist, high-risk-API scan, mitigation flags, and the exe<->pdb GUID bind. The
      # build tier already ran verify-artifact on the target/ exe; re-checking the dist/
      # copy means a corrupted copy cannot slip through. See #41 / #42.
      - name: Verify staged artifact
        run: cargo run --manifest-path xtask/Cargo.toml -- verify-artifact dist/hp-thermal.exe dist/hp-thermal.pdb

      # #104/#109 consumer gate on the SHIPPED bytes: fail closed if the stamp step didn't run
      # or left a field behind — implausible (zero / pre-project / future) or inconsistent
      # (debug-dir != COFF, surviving REPRO marker). Runs on dist/ only (post-stamp); the
      # pre-stamp `ci` pass on target/ still carries the /Brepro hash and must NOT be gated here.
      - name: Verify PE timestamps (plausible + consistent)
        run: cargo run --manifest-path xtask/Cargo.toml -- verify-timestamp dist/hp-thermal.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # --- Digest chain (#42): re-download the artifact in a FRESH job and prove it is
  #     byte-identical to what build produced+verified, via TWO independent channels — the
  #     out-of-band job outputs (GitHub metadata) AND the in-artifact SHA256SUMS manifest.
  #     A swap/corruption on the build->publish hop mismatches at least one and fails here,
  #     BEFORE publish. Pure hashing: no toolchain, no secrets.
  verify:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist
      # Digests bound via env (not inlined as ${{ }} in the script) so zizmor's
      # template-injection audit stays clean.
      - name: Re-verify staged digests (out-of-band + manifest)
        shell: pwsh
        env:
          EXPECT_EXE: ${{ needs.build.outputs.exe_sha256 }}
          EXPECT_PDB: ${{ needs.build.outputs.pdb_sha256 }}
        run: |
          $exe = (Get-FileHash dist/hp-thermal.exe -Algorithm SHA256).Hash.ToLower()
          $pdb = (Get-FileHash dist/hp-thermal.pdb -Algorithm SHA256).Hash.ToLower()
          if ($exe -ne $env:EXPECT_EXE) { throw "exe digest mismatch vs build output" }
          if ($pdb -ne $env:EXPECT_PDB) { throw "pdb digest mismatch vs build output" }
          # Parse the manifest tolerantly (hash + name per line) instead of matching an
          # exact formatted string — robust to spacing / line-ending drift.
          $manifest = @{}
          foreach ($line in Get-Content dist/SHA256SUMS) {
            $p = $line -split '\s+', 2
            if ($p.Count -eq 2) { $manifest[$p[1].Trim()] = $p[0].ToLower() }
          }
          if ($manifest['hp-thermal.exe'] -ne $exe) { throw "SHA256SUMS exe hash != computed" }
          if ($manifest['hp-thermal.pdb'] -ne $pdb) { throw "SHA256SUMS pdb hash != computed" }
          Write-Output "digest chain OK: published bytes are byte-identical to build-verified bytes"

  # --- Attest + publish. Minimal elevation, no third-party actions / tool builds here.
  #     Attestations run on BOTH a real tag AND a manual workflow_dispatch, so the whole
  #     pipeline is dry-runnable. Only the GitHub Release *publish* step is gated, behind
  #     TWO conditions (v* tag AND dry_run != true) -- see that step's comment.
  publish:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write        # create the Release + upload assets
      id-token: write        # OIDC -> Sigstore (keyless attestation)
      attestations: write    # record provenance + SBOM attestations
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist

      # SLSA build provenance: signs "this exact digest was built by THIS workflow at
      # THIS commit". Anyone verifies with:
      #   gh attestation verify hp-thermal.exe --repo <owner>/<repo>
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # actions/attest-build-provenance v4.1.1
        with:
          # Both shipped binaries are provenance subjects (one attestation, two digests).
          subject-path: |
            dist/hp-thermal.exe
            dist/hp-thermal.pdb

      # attest-sbom was folded into the general-purpose actions/attest (attest-sbom is
      # deprecated). `sbom-path` still auto-detects CycloneDX/SPDX and emits the same
      # https://cyclonedx.org/bom predicate — verified identical to the prior output.
      - name: Attest SBOM
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # actions/attest v4.2.0
        with:
          subject-path: dist/hp-thermal.exe
          sbom-path: dist/hp-thermal.cdx.json

      # FAIL-CLOSED self-verification BEFORE publish (closes the "attest but never verify"
      # seam). Verify each just-created bundle OFFLINE (--bundle = the step's own output,
      # so no attestation-API propagation race) AND pin the signer to THIS repo's release
      # workflow (--signer-workflow). A forged/mis-scoped attestation fails here and we
      # never reach `gh release create`. Runs on dispatch too, so every dry-run exercises
      # it. Negative-tested locally: a wrong --signer-workflow exits 1.
      # Bundle paths are bound via env (NOT inlined as ${{ }} in the script) so zizmor's
      # template-injection audit stays clean: env values are passed to the shell, never
      # expanded into the script source, so there is no command-injection surface.
      - name: Verify attestations before publish (offline, identity-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::provenance"
          for art in dist/hp-thermal.exe dist/hp-thermal.pdb; do
            gh attestation verify "$art" \
              --bundle "$PROVENANCE_BUNDLE" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done
          echo "::endgroup::"
          echo "::group::sbom (cyclonedx)"
          gh attestation verify dist/hp-thermal.exe \
            --bundle "$SBOM_BUNDLE" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          echo "::endgroup::"

      # The attestations are still CREATED and self-verified above; they live in GitHub's
      # attestation store keyed by the exe's digest, so `gh attestation verify` works with
      # no bundle file. We ship only legible assets (exe + SBOM + SHA256SUMS), not the
      # cryptic *.sigstore bundles. Bundles come back if/when the offline updater needs them.

      # First-party gh CLI (no third-party release action). Token is the job-scoped
      # GITHUB_TOKEN with contents: write only.
      # TWO independent conditions must BOTH hold to publish (defense in depth):
      #   1. ref is a v* tag        -> a bare dispatch on main can never publish
      #   2. dry_run is not true    -> closes the dispatch-on-a-TAG hole: even selecting a
      #      tag ref in the dispatch UI stays inert unless dry_run is explicitly unset.
      # A real `push: tags` has no inputs context (inputs.dry_run == null != true) -> publishes.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Notes built with echo lines (GITHUB_* are shell env vars, not GitHub-expression
          # interpolation), so this is zizmor/actionlint clean. 4-space indent = code block.
          {
            echo "## hp-thermal ${GITHUB_REF_NAME}"
            echo
            echo "HP laptop thermal and performance control. A ~300 KB tray app plus Windows service."
            echo
            echo "Verify this download (SLSA provenance + SBOM):"
            echo
            echo "    gh attestation verify hp-thermal.exe --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo
            echo "hp-thermal.pdb is optional debug symbols (to symbolicate a crash report); not needed to run. It is hashed in SHA256SUMS and carries the same provenance attestation as the exe."
            echo
            echo "Details in the README and SECURITY.md. Not yet Authenticode-signed."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            dist/hp-thermal.exe dist/hp-thermal.pdb dist/hp-thermal.cdx.json dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "hp-thermal ${GITHUB_REF_NAME}" \
            --notes-file notes.md
