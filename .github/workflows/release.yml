name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build + attest, but publish NOTHING. Default true — must be
          explicitly unset to publish via dispatch. A tag push ignores this and publishes."
        type: boolean
        default: true

# Default to read-only, no secrets. Only the publish job opts into the minimum extra
# scopes it needs, and only on a real tag. All actions are pinned to a full 40-char
# commit SHA (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
# Dependabot proposes reviewed action bumps; git-rev tool pins are bumped by hand.
permissions:
  contents: read

jobs:
  # --- S2 source-integrity gate: a release may fire ONLY from a commit whose required
  #     checks (ci, scan, CodeQL) concluded success. Closes the seam where a tag push
  #     triggered a release regardless of whether the commit ever passed CI/scan. On a
  #     real tag it is enforced fail-closed; on workflow_dispatch (dry-run) it is skipped
  #     so dry-runs still exercise the pipeline. This complements branch protection +
  #     tag rulesets: even if a tag is somehow placed on a non-green commit, no build runs.
  source-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      # #191: names are not identities. A check named "ci" could be posted by ANY GitHub App
      # with checks:write, and a workflow at a different path can emit a job named "ci". So
      # each required check must ALSO prove its provenance: posted by the GitHub Actions app
      # (numeric id 15368 — can't be name-squatted), bound to THIS commit, and produced by a
      # workflow run whose file path is the expected one (check_suite.id joins check-runs to
      # workflow runs). What this deliberately does NOT solve: the workflow CONTENT at that
      # path is still in-tree and attacker-editable — the externally-controlled-policy leg is
      # #203/#210. This closes check spoofing/renaming; those close policy substitution.
      - name: Require the tagged commit to be CI-green (provenance-verified, #191)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          GH_ACTIONS_APP_ID=15368
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > checks.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" > runs.json
          fail=0
          for pair in "ci|.github/workflows/ci.yml" \
                      "scan|.github/workflows/ci.yml" \
                      "Analyze (rust)|.github/workflows/codeql.yml"; do
            name="${pair%%|*}"; want_wf="${pair##*|}"
            # Latest check-run with this name; extract every field the predicate needs.
            # (tr -d '\r': keep the comparisons byte-exact even where tools emit CRLF.)
            read -r concl app_id suite run_sha < <(jq -r --arg n "$name" \
              '[.check_runs[] | select(.name==$n)] | (sort_by(.started_at) | last) as $c
               | if $c == null then "missing - - -"
                 else "\($c.conclusion) \($c.app.id) \($c.check_suite.id) \($c.head_sha)" end' \
              checks.json | tr -d '\r')
            # Join the check-run's suite to the workflow run that produced it -> workflow file path.
            wf_path=$(jq -r --arg s "$suite" \
              '[.workflow_runs[] | select((.check_suite_id|tostring)==$s)] | (first | .path) // "unjoined"' \
              runs.json | tr -d '\r')
            echo "required check '$name' => conclusion=$concl app=$app_id sha=${run_sha:0:7} workflow=$wf_path"
            [ "$concl" = "success" ]              || { echo "::error::'$name' conclusion is '$concl' (need success)"; fail=1; }
            [ "$app_id" = "$GH_ACTIONS_APP_ID" ]  || { echo "::error::'$name' posted by app id '$app_id' (need GitHub Actions, $GH_ACTIONS_APP_ID) — check-name spoofing?"; fail=1; }
            [ "$run_sha" = "$GITHUB_SHA" ]        || { echo "::error::'$name' is bound to '$run_sha' (need ${GITHUB_SHA})"; fail=1; }
            [ "$wf_path" = "$want_wf" ]           || { echo "::error::'$name' came from workflow '$wf_path' (need $want_wf)"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "Source-integrity gate FAILED: tag is not on a commit with provenance-verified green CI."; exit 1; }
          echo "Source-integrity gate PASSED: all required checks are success, GitHub-Actions-posted, SHA-bound, and from the expected workflow files."

      # Version-coupling gate: the tag and the version COMPILED INTO the binary must match. The
      # binary's version is CARGO_PKG_VERSION (app/Cargo.toml) -- it drives the version display,
      # the install/update dialog, the registry DisplayVersion, AND anti-rollback. The git tag is
      # decoupled from it, so a tag can otherwise ship a binary reporting the wrong version (it did:
      # v0.3.0-rc.1 shipped a 0.2.2 binary). Fail closed unless they agree.
      - name: Require tag to match app/Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ver="${GITHUB_REF_NAME#v}"
          cargo_ver=$(gh api "repos/${GITHUB_REPOSITORY}/contents/app/Cargo.toml?ref=${GITHUB_SHA}" \
            --jq .content | base64 -d | sed -n 's/^version = "\(.*\)".*/\1/p' | head -1)
          echo "tag version:        $tag_ver"
          echo "Cargo.toml version: $cargo_ver"
          [ "$tag_ver" = "$cargo_ver" ] || {
            echo "::error::tag v$tag_ver != app/Cargo.toml version $cargo_ver — the binary would report the wrong version. Bump app/Cargo.toml (and Cargo.lock) to match the tag before tagging."
            exit 1; }
          echo "Version-coupling gate PASSED: binary will report v$cargo_ver."

  # --- Build on a READ-ONLY, secret-less runner. Tool installs execute code, so this
  #     job is bounded to reading public source: it cannot push, publish, or exfiltrate.
  build:
    needs: source-gate
    runs-on: windows-2025
    permissions:
      contents: read
    # Digest chain (#42/#130): publish the PRE-SIGN bytes' SHA-256 as job outputs — an
    # OUT-OF-BAND channel (GitHub job metadata). The `sign` job asserts the artifact it
    # downloads matches this before signing, closing the build->sign custody hop; it then
    # republishes the POST-SIGN digests, which `verify` asserts against SHA256SUMS. Chain:
    # build digest -> asserted at sign -> signed digest -> asserted at verify -> attested.
    outputs:
      exe_unsigned_sha256: ${{ steps.stage.outputs.exe_unsigned_sha256 }}
      pdb_sha256: ${{ steps.stage.outputs.pdb_sha256 }}
      xtask_sha256: ${{ steps.seal_xtask.outputs.xtask_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history so build.rs `git rev-list --count HEAD` is accurate

      - name: Install pinned toolchain + components
        run: rustup toolchain install nightly-2026-07-23 -c rust-src -c clippy -c rustfmt

      # Enforce dependency locking: fails if Cargo.lock is stale / would change. Nothing
      # gets built or published against an unpinned dependency graph.
      - name: Verify dependency lock (no drift)
        working-directory: app
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # #138: the four cargo-* build tools are NO LONGER compiled on the release critical path.
      # They are prebuilt once, out-of-band, by .github/workflows/build-tools.yml (from the same
      # immutable git-rev pins), published to the `tools` release (a mutable byte store), and
      # consumed here BY DIGEST. This removes ~76% of release wall-clock (the 984s compile) AND
      # lifts 1192 build-script executions off the read-only, signed release path entirely — the
      # #137 CARGO_TARGET_DIR dedup was only an interim win; this is the real fix.
      #
      # CANONICAL VERIFICATION (the load-bearing invariant): integrity is anchored to the sha256
      # committed + human-reviewed in tools/TOOLS.lock — NOT to the `tools` release, whose assets
      # are overwritable by anyone who can push a release. Every downloaded binary MUST match its
      # committed digest or the release ABORTS here, BEFORE the tool is ever executed. An all-zero
      # digest ("not blessed yet") also hard-fails, so the prebuilt flow can never run against an
      # unverified anchor. A maintainer-account compromise can overwrite the `tools` asset but
      # cannot rewrite the git-committed digest without a reviewed commit — so a swapped tool is
      # caught here, not run.
      #
      # Bumping a tool stays a reviewed change: edit its rev in tools/TOOLS.lock -> run
      # build-tools.yml -> commit the printed digest (see tools/README.md). #145 tracks upstream
      # drift; adopting a newer rev is deliberate, never automatic.
      #
      # #221: the fetch+verify logic is factored into .github/actions/fetch-tools so every
      # consumer (this job, supply-chain.yml) shares ONE parser and verification path. `only`
      # is least-privilege: the release takes exactly the four tools it runs — cargo-vet (also
      # in TOOLS.lock) never lands on this job's PATH.
      - name: Fetch + verify prebuilt release tools (digest-pinned, fail-closed)
        id: tools
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-deny cargo-auditable cargo-audit cargo-cyclonedx
          verify-attestations: "true"

      # NO PATH exposure (#221, maintainer decision after the zizmor github-env finding): the
      # verified tools are consumed by ABSOLUTE PATH only. xtask receives the directory as
      # PINNED_TOOLS_DIR (env-bound below) and invokes each cargo-<sub> binary directly —
      # nothing is shadowable, no later step inherits ambient authority, and the finding is
      # eliminated structurally rather than suppressed or relocated.

      # --- #130/#195: xtask is pure-std with ZERO dependencies, so it builds to a standalone
      #     binary in seconds. #195: build it ONCE, up front, in release profile, and invoke
      #     THAT exe for every xtask step below (no dev-profile compile, no repeated
      #     `cargo run` overhead). The same exe is uploaded for the POST-SIGN `verify` job,
      #     so the verifier that re-checks the signed bytes downstream is byte-identical to
      #     the binary that ran the in-release checks here — a custody improvement, not just
      #     a wall-clock one. (A Rust toolchain must never exist in the credentialed `sign`
      #     job, which is why `verify` needs the standalone exe at all.)
      - name: Build xtask once (release; used for every xtask step + shipped to verify)
        run: cargo build --release --manifest-path xtask/Cargo.toml

      # #196: production-artifact tier ONLY — cargo-deny policy + cargo-auditable release
      # build (embeds the dep tree in the binary) + `cargo audit bin` on the artifact + PE
      # exploit-mitigation verification. fmt/clippy/tests are NOT re-run here: source-gate
      # already requires a provenance-verified green `ci` check on this exact SHA (#191 —
      # posted by the GitHub Actions app, from ci.yml, SHA-bound), which ran that source
      # tier. Re-running it in this workflow was never an independent trust domain (an
      # attacker editing release.yml can edit the re-run too); the verified out-of-band CI
      # verdict is the stronger control, and this drops ~2m24s of duplicate work.
      - name: Attest build (deny / auditable / audit-bin / verify-hardening)
        env:
          PINNED_TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: xtask/target/release/xtask.exe release-attest

      - name: Generate SBOM (CycloneDX)
        working-directory: app
        shell: bash
        env:
          TOOLS_DIR: ${{ steps.tools.outputs.tools-dir }}
        run: '"$TOOLS_DIR/cargo-cyclonedx.exe" cyclonedx --format json'

      # #104: MUTATION before any seal. Patch the /Brepro hash timestamp (which decodes to an
      # implausible year and can trip timestomp heuristics) to the reproducible commit epoch —
      # plausible AND deterministic. link.exe has no /TIMESTAMP, so it's a post-link patch, and
      # it MUST run before the SHA-256 / attestation below so those cover the stamped bytes.
      # (Same source as build.rs's BUILD_DATE: SOURCE_DATE_EPOCH, else the HEAD commit time.)
      - name: Stamp PE TimeDateStamp to the commit date
        shell: bash
        run: |
          EPOCH="${SOURCE_DATE_EPOCH:-$(git log -1 --format=%ct)}"
          xtask/target/release/xtask.exe stamp-time \
            app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe "$EPOCH"

      # Stage the UNSIGNED bytes. SHA256SUMS is deliberately NOT written here: it must cover
      # the SIGNED bytes, so the `sign` job produces it. Only the out-of-band pre-sign digests
      # are emitted, for the build->sign custody assertion (#42/#130).
      - name: Stage artifacts (unsigned)
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe dist/hp-thermal.exe
          # Debug-symbol sidecar: build.rs names the pdb hp-thermal.pdb AT THE SOURCE (/PDB +
          # /PDBALTPATH from CARGO_PKG_NAME), matching the exe basename embedded in its debug
          # directory — so this is a straight copy, no rename.
          Copy-Item app/target/x86_64-pc-windows-msvc/release/hp-thermal.pdb dist/hp-thermal.pdb
          Copy-Item app/*.cdx.json dist/hp-thermal.cdx.json
          $exe = (Get-FileHash dist/hp-thermal.exe -Algorithm SHA256).Hash.ToLower()
          $pdb = (Get-FileHash dist/hp-thermal.pdb -Algorithm SHA256).Hash.ToLower()
          "exe_unsigned_sha256=$exe" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          "pdb_sha256=$pdb"          | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii

      # PASS 1 of 2 (#130) — FAIL FAST, pre-sign. Catches a bad build before it consumes a
      # signing operation AND a human environment approval. Authenticode only appends a
      # certificate table and updates the PE checksum; imports, mitigation flags, the debug
      # directory and the COFF TimeDateStamp are untouched, so a pass here still holds after
      # signing. Pass 2 in `verify` re-asserts it on the signed bytes rather than assuming it,
      # which is what keeps the "validate the EXACT bytes that ship" invariant intact.
      - name: Verify staged artifact (pre-sign, fail-fast)
        run: xtask/target/release/xtask.exe verify-artifact dist/hp-thermal.exe dist/hp-thermal.pdb

      # #104/#109 gate: fail closed if the stamp step didn't run or left a field behind —
      # implausible (zero / pre-project / future) or inconsistent (debug-dir != COFF,
      # surviving REPRO marker). Runs on dist/ only (post-stamp); the pre-stamp `ci` pass on
      # target/ still carries the /Brepro hash and must NOT be gated here.
      - name: Verify PE timestamps (pre-sign, fail-fast)
        run: xtask/target/release/xtask.exe verify-timestamp dist/hp-thermal.exe

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact v7.0.1
        with:
          name: dist-unsigned
          path: dist/
          if-no-files-found: error

      # #195: seal the verifier's digest as an out-of-band job output (same channel as the
      # exe/pdb digests). The `verify` job asserts the downloaded xtask.exe against this
      # BEFORE executing it — previously the CHECKER was the one artifact crossing the
      # store un-asserted, inverted from the TOOLS.lock doctrine (byte stores are
      # untrusted; digests authorize execution).
      - name: Seal xtask verifier digest
        id: seal_xtask
        shell: pwsh
        run: |
          $x = (Get-FileHash xtask/target/release/xtask.exe -Algorithm SHA256).Hash.ToLower()
          "xtask_sha256=$x" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii

      # The verifier travels separately so `verify` needs neither the repo nor a toolchain.
      - name: Upload xtask verifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact v7.0.1
        with:
          name: xtask-verifier
          path: xtask/target/release/xtask.exe
          if-no-files-found: error

  # --- SIGN (#21/#130). The ONLY job holding a credential capable of signing as our
  #     published identity, so it is deliberately minimal: download, assert, log in, sign,
  #     hash, upload. NO repo checkout, NO toolchain, NO third-party tool builds — every
  #     step inside a job with `id-token: write` can mint OIDC tokens, so the blast radius
  #     is kept to actions we pin by SHA.
  #
  #     Trust path: GitHub mints a short-lived OIDC token whose subject is
  #     `repo:<owner>/<repo>:environment:release`. Azure's federated credential accepts ONLY
  #     that subject, which cannot be produced until the `release` environment's required
  #     reviewer approves — so the human gate is part of the cryptographic path, not just
  #     workflow etiquette. No secret exists to steal: the app registration has zero
  #     password and zero certificate credentials.
  #
  #     Least privilege: the CI principal holds exactly one role assignment — Artifact
  #     Signing Certificate Profile Signer — scoped to a single certificate profile.
  sign:
    needs: build
    runs-on: windows-2025
    # Two environments, deliberately. A real release (v* tag) deploys to `release`, whose
    # ONLY deployment policy is the v* TAG rule -- so the production signing path cannot be
    # reached from a branch at all. A workflow_dispatch dry-run deploys to `release-dryrun`,
    # whose policy allows the `main` BRANCH.
    #
    # Why not one environment: a tag policy cannot match a branch ref, so a dispatch run
    # against a tag-only environment is REJECTED at policy evaluation -- before the reviewer
    # gate -- and the job dies in ~1s with zero steps and no approval prompt. Allowing `main`
    # on the single `release` environment would instead have widened the production path.
    #
    # Both environments require the same human reviewer, and each has its own federated
    # credential (subjects `...:environment:release` and `...:environment:release-dryrun`),
    # so the OIDC subject distinguishes the two paths at the Azure end as well. This is also
    # the seam #132 needs: `release` later moves to a production-only identity holding
    # Certificate Profile Signer on rjg-publictrust, while `release-dryrun` keeps the
    # test-profile identity.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'release-dryrun' }}
    permissions:
      contents: read
      id-token: write        # OIDC -> Azure (federated, no secret)
    outputs:
      exe_sha256: ${{ steps.seal.outputs.exe_sha256 }}
      pdb_sha256: ${{ steps.seal.outputs.pdb_sha256 }}
    steps:
      # FIRST step, before anything touches a credential. Every other exposure in this job
      # is closed structurally -- there is no key to leak (the private key never leaves
      # Microsoft's HSM; we send a digest and receive a signature), and the AZURE_* vars are
      # identifiers, not credentials: they authenticate nothing without an OIDC assertion
      # that only GitHub can mint for subject `repo:<owner>/<repo>:environment:release`.
      #
      # Verbose logging was the one remaining exposure that was hygiene rather than
      # structure, so we close it by refusing to run. `runner.debug` is 1 whenever step
      # debug logging is active, which covers ALL three ways it can be turned on: the
      # ACTIONS_STEP_DEBUG repo secret, the repo variable, and the "Re-run jobs with debug
      # logging" checkbox (which write-access holders can tick and we cannot prevent).
      # Detect-and-refuse is the available control when prevention isn't.
      - name: Refuse to sign under debug logging
        if: ${{ runner.debug == '1' }}
        shell: bash
        run: |
          echo "::error::ACTIONS_STEP_DEBUG is enabled; refusing to sign. Re-run without debug logging."
          exit 1

      - name: Download unsigned artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: dist-unsigned
          path: dist

      # Close the build->sign custody hop (#42/#130): the bytes we are about to sign must be
      # exactly the bytes `build` produced and verified. Digests bound via env (not inlined
      # as ${{ }}) so zizmor's template-injection audit stays clean.
      - name: Assert incoming bytes match build output
        shell: pwsh
        env:
          EXPECT_EXE: ${{ needs.build.outputs.exe_unsigned_sha256 }}
          EXPECT_PDB: ${{ needs.build.outputs.pdb_sha256 }}
        run: |
          $exe = (Get-FileHash dist/hp-thermal.exe -Algorithm SHA256).Hash.ToLower()
          $pdb = (Get-FileHash dist/hp-thermal.pdb -Algorithm SHA256).Hash.ToLower()
          if ($exe -ne $env:EXPECT_EXE) { throw "pre-sign exe digest != build output (build->sign custody break)" }
          if ($pdb -ne $env:EXPECT_PDB) { throw "pre-sign pdb digest != build output (build->sign custody break)" }
          Write-Output "build->sign custody OK: signing the exact bytes build verified"

      - name: Azure login (OIDC, federated — no secret)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca  # Azure/login v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Timestamping is REQUIRED, not optional: certificates live 72 hours. Without an
      # RFC3161 timestamp every release would stop validating three days after it shipped.
      # The action defaults to http://timestamp.acs.microsoft.com; pinned explicitly here so
      # the requirement is visible rather than inherited.
      - name: Sign (Authenticode)
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # Azure/artifact-signing-action v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\hp-thermal.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fail-closed signer verification. Consumes the RAW WinVerifyTrust HRESULT, NOT
      # Get-AuthenticodeSignature.Status.
      #
      # Why not Status -- MEASURED on this project's Windows box, not assumed. Signing a PE
      # with an untrusted root and then corrupting bytes, then reading both engines:
      #   clean untrusted-root cert   Status=Valid        WVT HRESULT=0x800B0109 (UNTRUSTEDROOT)
      #   SIGNATURE bytes corrupted   Status=Valid        WVT HRESULT=0x800B0100 (broken signature)
      #   code bytes corrupted        Status=HashMismatch WVT HRESULT=0x80096010 (bad digest)
      # Status returns 'Valid' for BOTH a legitimately-untrusted test root AND a
      # cryptographically BROKEN signature -- so a Status=='Valid' gate would accept a broken
      # signature, and a Status-in-(Valid,UnknownError) gate accepts every crypto failure that
      # buckets into UnknownError (invalid timestamp countersignature, broken cert-chain link,
      # broken primary signature, ASN.1 corruption). Status is a lossy enum; it discards the
      # exact crypto verdict we need.
      #
      # WinVerifyTrust runs the full cryptography: the PE digest, the primary SignerInfo
      # signature against the signer's PUBLIC KEY, every certificate's chain-link signature,
      # and the timestamp countersignature. Its HRESULT distinguishes the ONE tolerable defect
      # (0x800B0109 -- chain is cryptographically valid, we just don't have the test root
      # installed on the runner) from every genuine crypto failure (each a different code).
      #   production (tag)  -> require S_OK (0x0): full chain to a trusted PUBLIC root
      #   test (dry-run)    -> require EXACTLY 0x800B0109: all signatures verified, only defect
      #                        is the missing Microsoft test root. Any other value == real
      #                        crypto failure -> throw.
      #
      # Identity is then pinned by the DURABLE 311.97 EKU (Microsoft doc: value unique to the
      # identity-validation resource, STABLE across the daily cert renewals -- subject/thumb/
      # public-key are not). The subject DN is a SECONDARY assertion only: "Robert Gonzales,
      # San Francisco" is a common identity another CA could re-issue to a different person, so
      # it is not the anchor. Full-string OID match, never a prefix. All values hardcoded so
      # changing an accepted identity needs a reviewed PR, never a repo-variable flip (#132).
      #
      # NOT enforced here (documented so the check does not overclaim): certificate revocation
      # (WTD_REVOKE_NONE -- the sign/verify jobs may lack OCSP/CRL reachability; a network
      # blip must not flip a good release to rejected); nested-signature presence/absence;
      # trust in Microsoft's assignment of the durable-identity octets. Byte integrity is the
      # digest chain's job (build->sign->verify), not this step's.
      - name: Assert the binary is actually signed
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          EXPECT_PUBLIC_TRUST: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Durable identity anchors (311.97 EKUs, observed live from the profiles). Full-string
          # match, never a prefix. Editing an accepted identity requires a reviewed PR (#132).
          $ProdIdentityEku     = '1.3.6.1.4.1.311.97.560077468.167399228.786894322.562638940'
          $ProdPublicTrustMark = '1.3.6.1.4.1.311.97.1.0'
          $TestIdentityEku     = '1.3.6.1.4.1.311.97.1.2.881842232.80014427.164345747.789896896'
          $LifetimeSigningEku  = '1.3.6.1.4.1.311.10.3.13'
          $ProdSubject         = 'CN=Robert Gonzales, O=Robert Gonzales, L=San Francisco, S=ca, C=US'
          $TestSubject         = 'CN=Robert Gonzales(TEST ONLY), O=Robert Gonzales, L=San Francisco, S=ca, C=US'

          Add-Type -Language CSharp -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class WinTrust {
            [StructLayout(LayoutKind.Sequential)]
            struct FI { public uint cb; [MarshalAs(UnmanagedType.LPWStr)] public string p; public IntPtr h; public IntPtr g; }
            [StructLayout(LayoutKind.Sequential)]
            struct WD { public uint cb; public IntPtr a; public IntPtr b; public uint ui; public uint rev; public uint uc;
              public IntPtr file; public uint sa; public IntPtr st; public IntPtr url; public uint pf; public uint ctx; public IntPtr ss; }
            [DllImport("wintrust.dll", CharSet=CharSet.Unicode)] static extern int WinVerifyTrust(IntPtr h, ref Guid g, ref WD d);
            public static uint Verify(string path) {
              Guid a = new Guid("00AAC56B-CD44-11d0-8CC2-00C04FC295EE"); // WINTRUST_ACTION_GENERIC_VERIFY_V2
              var fi = new FI(); fi.cb=(uint)Marshal.SizeOf(typeof(FI)); fi.p=path;
              IntPtr pf = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(FI))); Marshal.StructureToPtr(fi, pf, false);
              var d = new WD(); d.cb=(uint)Marshal.SizeOf(typeof(WD)); d.ui=2; d.rev=0; d.uc=1; d.file=pf; d.sa=1; // UI_NONE, REVOKE_NONE, CHOICE_FILE, VERIFY
              int hr = WinVerifyTrust(IntPtr.Zero, ref a, ref d);
              d.sa=2; WinVerifyTrust(IntPtr.Zero, ref a, ref d); Marshal.FreeHGlobal(pf); // STATEACTION_CLOSE
              return unchecked((uint)hr);
            }
          }
          '@
          # 0x800B0109 parses as a NEGATIVE Int32 in PowerShell; the Int64 'L' literal keeps the
          # uint32 comparison correct. (Verified: [uint32]0x800B0109 throws.)
          [uint32]$S_OK                 = 0
          [uint32]$CERT_E_UNTRUSTEDROOT = 0x800B0109L

          $file = 'dist/hp-thermal.exe'
          $sig  = Get-AuthenticodeSignature $file
          [uint32]$hr = [WinTrust]::Verify((Resolve-Path $file).Path)

          Write-Output ("wvt HRESULT: 0x{0:X8}" -f $hr)
          Write-Output "status:      $($sig.Status) — $($sig.StatusMessage)"
          if (-not $sig.SignerCertificate)      { throw "no signer certificate — the file is NOT signed" }
          Write-Output "subject:     $($sig.SignerCertificate.Subject)"
          if (-not $sig.TimeStamperCertificate) { throw "signature is NOT timestamped — it would expire with the 72h cert" }
          Write-Output "timestamp:   $($sig.TimeStamperCertificate.Subject)"

          # Union EKUs across every 2.5.29.37 extension, criticality-agnostic, so an ABSENCE
          # assertion (no Lifetime EKU on prod) cannot be dodged by a duplicate extension.
          $ekus = @()
          foreach ($ext in ($sig.SignerCertificate.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' })) {
            $ekus += ([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$ext).EnhancedKeyUsages | ForEach-Object Value
          }
          $ekus = $ekus | Sort-Object -Unique
          Write-Output "ekus:        $($ekus -join '  ')"
          $hasLifetimeEku = $ekus -contains $LifetimeSigningEku

          switch ($env:EXPECT_PUBLIC_TRUST) {
            'true' {
              if ($hr -ne $S_OK) {
                throw ("production WinVerifyTrust HRESULT is 0x{0:X8}, expected S_OK — chain not fully trusted/valid" -f $hr) }
              if ($ekus -notcontains $ProdIdentityEku) {
                throw "signer lacks the production durable-identity EKU ($ProdIdentityEku)" }
              if ($ekus -notcontains $ProdPublicTrustMark) {
                throw "signer lacks the Public Trust marker EKU ($ProdPublicTrustMark)" }
              if ($hasLifetimeEku) {
                throw "signer carries the Lifetime Signing EKU — a TEST-profile cert on the production path" }
              if ($sig.SignerCertificate.Subject -ne $ProdSubject) {
                throw "secondary check: subject '$($sig.SignerCertificate.Subject)' != pinned production subject" }
              Write-Output "PRODUCTION signature verified: WVT=S_OK, prod durable-identity EKU, no test EKU."
            }
            'false' {
              if ($hr -ne $CERT_E_UNTRUSTEDROOT) {
                throw ("test WinVerifyTrust HRESULT is 0x{0:X8}, expected exactly CERT_E_UNTRUSTEDROOT (0x800B0109) — the only tolerated defect is the missing test root; anything else is a real crypto failure" -f $hr) }
              if ($ekus -notcontains $TestIdentityEku) {
                throw "signer lacks the test durable-identity EKU ($TestIdentityEku)" }
              if (-not $hasLifetimeEku) {
                throw "signer lacks the Lifetime Signing EKU — NOT a test-profile cert; refusing it on the dry-run path" }
              if ($sig.SignerCertificate.Subject -ne $TestSubject) {
                throw "secondary check: subject '$($sig.SignerCertificate.Subject)' != pinned test subject" }
              Write-Output "TEST signature verified: WVT=CERT_E_UNTRUSTEDROOT (only defect is missing test root), test durable-identity EKU + Lifetime EKU."
            }
            default { throw "EXPECT_PUBLIC_TRUST is '$($env:EXPECT_PUBLIC_TRUST)' — refusing to guess the trust expectation" }
          }

      # SHA256SUMS is written HERE so it covers the signed bytes, preserving the load-bearing
      # order: build -> stamp -> SIGN -> hash -> attest.
      - name: Seal — SHA-256 over the signed bytes
        id: seal
        shell: pwsh
        run: |
          $exe = (Get-FileHash dist/hp-thermal.exe      -Algorithm SHA256).Hash.ToLower()
          $pdb = (Get-FileHash dist/hp-thermal.pdb      -Algorithm SHA256).Hash.ToLower()
          $cdx = (Get-FileHash dist/hp-thermal.cdx.json -Algorithm SHA256).Hash.ToLower()
          # LF + no BOM so `sha256sum -c SHA256SUMS` parses on Linux/macOS. Out-File -Encoding
          # ascii writes CRLF, whose trailing \r trips sha256sum ("No such file or directory").
          # -NoNewline keeps exactly our explicit `n between/after entries.
          $lines = @("$exe  hp-thermal.exe", "$pdb  hp-thermal.pdb", "$cdx  hp-thermal.cdx.json")
          ($lines -join "`n") + "`n" | Set-Content -Path dist/SHA256SUMS -NoNewline -Encoding utf8NoBOM
          "exe_sha256=$exe" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii
          "pdb_sha256=$pdb" | Out-File $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # --- Digest chain (#42): re-download the artifact in a FRESH job and prove it is
  #     byte-identical to what build produced+verified, via TWO independent channels — the
  #     out-of-band job outputs (GitHub metadata) AND the in-artifact SHA256SUMS manifest.
  #     A swap/corruption on the build->publish hop mismatches at least one and fails here,
  #     BEFORE publish. Pure hashing: no toolchain, no secrets.
  verify:
    needs: [build, sign]
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist

      # The standalone verifier built by `build` — no repo checkout, no Rust toolchain.
      - name: Download xtask verifier
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: xtask-verifier
          path: verifier

      # #195: the verifier must prove ITS OWN custody before it verifies anything else —
      # assert the downloaded bytes against the build job's sealed digest, fail-closed,
      # BEFORE first execution. (Within a job no such check is meaningful — same runner
      # computes both sides; across the artifact-store hop it is load-bearing.)
      - name: Assert verifier digest (build->verify custody, fail-closed)
        shell: pwsh
        env:
          EXPECT_XTASK: ${{ needs.build.outputs.xtask_sha256 }}
        run: |
          if ([string]::IsNullOrEmpty($env:EXPECT_XTASK)) { throw "no sealed xtask digest from build (fail-closed)" }
          $x = (Get-FileHash verifier/xtask.exe -Algorithm SHA256).Hash.ToLower()
          if ($x -ne $env:EXPECT_XTASK) { throw "xtask verifier digest mismatch vs build output (build->verify custody break)" }
          Write-Output "verifier custody OK: executing the exact binary the build job produced"

      # Digests bound via env (not inlined as ${{ }} in the script) so zizmor's
      # template-injection audit stays clean. Anchored on the SIGN job's outputs: those
      # describe the signed bytes that actually ship.
      - name: Re-verify staged digests (out-of-band + manifest)
        shell: pwsh
        env:
          EXPECT_EXE: ${{ needs.sign.outputs.exe_sha256 }}
          EXPECT_PDB: ${{ needs.sign.outputs.pdb_sha256 }}
        run: |
          $exe = (Get-FileHash dist/hp-thermal.exe -Algorithm SHA256).Hash.ToLower()
          $pdb = (Get-FileHash dist/hp-thermal.pdb -Algorithm SHA256).Hash.ToLower()
          if ($exe -ne $env:EXPECT_EXE) { throw "exe digest mismatch vs build output" }
          if ($pdb -ne $env:EXPECT_PDB) { throw "pdb digest mismatch vs build output" }
          # Parse the manifest tolerantly (hash + name per line) instead of matching an
          # exact formatted string — robust to spacing / line-ending drift.
          $manifest = @{}
          foreach ($line in Get-Content dist/SHA256SUMS) {
            $p = $line -split '\s+', 2
            if ($p.Count -eq 2) { $manifest[$p[1].Trim()] = $p[0].ToLower() }
          }
          if ($manifest['hp-thermal.exe'] -ne $exe) { throw "SHA256SUMS exe hash != computed" }
          if ($manifest['hp-thermal.pdb'] -ne $pdb) { throw "SHA256SUMS pdb hash != computed" }
          Write-Output "digest chain OK: published bytes are byte-identical to the signed, sealed bytes"

      # --- PASS 2 of 2 (#130): the AUTHORITATIVE run, on the exact bytes that ship.
      #     This is what preserves the "validate the EXACT staged bytes that will ship"
      #     invariant across the signing split: pass 1 in `build` is fail-fast on unsigned
      #     bytes, but the claim is only *asserted* here, post-sign. Runs the prebuilt
      #     verifier, so this job needs no repo and no toolchain.
      - name: Verify signed artifact (post-sign, authoritative)
        run: verifier\xtask.exe verify-artifact dist/hp-thermal.exe dist/hp-thermal.pdb

      - name: Verify PE timestamps on signed bytes (post-sign, authoritative)
        run: verifier\xtask.exe verify-timestamp dist/hp-thermal.exe

      # Signature presence is asserted in `sign`; re-assert on the downloaded bytes so a
      # swap on the sign->verify hop cannot strip the signature unnoticed.
      # Mirrors the WinVerifyTrust-based assertion in `sign`, on the bytes as downloaded, so a
      # swap on the sign->verify hop cannot strip or substitute the signature unnoticed. Same
      # reasoning (see the `sign` step's comment): Get-AuthenticodeSignature.Status is a lossy
      # enum that reports 'Valid' for both an untrusted root AND a broken signature, so the raw
      # WinVerifyTrust HRESULT is the crypto verdict and the durable 311.97 EKU is the identity.
      - name: Re-assert Authenticode signature survived transport
        if: ${{ vars.SIGNING_ENABLED == 'true' }}
        shell: pwsh
        env:
          EXPECT_PUBLIC_TRUST: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $ErrorActionPreference = 'Stop'

          $ProdIdentityEku     = '1.3.6.1.4.1.311.97.560077468.167399228.786894322.562638940'
          $ProdPublicTrustMark = '1.3.6.1.4.1.311.97.1.0'
          $TestIdentityEku     = '1.3.6.1.4.1.311.97.1.2.881842232.80014427.164345747.789896896'
          $LifetimeSigningEku  = '1.3.6.1.4.1.311.10.3.13'
          $ProdSubject         = 'CN=Robert Gonzales, O=Robert Gonzales, L=San Francisco, S=ca, C=US'
          $TestSubject         = 'CN=Robert Gonzales(TEST ONLY), O=Robert Gonzales, L=San Francisco, S=ca, C=US'

          Add-Type -Language CSharp -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class WinTrust {
            [StructLayout(LayoutKind.Sequential)]
            struct FI { public uint cb; [MarshalAs(UnmanagedType.LPWStr)] public string p; public IntPtr h; public IntPtr g; }
            [StructLayout(LayoutKind.Sequential)]
            struct WD { public uint cb; public IntPtr a; public IntPtr b; public uint ui; public uint rev; public uint uc;
              public IntPtr file; public uint sa; public IntPtr st; public IntPtr url; public uint pf; public uint ctx; public IntPtr ss; }
            [DllImport("wintrust.dll", CharSet=CharSet.Unicode)] static extern int WinVerifyTrust(IntPtr h, ref Guid g, ref WD d);
            public static uint Verify(string path) {
              Guid a = new Guid("00AAC56B-CD44-11d0-8CC2-00C04FC295EE");
              var fi = new FI(); fi.cb=(uint)Marshal.SizeOf(typeof(FI)); fi.p=path;
              IntPtr pf = Marshal.AllocHGlobal(Marshal.SizeOf(typeof(FI))); Marshal.StructureToPtr(fi, pf, false);
              var d = new WD(); d.cb=(uint)Marshal.SizeOf(typeof(WD)); d.ui=2; d.rev=0; d.uc=1; d.file=pf; d.sa=1;
              int hr = WinVerifyTrust(IntPtr.Zero, ref a, ref d);
              d.sa=2; WinVerifyTrust(IntPtr.Zero, ref a, ref d); Marshal.FreeHGlobal(pf);
              return unchecked((uint)hr);
            }
          }
          '@
          [uint32]$S_OK                 = 0
          [uint32]$CERT_E_UNTRUSTEDROOT = 0x800B0109L

          $file = 'dist/hp-thermal.exe'
          $sig  = Get-AuthenticodeSignature $file
          [uint32]$hr = [WinTrust]::Verify((Resolve-Path $file).Path)

          Write-Output ("wvt HRESULT: 0x{0:X8}" -f $hr)
          Write-Output "status:      $($sig.Status) — $($sig.StatusMessage)"
          if (-not $sig.SignerCertificate)      { throw "no signer certificate after transport — signature stripped" }
          if (-not $sig.TimeStamperCertificate) { throw "timestamp missing after transport" }

          $ekus = @()
          foreach ($ext in ($sig.SignerCertificate.Extensions | Where-Object { $_.Oid.Value -eq '2.5.29.37' })) {
            $ekus += ([System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]$ext).EnhancedKeyUsages | ForEach-Object Value
          }
          $ekus = $ekus | Sort-Object -Unique
          $hasLifetimeEku = $ekus -contains $LifetimeSigningEku

          switch ($env:EXPECT_PUBLIC_TRUST) {
            'true' {
              if ($hr -ne $S_OK) {
                throw ("production WinVerifyTrust HRESULT is 0x{0:X8} after transport, expected S_OK" -f $hr) }
              if ($ekus -notcontains $ProdIdentityEku) {
                throw "signer lacks the production durable-identity EKU after transport ($ProdIdentityEku)" }
              if ($ekus -notcontains $ProdPublicTrustMark) {
                throw "signer lacks the Public Trust marker EKU after transport ($ProdPublicTrustMark)" }
              if ($hasLifetimeEku) {
                throw "signer carries the Lifetime Signing EKU after transport — a TEST cert on the production path" }
              if ($sig.SignerCertificate.Subject -ne $ProdSubject) {
                throw "secondary check: subject '$($sig.SignerCertificate.Subject)' != pinned production subject" }
            }
            'false' {
              if ($hr -ne $CERT_E_UNTRUSTEDROOT) {
                throw ("test WinVerifyTrust HRESULT is 0x{0:X8} after transport, expected exactly CERT_E_UNTRUSTEDROOT (0x800B0109)" -f $hr) }
              if ($ekus -notcontains $TestIdentityEku) {
                throw "signer lacks the test durable-identity EKU after transport ($TestIdentityEku)" }
              if (-not $hasLifetimeEku) {
                throw "signer lacks the Lifetime Signing EKU after transport — refusing a non-test cert on the dry-run path" }
              if ($sig.SignerCertificate.Subject -ne $TestSubject) {
                throw "secondary check: subject '$($sig.SignerCertificate.Subject)' != pinned test subject" }
            }
            default { throw "EXPECT_PUBLIC_TRUST is '$($env:EXPECT_PUBLIC_TRUST)' — refusing to guess the trust expectation" }
          }
          Write-Output ("signature intact (WVT 0x{0:X8}): $($sig.SignerCertificate.Subject)" -f $hr)

  # --- Attest + publish. Minimal elevation, no third-party actions / tool builds here.
  #     Attestations run on BOTH a real tag AND a manual workflow_dispatch, so the whole
  #     pipeline is dry-runnable. Only the GitHub Release *publish* step is gated, behind
  #     TWO conditions (v* tag AND dry_run != true) -- see that step's comment.
  # Option A (#160): the AUTHORITATIVE PE-hardening scan — on the SIGNED, shipped bytes, so the
  # BA2022 SignSecurely rule (NotApplicable on the unsigned PR early-warning) actually evaluates
  # here. Same shared composite action (.github/actions/binskim-scan) as the PR job, but GATING:
  # any BinSkim finding fails the release (and fail-closed if the scan could not run). Gates
  # `publish` via its `needs`, so a hardening regression can never ship.
  binskim-release:
    needs: [build, sign]
    runs-on: windows-2025
    permissions:
      contents: read
    # Publish the SARIF's sha256 as a JOB OUTPUT — a run-metadata channel, separate from the
    # artifact bytes — so attest-sarif can assert the SARIF it attests is the one produced here
    # (the out-of-band custody hop, like build->sign). #171.
    outputs:
      sarif_sha256: ${{ steps.sarif_digest.outputs.sha256 }}
    steps:
      - name: Harden runner (egress audited)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # Sparse: ONLY the composite action, so this stays close to verify's no-full-checkout intent.
      - name: Checkout (composite action only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/binskim-scan
      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist
      - name: BinSkim scan (authoritative, gating — signed bytes)
        uses: ./.github/actions/binskim-scan
        with:
          exe: dist/hp-thermal.exe
          symbol-dir: dist
          sarif-out: ${{ runner.temp }}/binskim-release.sarif
          gate-on-findings: "true"
      - name: Publish SARIF digest (out-of-band custody channel, #171)
        id: sarif_digest
        shell: pwsh
        run: |
          $h = (Get-FileHash "$env:RUNNER_TEMP/binskim-release.sarif" -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "release SARIF sha256: $h"
      - name: Upload SARIF (inert artifact)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact v7.0.1
        with:
          name: binskim-release-sarif
          path: ${{ runner.temp }}/binskim-release.sarif
          if-no-files-found: warn

  # #171: give the release SARIF a real chain of custody + a signed attestation, WITHOUT
  # over-privileging the scanner. binskim-release (contents:read) published the SARIF's sha256 as a
  # job output; this job asserts the downloaded SARIF matches it (custody hop), then attests it:
  # subject = the exe digest, so the claim is "hp-thermal.exe (digest D) was BinSkim-scanned with
  # this result". Joins the provenance + SBOM attestations, all keyed to the same digest. Only THIS
  # job holds id-token/attestations:write; the scanner stayed contents:read. Gates publish.
  attest-sarif:
    needs: [verify, binskim-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC -> Sigstore (keyless)
      attestations: write # record the SARIF attestation
    steps:
      - name: Download signed artifacts (the exe subject)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist
      - name: Download release SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: binskim-release-sarif
          path: sarif
      - name: Custody hop — SARIF matches binskim-release's out-of-band digest (fail-closed)
        shell: bash
        env:
          EXPECTED: ${{ needs.binskim-release.outputs.sarif_sha256 }}
        run: |
          set -euo pipefail
          got=$(sha256sum sarif/binskim-release.sarif | cut -d' ' -f1)
          echo "expected=$EXPECTED got=$got"
          [ -n "$EXPECTED" ] || { echo "::error::no SARIF digest published by binskim-release"; exit 1; }
          [ "$got" = "$EXPECTED" ] || { echo "::error::release SARIF digest mismatch — custody violation"; exit 1; }
      - name: Attest the SARIF (subject = exe digest)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # actions/attest v4.2.2
        with:
          subject-path: dist/hp-thermal.exe
          predicate-type: https://docs.oasis-open.org/sarif/sarif/v2.1.0
          predicate-path: sarif/binskim-release.sarif
      # FAIL-CLOSED self-verification before publish (matches provenance/SBOM): verify the bundle
      # OFFLINE and pin the signer to THIS repo's release workflow.
      - name: Verify the SARIF attestation before publish (offline, identity-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify dist/hp-thermal.exe \
            --bundle "$BUNDLE" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://docs.oasis-open.org/sarif/sarif/v2.1.0 \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          echo "SARIF attestation verified."

  # ALSO surface the release SARIF in the Code-scanning tab (human-browsable posture) — the
  # Attestation (#171) is the signed record; this is the readable view. Release-only, and a
  # DEDICATED job holding ONLY security-events:write (kept out of the attester so each privileged
  # scope stays in its own minimal job). NON-gating (not in publish's needs; the upload itself is
  # continue-on-error) so a flaky code-scanning upload never blocks a release. Still verifies the
  # SARIF against binskim-release's out-of-band digest, so we never publish a corrupted report.
  upload-sarif-release:
    needs: [binskim-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # the ONLY code-scanning write in the repo; release-scoped, isolated here
    steps:
      - name: Checkout (source root for alert attribution)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false
      - name: Download release SARIF
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          name: binskim-release-sarif
          path: sarif
      - name: Custody hop — SARIF matches binskim-release's out-of-band digest (fail-closed)
        shell: bash
        env:
          EXPECTED: ${{ needs.binskim-release.outputs.sarif_sha256 }}
        run: |
          set -euo pipefail
          got=$(sha256sum sarif/binskim-release.sarif | cut -d' ' -f1)
          echo "expected=$EXPECTED got=$got"
          [ -n "$EXPECTED" ] || { echo "::error::no SARIF digest from binskim-release"; exit 1; }
          [ "$got" = "$EXPECTED" ] || { echo "::error::release SARIF digest mismatch — not uploading a corrupted report"; exit 1; }
      - name: Upload release SARIF to code-scanning (informational, non-blocking)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # github/codeql-action v4.37.7
        with:
          sarif_file: sarif/binskim-release.sarif
          category: binskim-release
          # A canonical (non-prerelease) tag ships main's authoritative SIGNED posture (incl. BA2022
          # SignSecurely, which only passes on signed bytes), so attribute it to refs/heads/main and
          # refresh the Code-scanning tab. Prereleases (v*-rc.*) and dispatch keep their own ref, so
          # the tab reflects the last SHIPPED release, never a candidate. Semver: a '-' == prerelease.
          ref: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) && 'refs/heads/main' || github.ref }}
          sha: ${{ github.sha }}

  publish:
    needs: [verify, binskim-release, attest-sarif]
    runs-on: windows-2025
    permissions:
      contents: write        # create the Release + upload assets
      id-token: write        # OIDC -> Sigstore (keyless attestation)
      attestations: write    # record provenance + SBOM attestations
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist

      # SLSA build provenance: signs "this exact digest was built by THIS workflow at
      # THIS commit". Anyone verifies with:
      #   gh attestation verify hp-thermal.exe --repo <owner>/<repo>
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # actions/attest-build-provenance v4.2.2
        with:
          # Both shipped binaries are provenance subjects (one attestation, two digests).
          subject-path: |
            dist/hp-thermal.exe
            dist/hp-thermal.pdb

      # attest-sbom was folded into the general-purpose actions/attest (attest-sbom is
      # deprecated). `sbom-path` still auto-detects CycloneDX/SPDX and emits the same
      # https://cyclonedx.org/bom predicate — verified identical to the prior output.
      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # actions/attest v4.2.2
        with:
          subject-path: dist/hp-thermal.exe
          sbom-path: dist/hp-thermal.cdx.json

      # FAIL-CLOSED self-verification BEFORE publish (closes the "attest but never verify"
      # seam). Verify each just-created bundle OFFLINE (--bundle = the step's own output,
      # so no attestation-API propagation race) AND pin the signer to THIS repo's release
      # workflow (--signer-workflow). A forged/mis-scoped attestation fails here and we
      # never reach `gh release create`. Runs on dispatch too, so every dry-run exercises
      # it. Negative-tested locally: a wrong --signer-workflow exits 1.
      # Bundle paths are bound via env (NOT inlined as ${{ }} in the script) so zizmor's
      # template-injection audit stays clean: env values are passed to the shell, never
      # expanded into the script source, so there is no command-injection surface.
      - name: Verify attestations before publish (offline, identity-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::provenance"
          for art in dist/hp-thermal.exe dist/hp-thermal.pdb; do
            gh attestation verify "$art" \
              --bundle "$PROVENANCE_BUNDLE" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done
          echo "::endgroup::"
          echo "::group::sbom (cyclonedx)"
          gh attestation verify dist/hp-thermal.exe \
            --bundle "$SBOM_BUNDLE" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          echo "::endgroup::"
          # #202: stage the just-verified bundles under stable names for release attachment.
          cp "$PROVENANCE_BUNDLE" dist/hp-thermal.provenance.sigstore.jsonl
          cp "$SBOM_BUNDLE"       dist/hp-thermal.sbom.sigstore.jsonl

      # #202 (reverses the earlier ship-nothing decision, per the 2026-08 audit): the
      # *.sigstore.jsonl bundles ARE attached, so verification does not depend on GitHub's
      # attestation API existing in its current form — `gh attestation verify --bundle`
      # works fully offline against the release assets. "Ugly artifact" matters less than
      # durable trust evidence. The attached bundles are the exact files self-verified
      # above. (Not listed in SHA256SUMS: it is written at sign time, before these exist;
      # the bundles are Sigstore-signed objects and carry their own integrity.)

      # First-party gh CLI (no third-party release action). Token is the job-scoped
      # GITHUB_TOKEN with contents: write only.
      # TWO independent conditions must BOTH hold to publish (defense in depth):
      #   1. ref is a v* tag        -> a bare dispatch on main can never publish
      #   2. dry_run is not true    -> closes the dispatch-on-a-TAG hole: even selecting a
      #      tag ref in the dispatch UI stays inert unless dry_run is explicitly unset.
      # A real `push: tags` has no inputs context (inputs.dry_run == null != true) -> publishes.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          # SemVer pre-release tags carry a hyphen (v0.3.0-rc.1). They must NOT become the "Latest"
          # release pointer and must show the pre-release badge; final tags (v0.3.0) are latest.
          # `--latest=false` is explicit rather than relying on gh's implicit semver comparison.
          case "${GITHUB_REF_NAME}" in
            *-*) RELEASE_FLAGS=(--prerelease --latest=false) ;;
            *)   RELEASE_FLAGS=(--latest) ;;
          esac
          # Notes built with echo lines (GITHUB_* are shell env vars, not GitHub-expression
          # interpolation), so this is zizmor/actionlint clean. 4-space indent = code block.
          # The signing line is derived from SIGNING_ENABLED so the notes never claim more than the
          # artifact actually is: the sign job fails closed unless the binary is validly signed, so
          # SIGNING_ENABLED == true here means the exe carries a verified Authenticode signature.
          {
            echo "## hp-thermal ${GITHUB_REF_NAME}"
            echo
            echo "HP laptop thermal and performance control. A ~300 KB tray app plus Windows service."
            echo
            echo "Verify this download (SLSA provenance + SBOM):"
            echo
            echo "    gh attestation verify hp-thermal.exe --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo
            echo "Offline (no GitHub API): the attached *.sigstore.jsonl bundles carry the same attestations —"
            echo
            echo "    gh attestation verify hp-thermal.exe --bundle hp-thermal.provenance.sigstore.jsonl --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo
            if [ "${SIGNING_ENABLED:-}" = "true" ]; then
              echo "Authenticode-signed: Windows shows the verified publisher on the UAC prompt. Inspect the signature with:"
              echo
              echo "    powershell -c \"Get-AuthenticodeSignature hp-thermal.exe | Format-List Status, SignerCertificate, TimeStamperCertificate\""
            else
              echo "Not yet Authenticode-signed."
            fi
            echo
            echo "hp-thermal.pdb is optional debug symbols (to symbolicate a crash report); not needed to run. It is hashed in SHA256SUMS and carries the same provenance attestation as the exe."
            echo
            echo "Details in the README and SECURITY.md."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            dist/hp-thermal.exe dist/hp-thermal.pdb dist/hp-thermal.cdx.json dist/SHA256SUMS \
            dist/hp-thermal.provenance.sigstore.jsonl dist/hp-thermal.sbom.sigstore.jsonl \
            --repo "${GITHUB_REPOSITORY}" \
            --title "hp-thermal ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            "${RELEASE_FLAGS[@]}"
