name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build + attest, but publish NOTHING. Default true — must be
          explicitly unset to publish via dispatch. A tag push ignores this and publishes."
        type: boolean
        default: true

# Default to read-only, no secrets. Only the publish job opts into the minimum extra
# scopes it needs, and only on a real tag. All actions are pinned to a full 40-char
# commit SHA (resolved 2026-07-24 via `gh api repos/<r>/commits/<tag> --jq .sha`).
# Dependabot proposes reviewed action bumps; git-rev tool pins are bumped by hand.
permissions:
  contents: read

jobs:
  # --- S2 source-integrity gate: a release may fire ONLY from a commit whose required
  #     checks (ci, scan, CodeQL) concluded success. Closes the seam where a tag push
  #     triggered a release regardless of whether the commit ever passed CI/scan. On a
  #     real tag it is enforced fail-closed; on workflow_dispatch (dry-run) it is skipped
  #     so dry-runs still exercise the pipeline. This complements branch protection +
  #     tag rulesets: even if a tag is somehow placed on a non-green commit, no build runs.
  source-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require the tagged commit to be CI-green
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" > checks.json
          fail=0
          for name in "ci" "scan" "Analyze (rust)"; do
            concl=$(jq -r --arg n "$name" \
              '[.check_runs[] | select(.name==$n)] | (sort_by(.started_at) | last | .conclusion) // "missing"' \
              checks.json)
            echo "required check '$name' => $concl"
            [ "$concl" = "success" ] || { echo "::error::required check '$name' is '$concl' (need success)"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "Source-integrity gate FAILED: tag is not on a CI-green commit."; exit 1; }
          echo "Source-integrity gate PASSED."

  # --- Build on a READ-ONLY, secret-less runner. Tool installs execute code, so this
  #     job is bounded to reading public source: it cannot push, publish, or exfiltrate.
  build:
    needs: source-gate
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain + components
        run: rustup toolchain install nightly-2026-07-23 -c rust-src -c clippy -c rustfmt

      # Enforce dependency locking: fails if Cargo.lock is stale / would change. Nothing
      # gets built or published against an unpinned dependency graph.
      - name: Verify dependency lock (no drift)
        working-directory: app
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Windows MAX_PATH (260) blocks the deep test-snapshot paths inside some tool repos
      # (cyclonedx-rust-cargo) during `cargo install --git`'s checkout. Enable long paths.
      # SAFE here: the runner is EPHEMERAL (fresh VM, destroyed after the job), so this
      # has no lasting/persistent attack surface -- long-path evasion needs a durable
      # attacker-influenced system, which a throwaway build VM building our pinned source
      # is not. (Would NOT do this on a workstation/server.)
      - name: Enable long paths (ephemeral runner)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null

      # Immutable git-rev pins: a maintainer-account compromise can publish a new
      # crates.io version but cannot rewrite a pinned commit. These BUILD code, which is
      # why they stay on the read-only, secret-less runner.
      - name: Install release tools (git-rev pinned)
        shell: bash
        run: |
          cargo install cargo-deny      --locked --git https://github.com/EmbarkStudios/cargo-deny          --rev 09faadcea2d0d1742492e6872b743d1e4d151a27
          cargo install cargo-auditable --locked --git https://github.com/rust-secure-code/cargo-auditable  --rev 9dc5ff28ff204b73eae91bd96cde4413fdcb70e0
          cargo install cargo-audit     --locked --git https://github.com/rustsec/rustsec                   --rev efcde93a237dc51f8c32d84d880bf97b442835c8
          cargo install cargo-cyclonedx --locked --git https://github.com/CycloneDX/cyclonedx-rust-cargo    --rev e58bd5590212f82c5b7e16dd3e2e819b0dbea5b1  # cargo-cyclonedx-0.5.9

      # Full tier: fmt/clippy/test + cargo-deny policy + cargo-auditable release build
      # (embeds the dep tree in the binary) + `cargo audit bin` on the artifact + PE
      # exploit-mitigation verification.
      - name: Attest build (deny / auditable / audit-bin / verify-hardening)
        run: cargo run --manifest-path xtask/Cargo.toml -- ci

      - name: Generate SBOM (CycloneDX)
        working-directory: app
        run: cargo cyclonedx --format json

      - name: Stage artifacts + SHA-256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe dist/hp-thermal.exe
          Copy-Item app/*.cdx.json dist/hp-thermal.cdx.json
          $sums = @(
            ((Get-FileHash dist/hp-thermal.exe        -Algorithm SHA256).Hash.ToLower() + "  hp-thermal.exe"),
            ((Get-FileHash dist/hp-thermal.cdx.json   -Algorithm SHA256).Hash.ToLower() + "  hp-thermal.cdx.json")
          )
          $sums | Out-File dist/SHA256SUMS -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # actions/upload-artifact v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # --- Attest + publish. Minimal elevation, no third-party actions / tool builds here.
  #     Attestations run on BOTH a real tag AND a manual workflow_dispatch, so the whole
  #     pipeline is dry-runnable. Only the GitHub Release *publish* step is gated, behind
  #     TWO conditions (v* tag AND dry_run != true) -- see that step's comment.
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write        # create the Release + upload assets
      id-token: write        # OIDC -> Sigstore (keyless attestation)
      attestations: write    # record provenance + SBOM attestations
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # actions/download-artifact v8.0.1
        with:
          name: dist
          path: dist

      # SLSA build provenance: signs "this exact digest was built by THIS workflow at
      # THIS commit". Anyone verifies with:
      #   gh attestation verify hp-thermal.exe --repo <owner>/<repo>
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # actions/attest-build-provenance v4.1.1
        with:
          subject-path: dist/hp-thermal.exe

      # attest-sbom was folded into the general-purpose actions/attest (attest-sbom is
      # deprecated). `sbom-path` still auto-detects CycloneDX/SPDX and emits the same
      # https://cyclonedx.org/bom predicate — verified identical to the prior output.
      - name: Attest SBOM
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # actions/attest v4.2.0
        with:
          subject-path: dist/hp-thermal.exe
          sbom-path: dist/hp-thermal.cdx.json

      # FAIL-CLOSED self-verification BEFORE publish (closes the "attest but never verify"
      # seam). Verify each just-created bundle OFFLINE (--bundle = the step's own output,
      # so no attestation-API propagation race) AND pin the signer to THIS repo's release
      # workflow (--signer-workflow). A forged/mis-scoped attestation fails here and we
      # never reach `gh release create`. Runs on dispatch too, so every dry-run exercises
      # it. Negative-tested locally: a wrong --signer-workflow exits 1.
      # Bundle paths are bound via env (NOT inlined as ${{ }} in the script) so zizmor's
      # template-injection audit stays clean: env values are passed to the shell, never
      # expanded into the script source, so there is no command-injection surface.
      - name: Verify attestations before publish (offline, identity-pinned)
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::provenance"
          gh attestation verify dist/hp-thermal.exe \
            --bundle "$PROVENANCE_BUNDLE" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          echo "::endgroup::"
          echo "::group::sbom (cyclonedx)"
          gh attestation verify dist/hp-thermal.exe \
            --bundle "$SBOM_BUNDLE" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type https://cyclonedx.org/bom \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          echo "::endgroup::"

      # Export the signed Sigstore bundles as release ASSETS so verification works
      # OFFLINE: the bundle carries the DSSE-signed attestation + Fulcio cert + Rekor
      # inclusion proof, so a consumer verifies with `gh attestation verify --bundle
      # <file>` WITHOUT a live call to GitHub's attestation API / Rekor. This is the
      # enabler for the offline verify-before-promote path (updater has no network).
      - name: Stage attestation bundles as release assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" dist/hp-thermal.exe.provenance.sigstore.jsonl
          cp "$SBOM_BUNDLE"       dist/hp-thermal.exe.sbom.sigstore.jsonl
          ls -l dist/*.sigstore.jsonl

      # First-party gh CLI (no third-party release action). Token is the job-scoped
      # GITHUB_TOKEN with contents: write only.
      # TWO independent conditions must BOTH hold to publish (defense in depth):
      #   1. ref is a v* tag        -> a bare dispatch on main can never publish
      #   2. dry_run is not true    -> closes the dispatch-on-a-TAG hole: even selecting a
      #      tag ref in the dispatch UI stays inert unless dry_run is explicitly unset.
      # A real `push: tags` has no inputs context (inputs.dry_run == null != true) -> publishes.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/hp-thermal.exe dist/hp-thermal.cdx.json dist/SHA256SUMS \
            dist/hp-thermal.exe.provenance.sigstore.jsonl \
            dist/hp-thermal.exe.sbom.sigstore.jsonl \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Verify online:  gh attestation verify hp-thermal.exe --repo ${GITHUB_REPOSITORY}
          Verify offline: gh attestation verify hp-thermal.exe --bundle hp-thermal.exe.provenance.sigstore.jsonl --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
