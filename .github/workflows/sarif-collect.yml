name: SARIF collect

# Approach B (#161): the SINGLE `security-events: write` job in the whole repo.
#
# Every scanner stays least-privilege (`contents: read`) and emits an INERT SARIF *artifact* —
# ci.yml's `scan` job keeps `advanced-security: false` (no self-upload), binskim.yml + the binskim
# composite action upload `*-sarif` artifacts. This collector is triggered AFTER those workflows
# finish (`workflow_run`), downloads their SARIF artifacts from the triggering run, and uploads them
# to code-scanning. Isolating the one privileged write here means NO scanning job can write
# code-scanning alerts — only this collector can. (CodeQL self-uploads via its own maintained
# action and is intentionally NOT routed through here.)
#
# NOTE: workflow_run workflows only fire from the DEFAULT branch, so this cannot be exercised from a
# PR — it validates once merged to main (documented, not a gap).

on:
  workflow_run:
    workflows: ["BinSkim"]   # CI joins once scan tools emit SARIF artifacts (follow-up)
    types: [completed]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download artifacts from the triggering run
      security-events: write # THE one privileged scope in the repo — isolated to this job
    steps:
      - name: Download SARIF artifacts from the triggering run
        id: dl
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact v8.0.1
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: "*sarif*"
          path: sarifs
          # NO merge-multiple: keep each artifact in its own sarifs/<artifact-name>/ subdir so two
          # tools emitting a same-named file (e.g. results.sarif) can't clobber each other on disk.
          # upload-sarif recurses the parent dir and tracks each result set by its own tool name.
        continue-on-error: true # a triggering run with no SARIF (e.g. binskim path-filter didn't fire) is fine

      - name: Any SARIF to upload?
        id: check
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(sarifs/**/*.sarif sarifs/*.sarif)
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          echo "found ${#files[@]} SARIF file(s)"; printf '  %s\n' "${files[@]}"

      # upload-sarif ingests a directory and tracks each result set by its own tool name, so one
      # call lands every tool's findings in the Security tab. It dedupes by (tool, commit).
      - name: Upload SARIFs to code-scanning
        if: steps.check.outputs.count != '0'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # github/codeql-action v4.37.6
        with:
          sarif_file: sarifs
          # Attribute the alerts to the ORIGINAL commit/ref that was scanned, not this collector run.
          checkout_path: ${{ github.workspace }}
          ref: ${{ github.event.workflow_run.head_branch }}
          sha: ${{ github.event.workflow_run.head_sha }}
