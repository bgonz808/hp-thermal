name: DLL-plant audit

# #106: static + dynamic audit of the DLL search-order hijack surface (MITRE T1574.001/.002).
# Runs on demand and when the import surface / mitigations change. Pure user-mode — no admin
# kernel driver (unlike ProcMon): the dynamic tier plants a FORWARDING proxy next to a throwaway
# copy of the exe and checks whether the run-dir copy wins the loader search order — the exact
# DLL-planting EoP the static closure gate flags. See tools/dll-plant-probe/probe.rs.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'xtask/**'
      - 'tools/dll-plant-probe/**'
      - 'app/.cargo/config.toml'
      - 'app/Cargo.toml'
      - '.github/workflows/dll-plant-audit.yml'

permissions:
  contents: read

jobs:
  dll-plant-audit:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain (+ rust-src for build-std)
        run: rustup toolchain install nightly-2026-07-23 -c rust-src

      # A plain build is representative for this audit: same static imports (powrprof / rstrtmgr)
      # and the same /DEPENDENTLOADFLAG load-config as a release artifact. No cargo-auditable / SBOM
      # needed here.
      - name: Build a representative release binary
        working-directory: app
        run: cargo +nightly-2026-07-23 build --release --target x86_64-pc-windows-msvc

      # EPHEMERAL RUNNER ONLY: exclude the harness's temp workspace from Defender so real-time
      # protection can't quarantine the throwaway exe copy or the forwarding proxy mid-test. This
      # is a disposable build VM, NOT a workstation — same ephemeral-runner license as the
      # long-paths registry tweak in release.yml. Scoped to TEMP, never a machine-wide disable.
      - name: Exclude harness temp from Defender (ephemeral runner)
        shell: pwsh
        run: |
          try { Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction Stop } catch {}
          try { Add-MpPreference -ExclusionPath $env:TEMP        -ErrorAction Stop } catch {}

      # STATIC tier (blocking): fail on any NEW pre-main transitive dep (new DLL-plant surface).
      - name: Static gate — transitive DLL-plant surface
        run: cargo run --manifest-path xtask/Cargo.toml -- audit-dll-closure app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe

      # DYNAMIC tier (BLOCKING): plant a forwarding proxy for the former pre-main candidate
      # (ncrypt) and fail if it loads from the run dir. #106 deferred rstrtmgr to a lazy System32
      # load, so ncrypt is no longer resolved pre-main — the expected result is "not plantable".
      # Regression guard: if rstrtmgr is ever re-added as a static import, ncrypt loads pre-main
      # again and this fails. (An `inconclusive` result — e.g. Defender on the runner — also
      # fails, deliberately: a plant test that couldn't run is not a pass.)
      - name: Dynamic tier — plant test (ncrypt, blocking)
        shell: pwsh
        run: |
          cargo run --manifest-path xtask/Cargo.toml -- audit-dll-planting app/target/x86_64-pc-windows-msvc/release/hp-thermal.exe ncrypt.dll
          $code = $LASTEXITCODE
          $msg = switch ($code) {
            1 { "**PLANTABLE** — ncrypt.dll loaded from the run dir. Regression: rstrtmgr is back as a static import (pre-main DLL-hijack gap)." }
            0 { "**not plantable** — System32 won the search; rstrtmgr deferral holds." }
            default { "**inconclusive** (exit $code) — likely Defender or a build/runtime issue on the runner." }
          }
          "## Dynamic plant test: ncrypt.dll`n$msg" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Write-Host $msg
          exit $code   # blocking
