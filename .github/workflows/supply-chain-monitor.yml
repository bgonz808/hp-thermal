name: supply-chain monitor (static-pin posture)

# #226: the ALWAYS layer of the admission+monitoring doctrine (#227). Change-triggered gates
# (candidate-eval, #241) catch what we ADMIT; this scheduled workflow catches what the world
# LEARNS about what we already admitted — advisories and AV engines move while our digests sit
# still. It re-checks the posture of the pinned supply chain recorded in supply-chain/evidence,
# on the LIVE FRONTIER only (current TOOLS.lock pins + latest release), never the historical
# store: no gate consumes a finding about a binary nobody runs. O(pinned), flat.
#
# AXIS COVERAGE (honest, #241): this is the MAL axis today, plus environment staleness.
#   * mal   — COVERED by vt-monitor below.
#   * vuln  — COVERED by vuln-monitor below: re-audits every pinned tool's lockfile against a
#             FRESH advisory DB and diffs the instance set against the recorded baseline (whose
#             header names the DB commit it was blessed at). New instance + no ack => fail.
#             Writes nothing: an observation is recomputable (baseline DB commit + RustSec's own
#             dated history), while the human DECISION is already recorded in acks.jsonl — so
#             this workflow never needs contents:write.
#   * caps  — N/A as knowledge-delta (same bytes + same instrument = same surface). Its
#             monitoring value is INTEGRITY, not knowledge: re-measure a pinned binary and
#             assert it still matches its committed manifest + stored evidence (catches store
#             tamper or policy drift). Also a #226 follow-up.
#
# Jobs (all read-only, least-privilege, notice-by-failure):
#   vt-monitor      — VirusTotal hash LOOKUPS (never uploads; upload+gate flow is a #205
#                     design with its own least-privilege stage) for every blessed TOOLS.lock
#                     digest + the latest release exe. New detections on old bytes fail the
#                     job -> scheduled-failure notification.
#   vuln-monitor    — same bytes, newer advisory DB: has anything appeared since bless?
#   pin-staleness   — rust-toolchain nightly age; newer runner families (windows-2026 etc.).
#
# Name: "monitor", not the former "surveillance" — the object watched is our own pinned
# artifacts and their posture, never people; the loaded term misrepresented a benign
# artifact-monitoring job (maintainer, 2026-08-22).
#
# Secret: VT_API_KEY as a GitHub Actions secret (Settings -> Secrets and variables -> Actions).
# Best practices held: schedule/dispatch-only triggers (secrets never exposed to PR-triggered
# contexts), a job with contents: read only, the key used solely as a curl header, never echoed.

on:
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vt-monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: VT lookups for blessed tool digests + latest release exe
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::error::VT_API_KEY secret is not configured (Settings -> Secrets -> Actions). The supply-chain monitor cannot run."
            exit 1
          fi
          declare -A HASHES
          # Blessed tool digests (strip inline comments; fields: name repo rev target sha256).
          while read -r name _repo _rev _target sha; do
            [ -n "${name:-}" ] || continue
            HASHES["tool:$name"]="$sha"
          done < <(grep -vE '^\s*#|^\s*$' tools/TOOLS.lock | sed 's/[[:space:]]*#.*$//')
          # Latest release exe digest, from its SHA256SUMS (the signed-bytes manifest).
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS -O sums.txt --clobber 2>/dev/null; then
            exe_sha=$(awk '$2=="hp-thermal.exe"{print $1}' sums.txt | head -1)
            [ -n "$exe_sha" ] && HASHES["release:hp-thermal.exe"]="$exe_sha"
          fi
          fail=0
          for key in "${!HASHES[@]}"; do
            sleep 16   # free-tier pacing
            h="${HASHES[$key]}"
            code=$(curl -sS -o resp.json -w "%{http_code}" -H "x-apikey: $VT_API_KEY" \
              "https://www.virustotal.com/api/v3/files/$h")
            if [ "$code" = "404" ]; then
              # Not in the corpus: uploads are deliberately NOT automated (see #205 upload+gate
              # design). Known-in-corpus: the six 2026-08-21 blessed tools + v0.3.1 exe.
              echo "::warning::$key ($h): not in VT corpus - no monitoring possible until uploaded"
              continue
            fi
            [ "$code" = "200" ] || { echo "::warning::$key: VT lookup HTTP $code"; continue; }
            # Engines flagging this hash (category malicious|suspicious), one per line. jq, not a
            # python interpreter: minimal parser surface for semi-trusted input (maintainer review
            # 2026-08-21 — a full interpreter+stdlib for two JSON fields was disproportionate, and
            # python3's image presence proved fragile twice: local python3-vs-python, and the
            # 26.04-preview toolcache gap). jq is already this repo's JSON precedent (#191 gate).
            # The parse must FAIL CLOSED: a broken parse must never read as "0 detections".
            if ! jq -r '.data.attributes.last_analysis_results
                        | to_entries[]
                        | select(.value.category == "malicious" or .value.category == "suspicious")
                        | .key' resp.json > engines.txt 2> parse.err; then
              echo "::error::$key: VT response parse FAILED (fail-closed, not all-clear): $(head -c 300 parse.err)"
              fail=1
              continue
            fi
            mapfile -t engines < <(tr -d '\r' < engines.txt)   # CRLF scrub: comparisons stay byte-exact
            echo "$key: ${#engines[@]} detection(s)  https://www.virustotal.com/gui/file/$h"
            for eng in "${engines[@]}"; do
              # Acked (hash, engine) pairs (.github/supply-chain-monitor-acks) downgrade to warnings:
              # visible every run, no re-paging. New engines/hashes still fail the job.
              if grep -qE "^${h}[[:space:]]+${eng}([[:space:]]|$)" .github/supply-chain-monitor-acks 2>/dev/null; then
                echo "::warning::$key: $eng detection is ACKNOWLEDGED (see .github/supply-chain-monitor-acks) - monitored, not paging"
              else
                echo "::error::$key: NEW detection by $eng - review before further use/bless"
                fail=1
              fi
            done
          done
          exit "$fail"

  pin-staleness:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain age + newer runner families
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Pinned nightly age (staleness notice only; std/rustc advisory DIFFING is a #226
          # follow-up — cargo-audit structurally cannot see std, so age is the v1 proxy).
          chan=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' app/rust-toolchain.toml | head -1)
          d=${chan#nightly-}
          age_days=$(( ( $(date +%s) - $(date -d "$d" +%s) ) / 86400 ))
          echo "pinned toolchain: $chan (age ${age_days}d)"
          if [ "$age_days" -gt 75 ]; then
            echo "::warning::pinned nightly is ${age_days} days old - consider a reviewed toolchain bump (std fixes ride toolchain updates)"
          fi
          # Newer runner families (runs-on labels are invisible to Dependabot): probe the
          # runner-images README for families beyond our pins. Preview-aware: a family whose
          # README table row still carries the preview badge is NOT migration-ready (previews
          # lack completeness/stability commitments — ubuntu-26.04 only gained the Python
          # toolcache 2026-08-19), so it logs as info, warning only at GA. Avoids weekly
          # warning fatigue for months of preview.
          readme=$(curl -sS https://raw.githubusercontent.com/actions/runner-images/main/README.md)
          for fam in windows-2026 windows-2028 ubuntu-26.04 ubuntu-28.04; do
            row=$(grep -m1 -E "\`$fam\`" <<<"$readme" || true)
            [ -n "$row" ] || continue
            if grep -qi "preview" <<<"$row"; then
              echo "runner family '$fam' exists upstream in PREVIEW - not migration-ready, watching for GA"
            else
              echo "::warning::runner family '$fam' is GA upstream - evaluate migrating pinned families (#226)"
            fi
          done

  vuln-monitor:
    # #226/#241 §5 — the knowledge-delta loop for the vuln axis. Separate job from vt-monitor
    # so the VT secret is never in scope here (secrets reach only steps that reference them),
    # and contents:read only: this job cannot mutate the repo. windows-2025 because the blessed
    # cargo-audit is a Windows PE.
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Fetch prior-blessed auditor (digest + attestation verified)
        id: auditor
        uses: ./.github/actions/fetch-tools
        with:
          token: ${{ github.token }}
          target: windows-x86_64
          only: cargo-audit
          verify-attestations: "true"

      - name: Advisory knowledge delta vs recorded baselines
        shell: bash
        env:
          PINNED_TOOLS_DIR: ${{ steps.auditor.outputs.tools-dir }}
        run: cargo run --manifest-path xtask/Cargo.toml -- monitor-vuln
