name: Release VDR attestation

# Post-release stage (#396). A shipped exe's Vulnerability Disclosure Report can exist only after
# `release-advance vuln` recorded the exe's evidence and `vdr emit` committed the report beside it
# (supply-chain/evidence/hp-thermal/<digest>/vdr.cdx.json, regenerated and compared by CI). This
# dispatch-only stage attests that committed report to the released exe.
#
# DELIVERY: the attestation (GitHub's attestation store and the public Rekor log) and the committed
# report. Nothing is attached to the release: a published release is immutable and accepts no
# asset afterwards. `cargo xtask release-advance anchor --tag <tag>` then records the attestation's
# bundle beside the report as vdr.v<version>.sigstore.jsonl.
#
# CARRIER: a VDR is a CycloneDX BOM whose payload is `vulnerabilities[]`; CycloneDX defines no
# VDR-specific in-toto predicate type, so the attestation uses https://cyclonedx.org/bom, the same
# type as the SBOM. Consumers tell them apart by content (`vulnerabilities`, `metadata.lifecycles`)
# and by signer: this workflow's identity at refs/heads/main, never the release workflows'.
#
# CUSTODY: the exe and SBOM are downloaded from the release and admitted only after their
# provenance verifies against a release workflow at the release's tag; the exe digest is
# re-checked against SHA256SUMS; the committed VDR is regenerated from the evidence before it is
# signed. Revisions are append-only: each keeps the release's one serial and takes a version
# above every revision this workflow already attested to the exe, read back from the attestation
# store and counted only if it verifies against this workflow at main.
#
# JUDGMENT GATE: the `release-attest` environment (maintainer approval, no admin bypass, deployable
# from `main` only). Deliberately not `release-publish`: that environment admits only `v*` tag refs,
# which is what makes "publish" mean "a tagged release", and this stage runs from `main` because
# the evidence it attests lives there, after the release. A distinct environment keeps the two
# approvals independently recorded. Nothing here commits to git or writes to the release; the
# only write is the attestation.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose exe the committed VDR describes (e.g. v0.3.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest-vdr:
    # Two independent gates: the environment's own rules (required reviewer, no admin bypass,
    # deployable from main only) AND this ref check. If the environment were ever missing, GitHub
    # would auto-create it WITHOUT protection on first use; the ref check keeps a dispatch from any
    # other ref out regardless, and the environment's existence with its rules is verified before
    # this workflow is merged (gh api repos/{owner}/{repo}/environments/release-attest).
    if: github.ref == 'refs/heads/main'
    environment: release-attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read         # read the release; nothing is written to it
      id-token: write        # Sigstore keyless signing
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VDR_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release-vdr.yml@refs/heads/main
    steps:
      - name: Checkout (evidence + policy at main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: ./.github/actions/install-toolchain

      - name: Build xtask (the emitter that regenerates the report)
        run: cargo build --release --locked --quiet --manifest-path xtask/Cargo.toml

      - name: Download the release's exe, SBOM and manifest; verify custody
        id: rel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$TAG" in v[0-9]*) : ;; *) echo "::error::tag '$TAG' is not a v* release tag"; exit 1 ;; esac
          mkdir -p rel
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir rel \
            --pattern hp-thermal.exe --pattern hp-thermal.cdx.json --pattern SHA256SUMS
          digest=$(awk '$2=="hp-thermal.exe"{print $1}' rel/SHA256SUMS)
          [ "${#digest}" = 64 ] || { echo "::error::SHA256SUMS has no hp-thermal.exe line"; exit 1; }
          got=$(sha256sum rel/hp-thermal.exe | cut -d' ' -f1)
          [ "$got" = "$digest" ] || { echo "::error::downloaded exe $got != SHA256SUMS $digest"; exit 1; }
          for f in hp-thermal.exe hp-thermal.cdx.json; do
            ok=0
            for w in release-pipeline.yml release.yml; do
              if gh attestation verify "rel/$f" --repo "$GITHUB_REPOSITORY" \
                   --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/$w@refs/tags/$TAG" \
                   --source-ref "refs/tags/$TAG" --deny-self-hosted-runners > /dev/null 2>&1; then
                ok=1; echo "$f: provenance verified ($w at refs/tags/$TAG)"; break
              fi
            done
            [ "$ok" = 1 ] || { echo "::error::$f: provenance did not verify against a release workflow at refs/tags/$TAG; not admitted"; exit 1; }
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Read the published revisions back from the attestation store
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.rel.outputs.digest }}
        run: |
          set -euo pipefail
          # Every attestation for the exe; only those that verify against this workflow at main
          # are VDR revisions. An unreadable store fails the run: the next version must never be
          # guessed.
          mkdir -p published
          gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$DIGEST?per_page=100" > published/list.json
          n=$(jq '.attestations | length' published/list.json)
          [ "$n" -lt 100 ] || { echo "::error::100 or more attestations for one digest: the list may be truncated"; exit 1; }
          for i in $(seq 0 $((n - 1))); do
            [ "$(jq -r ".attestations[$i].bundle | type" published/list.json)" = object ] \
              || { echo "::error::attestation $i has no inline bundle; refusing to skip it unseen"; exit 1; }
            jq -c ".attestations[$i].bundle" published/list.json > "published/b$i.jsonl"
            if gh attestation verify rel/hp-thermal.exe --bundle "published/b$i.jsonl" --repo "$GITHUB_REPOSITORY" \
                 --predicate-type https://cyclonedx.org/bom --cert-identity "$VDR_IDENTITY" \
                 --source-ref refs/heads/main --deny-self-hosted-runners --format json > "published/v$i.json" 2> /dev/null; then
              jq '.[0].verificationResult.statement.predicate' "published/v$i.json" > "published/vdr-$i.cdx.json"
            fi
          done
          echo "$n attestation(s) for the exe; $(find published -name 'vdr-*.cdx.json' | wc -l) published VDR revision(s)"

      - name: Regenerate the committed VDR from the evidence (must match byte for byte)
        id: vdr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.rel.outputs.digest }}
        run: |
          set -euo pipefail
          vdr="supply-chain/evidence/hp-thermal/$DIGEST/vdr.cdx.json"
          [ -f "$vdr" ] || { echo "::error::$vdr is not committed: run release-advance vuln, then vdr emit, and merge first"; exit 1; }
          xtask/target/release/xtask vdr check --product hp-thermal --digest "$DIGEST" --sbom rel/hp-thermal.cdx.json
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and has("vulnerabilities") and (.metadata.component.name == "hp-thermal")' "$vdr" > /dev/null \
            || { echo "::error::$vdr: not a CycloneDX 1.6 VDR for hp-thermal"; exit 1; }
          # CycloneDX revision rule: one serialNumber per subject, `version` names the revision. A
          # revision is accepted only under the serial already published and only above every
          # published version, so a published version never changes meaning.
          serial=$(jq -r '.serialNumber' "$vdr"); version=$(jq -r '.version' "$vdr")
          case "$version" in ''|*[!0-9]*|0) echo "::error::$vdr: version '$version' is not a positive integer"; exit 1 ;; esac
          max=0
          for f in published/vdr-*.cdx.json; do
            [ -f "$f" ] || continue
            [ "$(jq -r '.serialNumber' "$f")" = "$serial" ] \
              || { echo "::error::a published revision has serial $(jq -r '.serialNumber' "$f"), not $serial; refusing a second document for one subject"; exit 1; }
            v=$(jq -r '.version' "$f"); [ "$v" -gt "$max" ] && max=$v
          done
          [ "$version" -gt "$max" ] \
            || { echo "::error::VDR version $max is already attested to $TAG's exe; the committed report is version $version, nothing newer to attest"; exit 1; }
          mkdir -p out && cp "$vdr" "out/vdr.v$version.cdx.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VDR version $version (published max $max): $(jq '.components | length' "$vdr") component(s), $(jq '.vulnerabilities | length' "$vdr") vulnerabilit(ies)"

      - name: Attest the VDR to the released exe
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # actions/attest v4.2.2
        with:
          subject-path: rel/hp-thermal.exe
          predicate-type: https://cyclonedx.org/bom
          predicate-path: out/vdr.v${{ steps.vdr.outputs.version }}.cdx.json

      - name: Verify the VDR attestation (identity-pinned to this workflow at main)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ steps.vdr.outputs.version }}
        run: |
          set -euo pipefail
          gh attestation verify rel/hp-thermal.exe --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://cyclonedx.org/bom --cert-identity "$VDR_IDENTITY" \
            --source-ref refs/heads/main --deny-self-hosted-runners --format json > verified.json
          jq -e --argjson v "$VERSION" '.[0].verificationResult.statement.predicate | has("vulnerabilities") and (.metadata.component.name == "hp-thermal") and (.version == $v)' verified.json > /dev/null \
            || { echo "::error::verified statement is not VDR version $VERSION for hp-thermal"; exit 1; }
          {
            echo "VDR version $VERSION attested to the $TAG exe (not attached to the release)."
            echo
            echo "Record its bundle: \`cargo xtask release-advance anchor --tag $TAG\` on an \`evidence/*\` branch."
          } >> "$GITHUB_STEP_SUMMARY"
