name: Install the pinned Rust toolchain (digest-verified)
description: >
  Reads tools/TOOLCHAIN.lock, verifies the channel manifest against the committed sha256,
  then installs. Fails closed on any mismatch.

inputs:
  components:
    description: Extra rustup components, space-separated (e.g. "rust-src clippy rustfmt").
    required: false
    default: ""

outputs:
  channel:
    description: The channel that was installed, read from the lock.
    value: ${{ steps.pin.outputs.channel }}

runs:
  using: composite
  steps:
    # Deliberately BASH, not xtask. The toolchain install necessarily precedes having a
    # working cargo, so the verifier cannot itself be a cargo project without a bootstrap
    # cycle. Same reason fetch-tools is bash.
    - name: Verify + install the pinned toolchain
      id: pin
      shell: bash
      # Inputs reach the shell through the ENVIRONMENT, never through ${{ }} expansion into
      # the script body. Expanding a template directly into `run:` splices caller-controlled
      # text into the command before bash ever parses it, so a crafted input becomes shell
      # code rather than a value -- template injection. Caught here by zizmor, in this very
      # file, which is a fair argument for keeping that scanner blocking.
      env:
        COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        lock=tools/TOOLCHAIN.lock
        [ -f "$lock" ] || { echo "::error::$lock is missing (fail-closed: the pin IS the policy)"; exit 1; }

        channel=$(awk '$1=="channel"{print $2; exit}' "$lock")

        # CHARSET-VALIDATE the channel before it is used anywhere. awk's $2 is a single
        # whitespace-delimited field, so a newline -- the injection vector for GITHUB_ENV,
        # where a second line becomes a second variable -- is already impossible. This makes
        # that guarantee explicit rather than incidental, so it survives someone changing the
        # parse. Same idiom as the component validation below: refuse, do not sanitise.
        case "$channel" in
          "") : ;;  # emptiness is reported by the dedicated check below, with a better message
          *[!A-Za-z0-9._-]*)
            echo "::error::refusing channel '$channel': illegal character. Channels are of the form nightly-YYYY-MM-DD, beta, or X.Y.Z."
            exit 1
            ;;
        esac
        url=$(awk '$1=="manifest-url"{print $2; exit}' "$lock")
        want=$(awk '$1=="sha256"{print $2; exit}' "$lock")
        # Explicit checks rather than `eval "val=\${$v:-}"`. The loop variable came from a
        # literal list, so there was no injection vector -- but eval in a script that gates
        # what compiler gets installed is a hazard waiting for the next edit to arm it, and
        # three straight-line checks are clearer than the indirection they replaced.
        [ -n "$channel" ] || { echo "::error::$lock has no 'channel' field"; exit 1; }
        [ -n "$url" ]     || { echo "::error::$lock has no 'manifest-url' field"; exit 1; }
        [ -n "$want" ]    || { echo "::error::$lock has no 'sha256' field"; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

        # DRIFT CHECK. app/rust-toolchain.toml is what cargo obeys locally; this lock is what
        # CI installs. If they disagree, CI is not building what the repo declares -- a silent
        # discrepancy that would make every downstream posture claim describe the wrong
        # toolchain.
        app=$(awk -F'"' '/^channel/{print $2; exit}' app/rust-toolchain.toml)
        if [ "$app" != "$channel" ]; then
          echo "::error::toolchain drift: TOOLCHAIN.lock says '$channel', app/rust-toolchain.toml says '$app'"
          exit 1
        fi

        # SOAK GATE. Crates get an automatic age check in freeze; the toolchain had none, which
        # is how a same-day nightly reached a signed release candidate without anyone noticing.
        # The policy and its justification live in TOOLCHAIN.lock; this enforces it.
        #
        # Dated channels only (nightly-YYYY-MM-DD / beta-YYYY-MM-DD). A bare `stable` or
        # `nightly` carries no date and is REFUSED outright rather than skipped: a floating
        # channel defeats pinning entirely, so silently allowing it would be the worst outcome.
        min_age=$(awk '$1=="min-age-days"{print $2; exit}' "$lock")
        [ -n "$min_age" ] || { echo "::error::$lock has no 'min-age-days' field"; exit 1; }
        case "$channel" in
          *-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9])
            chan_date="$(printf '%s' "$channel" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}$')"
            ;;
          *)
            echo "::error::channel '$channel' carries no date. A floating channel cannot be soaked or pinned; use a dated nightly/beta."
            exit 1
            ;;
        esac
        now_s=$(date -u +%s)
        chan_s=$(date -u -d "$chan_date" +%s 2>/dev/null) || { echo "::error::cannot parse channel date '$chan_date'"; exit 1; }
        age_days=$(( (now_s - chan_s) / 86400 ))
        echo "channel age: ${age_days}d (policy minimum ${min_age}d)"
        if [ "$age_days" -lt "$min_age" ]; then
          echo "::error::toolchain $channel is ${age_days}d old, below the ${min_age}d soak policy in $lock."
          echo "::error::Rust minor releases needed a point release 42% of the time (1.80+); adopting same-day carries that full exposure. To lower the bar, change min-age-days in a reviewed PR - there is deliberately no override flag."
          exit 1
        fi

        # CONTENT CHECK. rustup verifies each component against this manifest; nothing verifies
        # the manifest against something WE reviewed. That is what this does.
        curl -sSfL --max-time 120 "$url" -o channel-manifest.toml
        got=$(sha256sum channel-manifest.toml | cut -d' ' -f1)
        echo "manifest expected=$want"
        echo "manifest got     =$got"
        if [ "$got" != "$want" ]; then
          echo "::error::channel manifest digest MISMATCH for $channel."
          echo "::error::Either upstream re-published the manifest (verify and update the lock in a reviewed PR) or the fetch was tampered with. Refusing to install."
          exit 1
        fi
        rm -f channel-manifest.toml

        # Routing the input through the environment stopped it becoming shell SYNTAX, which
        # was the injection. It did not stop it becoming unintended ARGUMENTS: an unquoted
        # expansion still word-splits and globs, so a component of `--force` or `*` would have
        # been handed to rustup as a flag or a filename list. Neither is code execution, but
        # neither is what the caller asked for.
        #
        # So: split explicitly, validate each token against a component-name charset, and
        # build an ARRAY so nothing is ever re-split on the command line. A token that is not
        # a plain component name is refused rather than sanitised -- we cannot know what a
        # caller meant by `--force`, only that it is not a component.
        read -ra _comps <<< "${COMPONENTS:-}"
        args=()
        for c in ${_comps[@]+"${_comps[@]}"}; do
          [ -n "$c" ] || continue
          case "$c" in
            [A-Za-z0-9]*) : ;;
            *) echo "::error::refusing component name '$c': must start alphanumeric"; exit 1 ;;
          esac
          case "$c" in
            *[!A-Za-z0-9._-]*) echo "::error::refusing component name '$c': illegal character"; exit 1 ;;
          esac
          args+=(-c "$c")
        done
        rustup toolchain install "$channel" ${args[@]+"${args[@]}"}
        echo "installed $channel (manifest digest verified)"

        # ACTIVATE IT. `rustup toolchain install` INSTALLS; it does not SELECT. Everything
        # above -- the digest verification, the soak gate, the drift check -- described a
        # toolchain that then compiled nothing, because rustup resolves the toolchain from the
        # CWD and falls through to the runner image default when no rust-toolchain.toml is
        # found. Jobs that run cargo from app/ picked up the pin by accident of CWD; the tools
        # job runs from the repo root and got whatever stable the image happened to ship. The
        # `-Z` flag in the build-std work is the only reason it ever became audible.
        #
        # RUSTUP_TOOLCHAIN rather than `rustup default` or a per-call `+channel`:
        #   * it sits ABOVE rust-toolchain.toml in rustup's override order, so a toolchain file
        #     shipped by an UPSTREAM tool source -- which we check out and run cargo inside --
        #     cannot redirect our compiler. That was a second, remote-controlled input.
        #   * it applies to every later step without being named at each call site, so a new
        #     cargo invocation cannot silently opt out by being forgotten.
        export RUSTUP_TOOLCHAIN="$channel"

        # PROVE it, in this step, rather than trusting the export. This assertion is the
        # negative control for the defect above: it fails loudly on any future change that
        # leaves the pin installed-but-inactive, which is precisely the state that produced
        # green checks over an unpinned compiler.
        active=$(rustup show active-toolchain 2>/dev/null | head -1)
        case "$active" in
          "$channel"*) echo "active toolchain: $active" ;;
          *)
            echo "::error::pinned toolchain is installed but NOT active. Expected '$channel', rustup reports '${active:-<none>}'. Refusing to build with an unpinned compiler."
            exit 1
            ;;
        esac

        # Hand it to every subsequent step in the job. GITHUB_ENV does not affect the current
        # step, which is why the export above is separate rather than redundant.
        #
        # zizmor flags any GITHUB_ENV write (github-env, Low confidence) because a value an
        # attacker controls can set variables that change how later steps execute. That is a
        # real class of bug; it does not reach this write, and the reasons are mechanical
        # rather than asserted:
        #
        #   * the value is awk's $2 from one line -- it cannot contain a newline, and a
        #     newline is what turns one variable into two. It is also charset-validated at
        #     the point of parse, above.
        #   * it reaches this line only after matching app/rust-toolchain.toml, parsing as a
        #     date, clearing the soak floor, matching the manifest sha256, and being installed
        #     successfully by rustup. A value that survives that funnel is a real toolchain.
        #
        # Suppressed here, at the line, rather than in a config file: a suppression should be
        # read together with the thing it excuses.
        echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"  # zizmor: ignore[github-env]
