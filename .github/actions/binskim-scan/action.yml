name: BinSkim scan
description: >-
  Fetch a digest-pinned BinSkim, scan a Windows PE OFFLINE against its local PDB, and enforce a
  fail-closed result: the tool MUST actually evaluate the target (0 results + a PDB-load error is a
  couldn't-run, never a pass). Shared by the PR-time early-warning (binskim.yml, report-only) and the
  release verify-chain (release.yml, gating) so the scan logic lives in ONE place (#160).
inputs:
  exe:
    description: Path to the Windows PE to analyze.
    required: true
  symbol-dir:
    description: Directory holding the matching PDB (searched offline; no remote symbol server).
    required: true
  sarif-out:
    description: Path to write the SARIF result to (an inert artifact for sarif-collect to upload).
    required: true
  gate-on-findings:
    description: "true = FAIL on any BinSkim finding (fail>0); false = report-only (findings as warnings). Fail-closed on couldn't-scan applies regardless."
    default: "false"
runs:
  using: composite
  steps:
    # BinSkim ships only as a NuGet LIBRARY. Fetch the versioned nupkg and DIGEST-verify it (a
    # published nupkg is immutable per version, so this sha256 is a content pin) before use.
    - name: Fetch + verify BinSkim (pinned nupkg by sha256)
      shell: pwsh
      env:
        # Version comes from packages.config beside this file (#226: Dependabot's nuget ecosystem
        # watches it and proposes bumps). The sha256 stays HERE as the execution authorization: a
        # Dependabot version bump alone mismatches the digest and fails closed until a human
        # verifies the new nupkg and updates the pin — the version is visibility, the digest is trust.
        BINSKIM_SHA256: "69678989cbc273b5b50fcf98fb0fd978e1e35a3f844acb24254b31f0ce90c447"  # nupkg sha256 for v4.4.9.11 — keep paired with packages.config's version on every bump
      run: |
        [xml]$pkgs = Get-Content "$env:GITHUB_ACTION_PATH/packages.config"
        $env:BINSKIM_VERSION = ($pkgs.packages.package | Where-Object { $_.id -eq "Microsoft.CodeAnalysis.BinSkim" }).version
        if ([string]::IsNullOrEmpty($env:BINSKIM_VERSION)) { throw "BinSkim version not found in packages.config (fail-closed)" }
        $url = "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$env:BINSKIM_VERSION/microsoft.codeanalysis.binskim.$env:BINSKIM_VERSION.nupkg"
        $pkg = "$env:RUNNER_TEMP/binskim.zip"   # .zip so Expand-Archive accepts the nupkg
        Invoke-WebRequest -Uri $url -OutFile $pkg
        $got = (Get-FileHash $pkg -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $env:BINSKIM_SHA256) { throw "BinSkim nupkg sha256 mismatch: got $got, expected $env:BINSKIM_SHA256" }
        Expand-Archive -Path $pkg -DestinationPath "$env:RUNNER_TEMP/binskim" -Force

    # #385: the gate once counted `kind -eq 'fail'` literally. SARIF 2.1.0 leaves `kind` and `level`
    # OPTIONAL with defaults fail / warning, and BinSkim emits findings exactly that way, so a real
    # BA2024 finding counted as nothing on two releases. The triage lives in sarif-triage.ps1 and is
    # proven on a kind-less fixture here, on EVERY run, before it judges the real SARIF.
    - name: Self-test SARIF triage on a kind-less fixture (fail-closed)
      shell: pwsh
      run: |
        . "$env:GITHUB_ACTION_PATH/sarif-triage.ps1"
        $fx = Get-Content "$env:GITHUB_ACTION_PATH/fixtures/kindless-result.sarif" -Raw | ConvertFrom-Json
        $c = Normalize-SarifRun $fx.runs[0]
        $ba = @($fx.runs[0].results)[1]
        if ($c.fail -ne 1 -or $c.pass -ne 1 -or $c.notApplicable -ne 1) { throw "sarif-triage self-test: counts pass=$($c.pass) fail=$($c.fail) na=$($c.notApplicable), expected 1/1/1 (fail-closed)" }
        if ($ba.kind -ne 'fail' -or $ba.level -ne 'warning' -or $ba.message.text -notmatch 'libcmt\.lib') { throw "sarif-triage self-test: kind-less result -> kind=$($ba.kind) level=$($ba.level) text='$($ba.message.text)' (fail-closed)" }
        "sarif-triage self-test: kind-less result counted as fail/warning with resolved text"

    - name: BinSkim analyze (offline, local PDB; fail-closed)
      shell: pwsh
      env:
        BS_EXE: ${{ inputs.exe }}
        BS_SYMDIR: ${{ inputs.symbol-dir }}
        BS_SARIF: ${{ inputs.sarif-out }}
        BS_GATE: ${{ inputs.gate-on-findings }}
      run: |
        $rel = (Resolve-Path $env:BS_SYMDIR).Path
        $exe = (Resolve-Path $env:BS_EXE).Path
        Get-ChildItem $rel -Filter *.pdb | ForEach-Object { "pdb present: $($_.Name)" }
        $binskim = "$env:RUNNER_TEMP/binskim/tools/net9.0/win-x64/BinSkim.dll"
        # --kind Fail Pass Review Open NotApplicable: full rule disposition — Pass proves the scan
        # ran, NotApplicable records why a rule didn't fire (no silent gaps), Review/Open are
        # tool-punted results a human must not miss. No --sympath keeps it offline.
        dotnet "$binskim" analyze "$exe" `
          --local-symbol-directories "$rel" `
          --hashes `
          --insert VersionControlDetails `
          --kind Fail Pass Review Open NotApplicable `
          --output "$env:BS_SARIF"
        $code = $LASTEXITCODE

        # FAIL-CLOSED (always, regardless of gate): a scan that did not evaluate the target is NOT a
        # success. Require executionSuccessful, no error-level notifications, and >=1 PASS result. A
        # passing rule proves BinSkim actually evaluated the binary, so fail==0 can't be a silent
        # no-op (an all-NotApplicable or punted run).
        if (-not (Test-Path $env:BS_SARIF)) { Write-Error "BinSkim produced no SARIF (fail-closed)."; exit 1 }
        $o = Get-Content $env:BS_SARIF -Raw | ConvertFrom-Json
        $inv = $o.runs[0].invocations[0]
        $results = @($o.runs[0].results)
        $errNotes = @(@($inv.toolConfigurationNotifications) + @($inv.toolExecutionNotifications)) |
          Where-Object { $_.level -eq 'error' }
        # #385: apply the SARIF defaults (no kind -> fail, no level -> warning/none) and resolve each
        # result's message text from the rule's messageStrings BEFORE counting, so an omitted property
        # can never read as "no finding". Persisted BEFORE the digest so the custody chain and the
        # code-scanning upload (which rejects text-less results) cover the self-describing bytes.
        . "$env:GITHUB_ACTION_PATH/sarif-triage.ps1"
        $counts = Normalize-SarifRun $o.runs[0]
        $o | ConvertTo-Json -Depth 100 | Set-Content $env:BS_SARIF -Encoding utf8
        $passN = $counts.pass; $failN = $counts.fail; $reviewN = $counts.review; $openN = $counts.open; $naN = $counts.notApplicable
        "binskim: exit=$code executionSuccessful=$($inv.executionSuccessful) pass=$passN fail=$failN review=$reviewN open=$openN informational=$($counts.informational) na=$naN errNotifications=$($errNotes.Count)"

        foreach ($n in $errNotes) { "::error::BinSkim could not scan: $($n.descriptor.id): $($n.message.text)" }
        if ((-not $inv.executionSuccessful) -or ($errNotes.Count -gt 0) -or ($passN -eq 0)) {
          Write-Error "BinSkim did not evaluate the target: need executionSuccessful, no error notifications, and at least one PASS (fail-closed). See the SARIF artifact."
          exit 1
        }
        # Surface findings + Review/Open (tool punted -> needs a human) as warnings.
        foreach ($r in @($results | Where-Object { $_.kind -in @('fail','review','open') })) {
          "::warning::BinSkim $($r.kind)/$($r.level) $($r.ruleId): $(($r.message.text -replace '\s+', ' ').Trim())"
        }
        # GATING (authoritative/release scan): any real finding fails the job. The PR early-warning
        # passes gate=false (report-only). Fail-closed above already ran unconditionally.
        if (($env:BS_GATE -eq 'true') -and ($failN -gt 0)) {
          Write-Error "BinSkim reported $failN finding(s) with gating enabled."
          exit 1
        }
        exit 0
