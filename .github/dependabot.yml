# Dependabot is the intake for dependency bumps; nothing here merges anything.
#
# Shape (#359): per ecosystem, ONE grouped PR for the update types that are same-line by the
# ecosystem's own semver rules, and an individual PR for each major. A grouped PR carries the
# sum of what cleared the 7-day cooldown that week; a backlog of individual PRs can no longer
# exhaust the open-PR cap and silently block the next release (measured: five PRs open from
# 2026-09 held back download-artifact 8.0.2, osv-scanner 2.7.0 and zizmor 0.7/0.8 until
# 2026-11-09). Majors are never grouped and never auto-anything: a major is a maintainer read.
#
# Cargo: patch only is grouped. Rust crates below 1.0 treat MINOR as breaking, and Dependabot's
# "minor" update type does not know that, so minor stays individual for cargo.
# `ignore` is deliberately not used on majors: a hidden hold is lack of information reading as
# clean.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7   # soak: don't adopt <7-day-old releases (zizmor: dependabot-cooldown)
    groups:
      app-patch:
        update-types:
          - "patch"
  - package-ecosystem: nuget
    directory: /.github/actions/binskim-scan
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      binskim-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # codeql-action's three sub-actions share one SHA and must move together (#358).
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: cargo
    directory: /xtask
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      xtask-patch:
        update-types:
          - "patch"
