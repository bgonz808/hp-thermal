
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[policy.xtask]
criteria = "safe-to-deploy"
dev-criteria = "safe-to-deploy"

[[exemptions.memchr]]
version = "2.8.3"
criteria = "safe-to-deploy"
notes = "Compiled into xtask; no safe-to-deploy audit chain in any import set. Dated debt row in supply-chain/policy/vet-debt.json (expires 2027-02-12); xtask vet-guard fails CI when it lapses."

[[exemptions.proc-macro2]]
version = "1.0.107"
criteria = "safe-to-deploy"
notes = "Reachable only through cfg(any()) dependency edges (serde_core -> serde_derive; serde_json -> serde), which no target satisfies; absent from the resolved build graph on both build lanes, verified by `xtask vet-guard` each CI run. Not compiled, not audited; retire this exemption when an imported audit covers the version."

