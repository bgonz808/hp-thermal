[[audits.zmij]]
who = "Robert J Gonzales <bgonz808@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.0.21 -> 1.0.23"
notes = "Reviewed full diff plus an independent adversarial review: Schubfach fallback removed for a single round_up/round_down/last_digit path; new f32 SIMD exponent writer (SSE4.1/NEON) gated by compile-time cfg only (no runtime detection, no #[target_feature]); every asm! is an empty optimizer-barrier comment; every transmute a same-size integer-vector move; all table indices re-derived for every reachable exponent incl. NaN/inf via format_finite; POW10_FIXUPS verified as the old table re-indexed; build.rs adds only an OPT_LEVEL-derived cfg; no new library deps (num-bigint 0.4->0.5 is dev-only). Soundness now rests on the invariant sig>=1 (integral in [0.1*2^52, 2^53)), which nothing asserts; a zero digit count would underflow the new length computation into an unbounded ptr::copy. Differential against core::fmt {:e} (half-even vs core's half-up on exact midpoints, both shortest round-trip; every output parses back bit-identical): 7/7 on release SSE2, +sse4.1, opt-level=s, debug; 70M-value f32 strided sweep; Miri 6/6 on scalar paths (2026-11-12, nightly-2026-10-09)."
