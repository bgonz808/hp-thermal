
# cargo-vet audits file

[[audits.itoa]]
who = "Robert J Gonzales <bgonz808@gmail.com>"
criteria = "safe-to-deploy"
delta = "1.0.15 -> 1.0.18"
notes = "Reviewed full diff plus an independent adversarial review with a bit-exact model (exhaustive u8/u16, millions of wider inputs). All unchecked writes replaced by bounds-checked MaybeUninit writes. Remaining unsafe is table reads and one from_utf8_unchecked whose soundness now depends on four constants (divmod100 SIG/EXP; div_rem_1e16 M_HIGH/SH_POST), verified analytically and numerically; constants checked by eye. No build script, no I/O, no new runtime deps, no_std retained. Gap noted: shipped tests lack a 17-32 digit u128 case; covered by our differential suite against core::fmt under Miri (default and strict-provenance/alignment passes, 7/7 clean, 2026-11-12, nightly-2026-10-09)."

