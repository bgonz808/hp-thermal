# caps evidence — COPIED FORWARD from 5f9af76b9964: source-vantage inventory is a
# function of (rev, lock), both UNCHANGED for this rebuild. What DID change is the
# COMPILER (floating stable -> pinned nightly-2026-07-23, #321) and, for
# cargo-auditable, build-std — codegen, a binary-vantage property. verify-caps at the
# producer confirmed every import surface byte-for-byte unchanged (run 33275419235).
